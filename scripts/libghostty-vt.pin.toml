# Pins of the libghostty-vt build. `scripts/build-libghostty-vt`, the
# `.github/actions/libghostty-vt` action and `build.rs` read this file; nothing
# else downloads or compiles libghostty.

[library]
version = "1.0.2"
# Commit of the `vt-1.0.2` tag.
commit = "573c4a21e02311ae87844af26b6a7a179f82858e"

[source]
url = "https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2.tar.gz"
sha256 = "1dcafa8a3357f3a6bbf4f2696e61de611400c5469518716793dfffd35f008b3e"

[deps]
url = "https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2-deps.tar.gz"
sha256 = "c56156dbea82fdf71f13bf0d704cdf4393b6a04208d7f9691e0d7f60c7f9ca4d"

[zig]
# `version` and `linux_x86_64_sha256` must equal ZIG_VERSION and ZIG_SHA256 in
# .github/workflows/ci.yml and pinned-cache-offline.yml;
# scripts/tests/test_libghostty_vt.py checks it.
version = "0.17.0"
# sha256 of zig-x86_64-linux-<version>.tar.xz as published by ziglang.org.
linux_x86_64_sha256 = "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
# Public key that signs the tarballs (PACKAGING-LIBGHOSTTY.md of the release).
minisign_public_key = "RWQlAjJC23149WL2sEpT/l0QKy7hMIFhYdQOFy0Z7z7PbneUgvlsnYcV"

[limits]
# Largest growth of a stripped aarch64-apple-darwin release binary that linking
# the library may cause (3 MiB); the macOS job of
# .github/workflows/libghostty-vt.yml fails above it.
max_stripped_size_delta_bytes = 3145728

[build]
optimize = "ReleaseFast"
cpu = "baseline"
strip = "true"
download_timeout_seconds = 300
# The download host answers HTTP 403 to the default `Python-urllib` agent, so
# the request names itself. A failed attempt (network error, 5xx, 429) is
# retried with a doubling wait; any other HTTP status fails at once.
user_agent = "pohunek-libghostty-build/1 (+https://github.com/zajca/pohunek)"
download_attempts = 3
download_backoff_seconds = 10
# The two tarballs are about 10 MB together.
max_download_bytes = 67108864
# Kitty graphics are compiled out: the headless model renders no images and a
# program in the PTY can then never make the worker open a file.
vt_features = "-kitty-graphics"

# Rust target triple to Zig target.
[targets]
x86_64-unknown-linux-gnu = "x86_64-linux-gnu.2.39"
x86_64-unknown-linux-musl = "x86_64-linux-musl"
aarch64-apple-darwin = "aarch64-macos.14.0"
