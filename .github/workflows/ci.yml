name: CI

# Test everything on every push to main and on every pull request: formatting,
# lints (warnings are errors), the full test suite, and a release build of both
# binaries so a broken release profile is caught before tagging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly sweep to catch regressions in jobs that are path-filtered out on
  # normal PRs (issue #125). Runs at 05:00 UTC every Monday; `pull_request_target`
  # is intentionally avoided to keep the default pull-request provenance model.
  schedule:
    - cron: '0 5 * * 1'


# Cancel superseded runs on the same ref to save CI minutes. The event name is
# part of the group so a manual (workflow_dispatch) full run never cancels an
# in-progress push or weekly sweep on the same ref (and vice versa).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation in CI: rust-cache strips incremental
  # artifacts before persisting anyway, so producing them only wastes time.
  # Kept explicit (issue #124) so every job benefits even before restore.
  CARGO_INCREMENTAL: "0"
  # NOTE (issue #124): SCCACHE_GHA_ENABLED/RUSTC_WRAPPER and the mold
  # -C link-arg=-fuse-ld=mold RUSTFLAGS live in each Rust job's `env`, not
  # here. Workflow-level RUSTC_WRAPPER would also wrap jobs that never run
  # the sccache-action step (e.g. cargo-audit's `cargo install`), which fails
  # with "could not execute process `sccache ...` (never executed)".

jobs:
  platform-contracts:
    name: platform contracts (arm64)
    # macOS runners are costly (issue #125): run only on schedule, push to
    # main, manual dispatch (always a full run), or when platform inputs
    # change via the paths filter.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true' }}
    needs: changes
    runs-on: macos-15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Compile against the oldest supported macOS SDK contract. Runtime
      # acceptance on macOS 14 remains an explicit release milestone.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # sccache runs on macOS too (content-keyed GHA backend); mold stays
      # Linux-only via the job-level RUSTFLAGS override above.
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Check shared platform contracts
        run: cargo check --locked -p pohunek-platform --all-targets

      # The launchd backend and its integration tests compile only on macOS,
      # so the Linux clippy gate never sees them.
      - name: Lint shared platform contracts
        run: cargo clippy --locked -p pohunek-platform --all-targets -- -D warnings

      # Covers the Darwin process backend: same-user facts, descendants, cwd,
      # executable identity, controlling-terminal foreground groups, ownership
      # markers, and the kqueue `NOTE_EXIT` watch. It also covers the Darwin
      # peer backend: `LOCAL_PEERCRED` for the owner, `LOCAL_PEERPID` for the
      # process id, and the `last_pid` drift that `Binding::revalidate` must
      # reject. It also runs `tests/launchd.rs` against the runner's real
      # `gui/<uid>` domain. Those paths exist only on a native runner, so this
      # step is the only gate that executes them.
      - name: Test shared platform contracts
        run: cargo test --locked -p pohunek-platform

      - name: Test APFS foreign-owner rejection
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" CARGO_TARGET_DIR=/tmp/pohunek-platform-root-target TMPDIR=/tmp MACOSX_DEPLOYMENT_TARGET=14.0 RUSTFLAGS='-D warnings' cargo test --locked -p pohunek-platform filesystem::tests::apfs_foreign_owned_private_directory_is_rejected -- --ignored --exact

      - name: Verify native APFS test volume
        run: diskutil info / | grep -q 'Type (Bundle):.*apfs'

      - name: Check shared path contracts
        run: cargo check --locked -p pohunek-paths --all-targets

      - name: Test shared path contracts
        run: cargo test --locked -p pohunek-paths

      # The private daemon-to-worker protocol carries no target-specific code,
      # and the peer identity work in issue #98 must keep it that way: a check
      # here fails the moment a platform assumption leaks into the wire crate.
      - name: Check private worker protocol
        run: cargo check --locked -p pohunek-worker-protocol --all-targets

      # The durable session worker: its PTY readiness, attach ordering, output
      # drain, and stop escalation. The whole crate runs here rather than a
      # named subset, because there is no telling in advance which test catches
      # a Darwin difference. launchd supervision stays with issue #100.
      - name: Check session worker
        run: cargo check --locked -p pohunek-session-worker --all-targets

      - name: Test session worker
        run: cargo test --locked -p pohunek-session-worker

      # Prints the idle CPU and descriptor counts the resource test asserts on,
      # so the native measurements are readable from the job log.
      - name: Measure session worker resources
        run: cargo test --locked -p pohunek-session-worker --test resources -- --nocapture

      # Exercise the issue-#96 Hermes filesystem lifecycle natively as well.
      - name: Check Hermes filesystem lifecycle
        run: cargo check --locked -p pohunek-cli --lib

      - name: Test Hermes filesystem lifecycle
        run: cargo test --locked -p pohunek-cli --lib hermes_integration::lifecycle::tests

      # Issue #100: every launchd suite needs the logged-in GUI session's
      # `gui/<uid>` domain. Its absence is a hard failure, never a skip.
      - name: Require the launchd gui domain
        run: /bin/launchctl print "gui/$(id -u)" >/dev/null

      - name: Check daemon, CLI, and service configuration
        run: cargo check --locked -p pohunek-daemon -p pohunek-cli -p pohunek-service-config --all-targets

      - name: Lint daemon, CLI, worker, and service configuration
        run: cargo clippy --locked -p pohunek-daemon -p pohunek-cli -p pohunek-session-worker -p pohunek-service-config -p pohunek-worker-protocol -p pohunek-paths --all-targets -- -D warnings

      # Daemon and CLI integration tests spawn the real binaries by path.
      - name: Build daemon, worker, and CLI binaries
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli --bins

      - name: Test service configuration
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-service-config

      # Daemon and CLI tests build their trusted roots and sockets under
      # these fixture roots, so their Darwin contract is checked first.
      - name: Test fixture roots
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-test-support

      - name: Test daemon
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: cargo test --locked -p pohunek-daemon --no-fail-fast

      - name: Test CLI
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: cargo test --locked -p pohunek-cli --no-fail-fast

  test:
    name: fmt + clippy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

  fast-tests:
    name: tests (${{ matrix.shard }}, fast)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, daemon, relay, cli]
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-
      - uses: taiki-e/install-action@cargo-nextest

      - name: Check script regressions
        if: matrix.shard == 'unit'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # No dependency on Clippy, PostgreSQL, PTYs, or the release build.
      - name: Run fast shard
        run: python3 scripts/test-partitions run "${{ matrix.shard }}"

      - name: Upload shard timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

    # Determine which CI jobs the changed files require. Heavy non-default jobs
  # (feature-powerset, unused-deps, macOS contracts, Hermes compatibility, and
  # TS-binding drift) only run when their inputs change or on a schedule; the
  # always-critical jobs (fmt, clippy, fast tests, heavy tests, release build,
  # docs check, relay DB) still run on every push and PR. The workflow file
  # itself forces a relay run so filter edits are always validated.
  changes:
    name: required jobs (paths filter)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      feature_matrix: ${{ steps.filter.outputs.feature_matrix }}
      udeps: ${{ steps.filter.outputs.udeps }}
      macos: ${{ steps.filter.outputs.macos }}
      hermes: ${{ steps.filter.outputs.hermes }}
      docs_ts: ${{ steps.filter.outputs.docs_ts }}
    steps:
      # Push events (after merge to main) resolve the filter with git commands
      # against the previous commit, which needs more than a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relay:
              - 'crates/relay/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay/migrations/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            # cargo-hack feature-powerset is expensive (issue #125): run only
            # on schedule or when the dependency graph, feature set, or any
            # workspace Rust source changes — the powerset compiles feature
            # branches of source code, not just manifests.
            feature_matrix:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'crates/**/*.rs'
            # cargo-udeps needs the nightly toolchain and a full workspace
            # dependency resolution (issue #125): schedule-only plus Cargo.toml,
            # Cargo.lock changes, the workflow file, workspace Rust sources (an
            # unused dependency usually appears by deleting its last use), and
            # the xtask inputs that configure the unused-dependency scan.
            udeps:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'crates/**/*.rs'
              - 'crates/xtask/src/checks.rs'
              - 'crates/xtask/src/lib.rs'
            # macOS platform, path, private-protocol, session-worker, daemon,
            # CLI, launchd, and Hermes filesystem contracts run on the native
            # arm64 runner (issues #96-#100 and #125): gate on every crate
            # exercised by the job and every crate the daemon and CLI link, the cross-platform dependency graph, and
            # the Cargo configuration (.cargo/config.toml carries Apple-specific
            # linker/target flags that can break only the macOS build). The root
            # manifest is included because these crates inherit workspace
            # package, dependency, and lint settings from it.
            macos:
              - 'Cargo.toml'
              - 'crates/platform/**'
              - 'crates/paths/**'
              - 'crates/worker-protocol/**'
              - 'crates/session-worker/**'
              - 'crates/terminal/**'
              - 'crates/logging/**'
              - 'crates/service-config/**'
              - 'crates/test-support/**'
              - 'crates/daemon/**'
              - 'crates/cli/**'
              - 'crates/protocol/**'
              - 'crates/client/**'
              - 'crates/knowledge/**'
              - 'crates/hostcheck/**'
              - 'crates/netbird/**'
              - 'crates/overlay/**'
              - 'crates/prompt/**'
              - 'crates/gui-core/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'docs/knowledge/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            # Pinned Hermes compatibility provisioning + runtime check
            # (issue #125): gate on the locked runtime metadata, the full CLI
            # surface (the gate drives the CLI parser/dispatch, not just the
            # hermes_integration module), the xtask tree (its lib.rs owns the
            # `TopCommand::Hermes` dispatch that drives the harness), the
            # provisioner and its test, and the dependency graph the pinned
            # run links against (portable-pty, vt100, clap, ...). The paths
            # and protocol crates are included because `pohunek integration`
            # resolves its install home via `pohunek_paths::state_home()` and
            # negotiates via `pohunek_protocol` types
            # (`SUPPORTED_PROTOCOL_VERSIONS`, `IntegrationRecovery`).
            hermes:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'compat/hermes/**'
              - 'crates/cli/Cargo.toml'
              - 'crates/cli/src/**'
              - 'crates/paths/**'
              - 'crates/protocol/**'
              - 'crates/xtask/Cargo.toml'
              - 'crates/xtask/src/**'
              - 'scripts/provision-hermes-compat'
              - 'scripts/tests/provision-hermes-compat.sh'
              - '.github/workflows/ci.yml'
            # Generated TS binding drift lives under a schedule or when the
            # protocol surface or generation driver changes (issue #125).
            # Covers both generators' inputs and outputs: the main protocol
            # bindings plus the relay bindings (`crates/relay-protocol`, its
            # `pohunek-relay-protocol` ts-rs export, `relay-generated`, and the
            # emitted JSON fixtures) that `cargo xtask ts check` regenerates.
            docs_ts:
              - 'crates/protocol/**'
              - 'crates/relay-protocol/**'
              - 'crates/xtask/Cargo.toml'
              - 'crates/xtask/src/**'
              - 'web/shared/src/generated/**'
              - 'web/shared/src/relay-generated/**'
              - 'web/shared/fixtures/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  integration:
    name: tests (heavy, PTY + Hermes)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      # The daemon socket tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`). Nextest only builds test harnesses,
      # never the runnable binary, so build it explicitly first.
      - name: Build session worker for daemon tests
        run: cargo build -p pohunek-session-worker --bin pohunek-sessiond

      - name: Verify exhaustive disjoint test partitions
        run: python3 scripts/test-partitions check

      - name: Heavy tests (bounded nextest concurrency)
        run: python3 scripts/test-partitions run heavy

      # Per-test timing evidence for the test-performance work (JUnit `time`
      # attributes). Nextest writes the report under its own storage directory.
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-heavy
          path: target/nextest/heavy/junit.xml
          if-no-files-found: warn

  # Issue #100: the ignored real-systemd suites drive the runner's own systemd
  # user manager (transient worker units, the namespaced daemon unit, and the
  # `pohunek service` transactions). Hosted Ubuntu runners run a user manager
  # without lingering; the bus address is exported because the job shell does
  # not carry one.
  systemd-supervision:
    name: real systemd supervision
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_SYSTEMD_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Require a running systemd user manager
        run: |
          systemctl --version | head -n 1
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${XDG_RUNTIME_DIR}/bus" >> "$GITHUB_ENV"
          systemctl --user is-system-running --wait || systemctl --user is-system-running | grep -qx degraded

      - name: Build daemon, worker, and CLI binaries
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli --bins

      - name: Export binary paths
        run: |
          echo "POHUNEK_DAEMON_BIN=$PWD/target/debug/pohunekd" >> "$GITHUB_ENV"
          echo "POHUNEK_WORKER_BIN=$PWD/target/debug/pohunek-sessiond" >> "$GITHUB_ENV"
          echo "POHUNEK_CLI_BIN=$PWD/target/debug/pohunek" >> "$GITHUB_ENV"

      - name: Platform systemd backend
        run: cargo test --locked -p pohunek-platform --test systemd -- --ignored --test-threads 1

      - name: Daemon durability on transient units
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test systemd_durable_worker -- --ignored --test-threads 1

      - name: pohunek service transactions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test service_systemd -- --ignored --test-threads 1

      - name: Supervised worker lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test supervised_lifecycle -- --ignored --test-threads 1

      - name: pohunek service upgrade with live workers
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test service_upgrade -- --ignored --test-threads 1

  # Relay heavy tests are the only PostgreSQL fixture consumers, so they get
  # their own job whose Postgres service only starts when relay-relevant files
  # changed (issue #121) — except on the weekly sweep and manual dispatch,
  # which are documented as full runs even when the paths filter is empty.
  # Push to main stays filtered on purpose: the merged commit's relay files
  # still trigger the job via fetch-depth-2 detection, while unrelated pushes
  # never start the Postgres service.
  integration-relay:
    name: tests (relay DB, PostgreSQL)
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Relay database tests (bounded nextest concurrency)
        run: python3 scripts/test-partitions run relay-db
        env:
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          POHUNEK_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/pohunek_test

      - name: Upload relay DB test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-relay-db
          path: target/nextest/relay-db/junit.xml
          if-no-files-found: warn

  release-check:
    name: doctests + release build
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      # Nextest does not execute rustdoc tests; preserve the cargo test gate.
      - name: Documentation tests
        run: cargo test --doc --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release

  # TS-binding drift is gated by paths filter (issue #125); it only runs on
  # schedule, push to main, manual dispatch (always a full run), or when the
  # protocol/generation inputs change.
  # It is kept as its own job so `docs check` always runs every PR.
  ts-drift:
    name: TS binding drift (xs check)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_ts == 'true' }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: TS binding drift
        run: cargo xtask ts check
        env:
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold

  hermes-compatibility:
    name: pinned Hermes compatibility (model-free)
    runs-on: ubuntu-latest
    needs: [build-bins, changes]
    if: ${{ needs.build-bins.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.hermes == 'true') }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      # Cache the provisioned pinned Hermes runtime. Inputs that drive
      # provisioning: the lock file, the provisioner script, its test, the
      # exact resolved Python interpreter (the venv's `pyvenv.cfg` hard-links
      # to it, so a runner-image Python bump invalidates the runtime), and the
      # workflow itself (see scripts/provision-hermes-compat); uv itself is
      # already cached via `enable-cache` above, so this is just the resolved
      # venv. Key on all of them so a provisioner change re-provisions.
      - name: Cache Hermes runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      # The compatibility gate itself is driven by `cargo xtask`, which is built
      # from source in this job, so a toolchain is still required here.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Check fail-closed Hermes provisioning
        run: scripts/tests/provision-hermes-compat.sh

      - name: Provision locked Hermes runtime
        id: hermes
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/hermes-compat-cache"
          install_dir="$RUNNER_TEMP/hermes-compat"
          if [[ -d "$cache_dir" ]]; then
            # Cache hit: restore the previously provisioned runtime. The
            # provisioner emits the executable at `venv/bin/hermes` inside the
            # install root; fail closed if the restored cache lacks it.
            rm -rf "$install_dir"
            cp -a "$cache_dir" "$install_dir"
            hermes_bin="$install_dir/venv/bin/hermes"
          else
            hermes_bin="$(scripts/provision-hermes-compat "$install_dir")"
            # Stage the fresh runtime for caching. Copy errors fail the step
            # (no `|| true`): a partial cache_dir under an immutable key
            # would poison every later run until the key changes. The staged
            # copy must contain the executable too — the post-check below only
            # verifies install_dir, not the copy.
            rm -rf "$cache_dir"
            cp -a "$install_dir" "$cache_dir"
            [[ -f "$cache_dir/venv/bin/hermes" && -x "$cache_dir/venv/bin/hermes" ]] \
              || { echo "cached Hermes copy incomplete at $cache_dir/venv/bin/hermes" >&2; exit 1; }
          fi
          [[ -f "$hermes_bin" && -x "$hermes_bin" ]] \
            || { echo "provisioned Hermes executable missing at $hermes_bin" >&2; exit 1; }
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Download built CLI
        uses: actions/download-artifact@v4
        with:
          name: pohunek-bins
          path: target/debug

      - name: Check pinned Hermes compatibility
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/debug/pohunek
          pohunek_bin="$(realpath target/debug/pohunek)"
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "$pohunek_bin"

      # Persist the staged runtime only after the compatibility gate passed:
      # `if: success()` plus this position (after the check) means a broken
      # or partial runtime is never uploaded under the immutable cache key.
      - name: Persist Hermes runtime cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

  # Build the three runnable binaries exactly once. The web e2e and pinned
  # Hermes jobs reuse this artifact instead of each rebuilding Rust, which used
  # to cost a full duplicate build per job (issue #122).
  build-bins:
    name: build bins (pohunekd + pohunek-sessiond + pohunek)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries are needed.
      - name: Build daemon, session worker, and CLI
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: pohunek-bins
          path: |
            target/debug/pohunekd
            target/debug/pohunek-sessiond
            target/debug/pohunek
          if-no-files-found: error

  web:
    name: web SDK + control center
    runs-on: ubuntu-latest
    needs: build-bins
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `bun install` re-downloads every registry tarball without a cache.
      # Reuse Bun's global package cache, keyed by web/bun.lock and the
      # setup-bun bun-version pin above, so repeat runs install from disk
      # instead of the network.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun run typecheck

      - name: Lint web
        working-directory: web
        run: bun run lint

      - name: Test web
        working-directory: web
        run: bun test

      # Build once, reuse for the Playwright e2e below. `bun run test:e2e`
      # rebuilds the frontend itself, so invoke the Playwright CLI directly.
      - name: Build web control center
        working-directory: web
        run: bun run build:frontend

      # The lockfile pins the Playwright version, so its browser build is
      # derived from web/bun.lock instead of a hand-maintained literal.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --only-shell chromium

      - name: Test web control center
        working-directory: web
        run: bun ./node_modules/@playwright/test/cli.js test --config frontend/playwright.config.ts

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries must be present.
      # They come from the build-bins artifact (issue #122): no Rust toolchain,
      # sccache, or cargo cache is needed in this job.
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: pohunek-bins
          path: target/debug

      - name: Restore executable bits on downloaded binaries
        run: chmod +x target/debug/pohunekd target/debug/pohunek-sessiond target/debug/pohunek

      - name: SDK e2e against real daemon
        working-directory: web
        run: bun test sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Backend e2e against real daemon
        working-directory: web
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd
          POHUNEK_CLI_BIN: ${{ github.workspace }}/target/debug/pohunek
          POHUNEK_PYTHON_BIN: /usr/bin/python3

  # Dependency hygiene (M-STATIC-VERIFICATION): security advisories, the Cargo
  # feature matrix, and unused dependencies. Kept off the critical `test` job so
  # an advisory in a transitive crate stays visible without masking a real
  # failure.
  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: docs check (schema + drift + source-map + runbooks + secrets + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: docs check
        run: cargo xtask docs check
        env:
          RUSTFLAGS: -D warnings

  feature-matrix:
    name: cargo-hack (feature powerset)
    runs-on: ubuntu-latest
    # Expensive (issue #125): run only on schedule, push to main, manual
    # dispatch (always a full run), or when the dependency graph / feature
    # set / CI workflow changes.
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.feature_matrix == 'true' }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Validates every feature combination compiles. knowledge gates its
      # protocol bridge behind the `protocol` feature; --all-features only
      # exercises the everything-on case.
      - name: Check feature powerset
        run: cargo hack --feature-powerset --workspace clippy --all-targets

  udeps:
    name: cargo-udeps (unused dependencies)
    runs-on: ubuntu-latest
    # Needs the nightly toolchain + full workspace resolution (issue #125):
    # schedule-only, push to main, manual dispatch (always a full run), or
    # when Cargo.toml / Cargo.lock / CI change.
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.udeps == 'true' }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets --all-features
