name: CI

# Test everything on every push to main and on every pull request: formatting,
# lints (warnings are errors), the full test suite, and a release build of both
# binaries so a broken release profile is caught before tagging. Doctests run on
# every pull request. The release build (job `release-build`) runs on push to
# main, the weekly schedule, and manual dispatch, and on pull requests only when
# the `release` paths filter matches (manifests, lockfile, .cargo, toolchain
# pins, the release/CI workflows, scripts/release, packaging).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly sweep to catch regressions in jobs that are path-filtered out on
  # normal PRs (issue #125). Runs at 05:00 UTC every Monday; `pull_request_target`
  # is intentionally avoided to keep the default pull-request provenance model.
  schedule:
    - cron: '0 5 * * 1'


# Cancel superseded runs on the same ref to save CI minutes. The event name is
# part of the group so a manual (workflow_dispatch) full run never cancels an
# in-progress push or weekly sweep on the same ref (and vice versa).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation in CI: rust-cache strips incremental
  # artifacts before persisting anyway, so producing them only wastes time.
  # Kept explicit (issue #124) so every job benefits even before restore.
  CARGO_INCREMENTAL: "0"
  # Test binaries (issue #170): job `build-tests` compiles the workspace test
  # binaries once (`cargo nextest archive --workspace --all-features`) and
  # uploads the archive. The test jobs (fast shards, heavy, relay DB) download
  # it and run from it via scripts/test-partitions --archive-file; they install
  # only cargo-nextest, no rust-cache (the heavy job also needs a toolchain with
  # Clippy and the fetched crate sources for xtask::dependency_policy). Tests
  # resolve binaries and sources at run time (`CARGO_BIN_EXE_*`,
  # `CARGO_MANIFEST_DIR`, the worker beside the test binaries), so the archive
  # is relocatable: the test jobs check the repository out into `relocated/`,
  # a different absolute path than the one `build-tests` compiled at, and every
  # run proves it. `.config/nextest.toml` archive.include makes the archive
  # build fail when pohunek-sessiond is missing, so a test never runs without
  # its worker.
  # Job `build-bins` stays a separate default-feature build: the archive
  # compiles with --all-features, which enables cli's `test-util` seams, and
  # the web e2e and Hermes compatibility jobs must exercise shipped binaries.
  # Compile cache (issue #164): Swatinem/rust-cache is the only compile-cache
  # layer. Each Rust job restores the entry of its job type (`shared-key`:
  # clippy, test-debug, bins, release, xtask, docs, hack, nightly-udeps,
  # platform-contracts). The full key also hashes the toolchain, the
  # RUST*/CARGO* environment (RUSTFLAGS included), and the Cargo manifests.
  # rust-cache saves only on a key miss and the first finisher wins, so each
  # key has exactly one designated saver, the job that builds the superset
  # of the key's artifacts; every other job in the group sets `save-if:
  # false`. The saver saves only for refs/heads/main (push, schedule, and
  # dispatch on main): PR runs restore main's entries and never evict them.
  # The mold -C link-arg=-fuse-ld=mold RUSTFLAGS live in each Linux Rust
  # job's `env`, not here, because the macOS and docs jobs do not install
  # mold. .github/actions/setup-mold puts mold on PATH without touching
  # /usr/bin/ld: only those RUSTFLAGS select mold.
  # Pinned mold release for .github/actions/setup-mold. MOLD_SHA256 is the
  # sha256 GitHub publishes for the release asset
  # mold-2.42.1-x86_64-linux.tar.gz (`gh api repos/rui314/mold/releases/tags/v2.42.1`,
  # asset `digest`), cross-checked against a local download. Bump both together.
  MOLD_VERSION: "2.42.1"
  MOLD_SHA256: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855

jobs:
  platform-contracts:
    name: platform contracts (arm64)
    # macOS runners are costly (issue #125): run only on schedule, push to
    # main, manual dispatch (always a full run), or when platform inputs
    # change via the paths filter.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true' }}
    needs: changes
    runs-on: macos-15
    env:
      # Compile against the oldest supported macOS SDK contract. Runtime
      # acceptance on macOS 14 remains an explicit release milestone.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      # The Hermes integration tests in pohunek-cli stand in for the pinned
      # runtime with a canonical Python >= 3.10 that imports `yaml` and passes
      # the production runtime policy (crates/cli/src/hermes_integration/
      # test_python.rs): owned by root or the runner user, no group/other write
      # bit on the file or any ancestor. The hosted interpreters (setup-python
      # framework builds, Homebrew) live in shared, group-writable trees and
      # are not relocatable, so the step installs a relocatable standalone
      # CPython with uv into a private directory this job owns and applies the
      # same checks before exporting the path. PyYAML goes into that
      # interpreter itself because a venv interpreter canonicalizes to the base
      # binary and would lose its site-packages.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Require the Hermes test interpreter
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          uid="$(id -u)"
          if stat -f '%u %Lp' / >/dev/null 2>&1; then
            stat_fields() { stat -f '%u %Lp' "$1"; }
          else
            stat_fields() { stat -c '%u %a' "$1"; }
          fi

          # Mirrors validate_runtime/validate_safe_ancestors: owner is root or
          # this user, and no group/other write bit unless a root-owned sticky
          # directory. Prints every path so a rejection is self-diagnosing.
          policy_violations=0
          check_path() {
            local path="$1" owner mode
            read -r owner mode < <(stat_fields "$path")
            printf '  %s uid=%s mode=%s\n' "$path" "$owner" "$mode"
            if [[ "$owner" != "$uid" && "$owner" != 0 ]]; then
              echo "  REJECT: owner uid $owner is neither $uid nor root: $path" >&2
              policy_violations=1
            fi
            if (( (8#$mode & 8#022) != 0 )); then
              if [[ -d "$path" && "$owner" == 0 && -k "$path" ]]; then
                :
              else
                echo "  REJECT: group/other write bit (mode $mode): $path" >&2
                policy_violations=1
              fi
            fi
          }

          private_root="$RUNNER_TEMP/hermes-test-python"
          rm -rf "$private_root"
          install -d -m 700 "$private_root"
          private_root="$(cd "$private_root" && pwd -P)"
          export UV_PYTHON_INSTALL_DIR="$private_root/install"
          export UV_PYTHON_BIN_DIR="$private_root/bin-links"
          install -d -m 700 "$UV_PYTHON_INSTALL_DIR" "$UV_PYTHON_BIN_DIR"
          uv python install 3.12 --no-config
          found="$(uv python find 3.12 --no-config --no-project --managed-python)"
          python_bin="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$found")"
          [[ "$python_bin" == "$private_root"/install/* ]] \
            || { echo "resolved interpreter escapes the private install: $found -> $python_bin" >&2; exit 1; }
          uv pip install --no-config --link-mode copy --python "$python_bin" --break-system-packages pyyaml==6.0.2
          # Symlinks keep their targets' modes; only real entries are changed.
          find "$private_root" -not -type l -exec chmod go-w {} +

          echo "Hermes test interpreter candidate: $python_bin" >&2
          resolved="$("$python_bin" -I -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          [[ "$resolved" == "$python_bin" ]] \
            || { echo "interpreter is not canonical: $resolved != $python_bin" >&2; exit 1; }
          prefix="$("$python_bin" -I -c 'import os, sys; print(os.path.realpath(sys.prefix))')"
          [[ "$prefix" == "$private_root"/install/* ]] \
            || { echo "interpreter prefix is outside the private install: $prefix" >&2; exit 1; }
          path="$python_bin"
          while :; do
            check_path "$path"
            [[ "$path" == / ]] && break
            path="$(dirname "$path")"
          done
          (( policy_violations == 0 )) \
            || { echo "Hermes test interpreter violates the runtime policy: $python_bin" >&2; exit 1; }
          "$python_bin" -I -c 'import sys, yaml; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' \
            || { echo "Hermes test interpreter lacks Python >= 3.10 with PyYAML: $python_bin" >&2; exit 1; }
          printf 'POHUNEK_PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-contracts
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check shared platform contracts
        run: cargo check --locked -p pohunek-platform --all-targets

      # The launchd backend and its integration tests compile only on macOS,
      # so the Linux clippy gate never sees them.
      - name: Lint shared platform contracts
        run: cargo clippy --locked -p pohunek-platform --all-targets -- -D warnings

      # Covers the Darwin process backend: same-user facts, descendants, cwd,
      # executable identity, controlling-terminal foreground groups, ownership
      # markers, and the kqueue `NOTE_EXIT` watch. It also covers the Darwin
      # peer backend: `LOCAL_PEERCRED` for the owner, `LOCAL_PEERPID` for the
      # process id, and the `last_pid` drift that `Binding::revalidate` must
      # reject. It also runs `tests/launchd.rs` against the runner's real
      # `gui/<uid>` domain. Those paths exist only on a native runner, so this
      # step is the only gate that executes them.
      - name: Test shared platform contracts
        run: cargo test --locked -p pohunek-platform

      - name: Test APFS foreign-owner rejection
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" CARGO_TARGET_DIR=/tmp/pohunek-platform-root-target TMPDIR=/tmp MACOSX_DEPLOYMENT_TARGET=14.0 RUSTFLAGS='-D warnings' cargo test --locked -p pohunek-platform filesystem::tests::apfs_foreign_owned_private_directory_is_rejected -- --ignored --exact

      - name: Verify native APFS test volume
        run: diskutil info / | grep -q 'Type (Bundle):.*apfs'

      - name: Check shared path contracts
        run: cargo check --locked -p pohunek-paths --all-targets

      - name: Test shared path contracts
        run: cargo test --locked -p pohunek-paths

      # The private daemon-to-worker protocol carries no target-specific code,
      # and the peer identity work in issue #98 must keep it that way: a check
      # here fails the moment a platform assumption leaks into the wire crate.
      - name: Check private worker protocol
        run: cargo check --locked -p pohunek-worker-protocol --all-targets

      # The durable session worker: its PTY readiness, attach ordering, output
      # drain, and stop escalation. The whole crate runs here rather than a
      # named subset, because there is no telling in advance which test catches
      # a Darwin difference. launchd supervision stays with issue #100.
      - name: Check session worker
        run: cargo check --locked -p pohunek-session-worker --all-targets

      - name: Test session worker
        run: cargo test --locked -p pohunek-session-worker

      # Prints the idle CPU and descriptor counts the resource test asserts on,
      # so the native measurements are readable from the job log.
      - name: Measure session worker resources
        run: cargo test --locked -p pohunek-session-worker --test resources -- --nocapture

      # Exercise the issue-#96 Hermes filesystem lifecycle natively as well.
      - name: Check Hermes filesystem lifecycle
        run: cargo check --locked -p pohunek-cli --lib

      - name: Test Hermes filesystem lifecycle
        run: cargo test --locked -p pohunek-cli --lib hermes_integration::lifecycle::tests

      # Issue #100: every launchd suite needs the logged-in GUI session's
      # `gui/<uid>` domain. Its absence is a hard failure, never a skip.
      - name: Require the launchd gui domain
        run: /bin/launchctl print "gui/$(id -u)" >/dev/null

      - name: Check daemon, CLI, and service configuration
        run: cargo check --locked -p pohunek-daemon -p pohunek-cli -p pohunek-service-config --all-targets

      - name: Lint daemon, CLI, worker, and service configuration
        run: cargo clippy --locked -p pohunek-daemon -p pohunek-cli -p pohunek-session-worker -p pohunek-service-config -p pohunek-worker-protocol -p pohunek-paths --all-targets -- -D warnings

      # Daemon and CLI integration tests spawn the real binaries by path, so
      # build them even when an earlier suite failed.
      - name: Build daemon, worker, and CLI binaries
        if: ${{ !cancelled() }}
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli --bins

      - name: Test service configuration
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-service-config

      # Daemon tests build their trusted roots and sockets under
      # these fixture roots, so their Darwin contract is checked first.
      - name: Test fixture roots
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-test-support

      - name: Test daemon
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon

      - name: Test CLI
        # Independent suites: report each even when an earlier one failed.
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli

      # Native GUI crate: compile- and lint-checked and tested here, then the
      # real GUI, daemon, and session worker run under a Finder-like environment
      # (scripts/acceptance/macos-gui-launch). Exit status 2 means the runner
      # has no window server; that fails the job, it is never a skip.
      - name: Check and lint GUI and host probes
        if: ${{ !cancelled() }}
        run: |
          cargo check --locked -p pohunek-gui -p pohunek-hostcheck --all-targets
          cargo clippy --locked -p pohunek-gui -p pohunek-hostcheck --all-targets -- -D warnings

      # GUI core: its keyring backend is `apple-native` only here.
      - name: Check and lint GUI core
        if: ${{ !cancelled() }}
        run: |
          cargo check --locked -p pohunek-gui-core --all-targets
          cargo clippy --locked -p pohunek-gui-core --all-targets -- -D warnings

      - name: Test GUI and host probes
        if: ${{ !cancelled() }}
        # A test waiting on a child process must fail with evidence, never hold
        # the runner for hours.
        timeout-minutes: 15
        run: cargo test --locked -p pohunek-gui -p pohunek-hostcheck

      - name: Build GUI binary
        if: ${{ !cancelled() }}
        run: cargo build --locked -p pohunek-gui --bins

      - name: GUI launch acceptance
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GUI_ACCEPT_BIN_DIR: ${{ github.workspace }}/target/debug
        run: scripts/acceptance/macos-gui-launch

      # Throwaway keychain for tests/keychain_macos.rs. It becomes the only
      # keychain in the user search list and the user default, so the real
      # keyring backend never sees the runner's login keychain. The password
      # exists only in this step's shell, is masked, and is never written to
      # disk or the environment. The 3600 s auto-lock outlasts a cold build
      # between this step and the test run; the test locks the keychain itself.
      # Only the GUI core test runs while the keychain exists: that test deletes
      # it, so no later step may see a default pointing at a deleted keychain.
      - name: Create throwaway keychain
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # The file-name marker is defined once, in the test that guards on it.
          marker="$(sed -n 's/^const KEYCHAIN_MARKER: &str = "\(.*\)";$/\1/p' crates/gui-core/tests/keychain_macos.rs)"
          [[ -n "$marker" ]] || { echo "KEYCHAIN_MARKER not found in keychain_macos.rs" >&2; exit 1; }
          keychain="$RUNNER_TEMP/$marker.keychain-db"
          # Exported before the keychain exists so the teardown step can always
          # find it.
          echo "GUI_CORE_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/keychains.orig"
          security default-keychain -d user > "$RUNNER_TEMP/keychain-default.orig"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

      - name: Test GUI core
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        # Every test binary reports, so tests/keychain_macos.rs runs even when an
        # earlier binary fails.
        run: cargo test --locked --no-fail-fast -p pohunek-gui-core

      # Deletes the throwaway keychain, restores the runner's keychain list and
      # default, then re-reads both and fails the step when they differ from the
      # saved originals. Each action runs even if an earlier one failed.
      - name: Remove throwaway keychain
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          fail() { echo "::error::$1"; failures=1; }
          # Strips the indentation and quotes `security` prints around a path;
          # spaces inside the path are kept.
          normalize() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' | sed -e '/^$/d'
          }

          keychain="${GUI_CORE_TEST_KEYCHAIN:-}"
          if [[ -n "$keychain" && -e "$keychain" ]]; then
            security delete-keychain "$keychain" || fail "could not delete $keychain"
            rm -f "$keychain" || fail "could not remove $keychain"
          fi

          list_file="$RUNNER_TEMP/keychains.orig"
          default_file="$RUNNER_TEMP/keychain-default.orig"
          if [[ ! -f "$list_file" || ! -f "$default_file" ]]; then
            echo "no saved keychain state: the create step did not change it"
            exit "$failures"
          fi

          originals=()
          while IFS= read -r line; do
            originals+=("$line")
          done < <(normalize < "$list_file")
          default="$(normalize < "$default_file" | head -n 1)"

          if (( ${#originals[@]} > 0 )); then
            security list-keychains -d user -s "${originals[@]}" || fail "could not restore the keychain search list"
          fi
          if [[ -n "$default" ]]; then
            security default-keychain -d user -s "$default" || fail "could not restore the default keychain"
          fi

          if ! diff <(security list-keychains -d user | normalize) <(normalize < "$list_file"); then
            fail "keychain search list differs from the saved original"
          fi
          if ! diff <(security default-keychain -d user | normalize) <(normalize < "$default_file"); then
            fail "default keychain differs from the saved original"
          fi
          exit "$failures"

  # Native Apple Silicon packaging (issue #104): the daemon archive is built
  # twice from the same commit and must come out byte-identical, its Mach-O
  # files are audited, and the extracted archives are installed, upgraded, and
  # uninstalled against real launchd with live sessions
  # (scripts/acceptance/macos-package-install). Archives built here
  # are unsigned development builds; signing and notarization run only in the
  # release workflow.
  macos-package:
    # macos-15 is the required leg. macos-14 is the minimum supported macOS and
    # exercises the packaged archives on it, but GitHub retires that hosted
    # image on 2026-11-02, so its result is informational and cannot block a
    # merge; the minimum-OS acceptance is a #105 gate on a runner that stays.
    name: macOS package install and upgrade (${{ matrix.runner }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos_package == 'true' }}
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.runner == 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    env:
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-package-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build offline documentation
        run: cargo xtask docs site

      - name: Build the daemon component
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release daemon)"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Package version A
        id: package-a
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/ { in_pkg = 1; next } /^\[/ { in_pkg = 0 } in_pkg && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/dist-a"
          archive="$(packaging/macos/package --development daemon "$version" \
            "${{ steps.build.outputs.bindir }}" target/pohunek-docs "$RUNNER_TEMP/dist-a")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # The same commit rebuilt from a cold release directory at the same path
      # must produce the same binaries and the same archive. Cargo mixes the
      # RUSTFLAGS text (which carries the checkout path for path remapping)
      # into every crate's metadata hash, so the path itself stays fixed.
      - name: Rebuild from a cold release directory and compare
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/first-binaries"
          mkdir -p "$first" "$RUNNER_TEMP/dist-repro"
          for binary in pohunek pohunekd pohunek-sessiond; do
            cp "${{ steps.build.outputs.bindir }}/$binary" "$first/"
          done
          rm -rf target/aarch64-apple-darwin/release
          bindir="$(packaging/macos/build-release daemon)"
          for binary in pohunek pohunekd pohunek-sessiond; do
            cmp "$first/$binary" "$bindir/$binary" \
              || { echo "::error::$binary is not reproducible from a cold build"; exit 1; }
          done
          rebuilt="$(packaging/macos/package --development daemon \
            "${{ steps.package-a.outputs.version }}" "$bindir" target/pohunek-docs "$RUNNER_TEMP/dist-repro")"
          cmp "${{ steps.package-a.outputs.archive }}" "$rebuilt" \
            || { echo "::error::the daemon archive is not reproducible from a cold build"; exit 1; }

      # A second version of the same tree, so the upgrade installs different
      # real binaries. The workspace version is bumped only in this runner's
      # checkout and restored afterwards.
      - name: Build and package version B
        id: package-b
        shell: bash
        run: |
          set -euo pipefail
          version_b="$(python3 - <<'PY'
          import re
          text = open("Cargo.toml").read()
          match = re.search(r'(\[workspace\.package\][^\[]*?version\s*=\s*")(\d+)\.(\d+)\.(\d+)(")', text, re.S)
          major, minor, patch = (int(match.group(i)) for i in (2, 3, 4))
          bumped = "%d.%d.%d" % (major, minor, patch + 1)
          open("Cargo.toml", "w").write(text[:match.start()] + match.group(1) + bumped + match.group(5) + text[match.end():])
          print(bumped)
          PY
          )"
          bindir="$(CARGO_LOCKED_FLAG= packaging/macos/build-release daemon)"
          mkdir -p "$RUNNER_TEMP/dist-b"
          archive="$(packaging/macos/package --development daemon "$version_b" "$bindir" target/pohunek-docs "$RUNNER_TEMP/dist-b")"
          git checkout -- Cargo.toml Cargo.lock
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Install, upgrade, and uninstall from the archives
        timeout-minutes: 20
        env:
          PKG_ACCEPT_ARCHIVE: ${{ steps.package-a.outputs.archive }}
          PKG_ACCEPT_UPGRADE_ARCHIVE: ${{ steps.package-b.outputs.archive }}
        run: scripts/acceptance/macos-package-install

  test:
    name: fmt + clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

  # Compiles every workspace test binary exactly once for the fast shards, the
  # heavy job, and the relay DB job (issue #170). Designated `test-debug`
  # saver; the same `--workspace --all-features` build also warms doctests.
  build-tests:
    name: build tests (nextest archive)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # The archive holds the test binaries, the runnable bins the tests spawn,
      # and pohunek-sessiond (archive.include in .config/nextest.toml, an error
      # when absent). It is kept outside target/ so rust-cache never saves it.
      - name: Archive workspace test binaries
        run: cargo nextest archive --profile ci --workspace --all-features --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Report archive size
        run: |
          size="$(stat -c %s "$RUNNER_TEMP/nextest-archive.tar.zst")"
          echo "nextest archive: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      # The archive is already zstd-compressed: store it as is (level 0).
      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  fast-tests:
    name: tests (${{ matrix.shard }}, fast)
    needs: build-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, daemon, relay, cli]
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      - name: Check script regressions
        if: matrix.shard == 'unit'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # No dependency on Clippy, PostgreSQL, PTYs, or the release build.
      - name: Run fast shard
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run "${{ matrix.shard }}"

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "fast ${{ matrix.shard }}" target/nextest/ci/junit.xml

      - name: Upload shard timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: relocated/target/nextest/ci/junit.xml
          if-no-files-found: warn

    # Determine which CI jobs the changed files require. Heavy non-default jobs
  # (feature-powerset, macOS contracts, Hermes compatibility, and TS-binding
  # drift) only run when their inputs change or on a schedule; the
  # always-critical jobs (fmt, clippy, fast tests, heavy tests, doctests,
  # docs check, relay DB) still run on every push and PR. The release build
  # is gated by the `release` filter. The workflow file
  # itself forces a relay run so filter edits are always validated.
  changes:
    name: required jobs (paths filter)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      feature_matrix: ${{ steps.filter.outputs.feature_matrix }}
      macos: ${{ steps.filter.outputs.macos }}
      macos_package: ${{ steps.filter.outputs.macos_package }}
      hermes: ${{ steps.filter.outputs.hermes }}
      docs_ts: ${{ steps.filter.outputs.docs_ts }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Push events (after merge to main) resolve the filter with git commands
      # against the previous commit, which needs more than a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relay:
              - 'crates/relay/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay/migrations/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            # cargo-hack feature-powerset is expensive (issue #125): run only
            # on schedule or when the dependency graph, feature set, or any
            # workspace Rust source changes — the powerset compiles feature
            # branches of source code, not just manifests.
            feature_matrix:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'crates/**/*.rs'
            # macOS platform, path, private-protocol, session-worker, daemon,
            # CLI, launchd, and Hermes filesystem contracts run on the native
            # arm64 runner (issues #96-#100 and #125): gate on every crate
            # exercised by the job and every crate the daemon and CLI link, the cross-platform dependency graph, and
            # the Cargo configuration (.cargo/config.toml carries Apple-specific
            # linker/target flags that can break only the macOS build). The root
            # manifest is included because these crates inherit workspace
            # package, dependency, and lint settings from it.
            macos:
              - 'Cargo.toml'
              - 'crates/platform/**'
              - 'crates/paths/**'
              - 'crates/worker-protocol/**'
              - 'crates/session-worker/**'
              - 'crates/terminal/**'
              - 'crates/logging/**'
              - 'crates/service-config/**'
              - 'crates/test-support/**'
              - 'crates/daemon/**'
              - 'crates/cli/**'
              - 'crates/protocol/**'
              - 'crates/client/**'
              - 'crates/knowledge/**'
              - 'crates/hostcheck/**'
              - 'crates/netbird/**'
              - 'crates/overlay/**'
              - 'crates/prompt/**'
              - 'crates/gui-core/**'
              - 'crates/gui/**'
              - 'scripts/acceptance/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'docs/knowledge/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            # Native macOS release packaging (issue #104): the archive scripts,
            # the install acceptance, and every crate the packaged daemon
            # archive contains or the installer drives.
            macos_package:
              - 'packaging/**'
              - 'docs/knowledge/**'
              - 'crates/xtask/**'
              - 'rust-toolchain*'
              - 'README.md'
              - 'LICENSE'
              - 'scripts/acceptance/macos-package-install'
              - 'scripts/acceptance/launchd_lifetime_evidence.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'crates/cli/**'
              - 'crates/daemon/**'
              - 'crates/session-worker/**'
              - 'crates/platform/**'
              - 'crates/paths/**'
              - 'crates/service-config/**'
              - 'crates/worker-protocol/**'
              - 'crates/logging/**'
              - 'crates/terminal/**'
              - 'crates/protocol/**'
              - 'crates/client/**'
              - 'crates/knowledge/**'
              - 'crates/hostcheck/**'
              - 'crates/netbird/**'
              - 'crates/overlay/**'
              - 'crates/prompt/**'
              - 'crates/gui-core/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            # Pinned Hermes compatibility provisioning + runtime check
            # (issue #125): gate on the locked runtime metadata, the full CLI
            # surface (the gate drives the CLI parser/dispatch, not just the
            # hermes_integration module), the xtask tree (its lib.rs owns the
            # `TopCommand::Hermes` dispatch that drives the harness), the
            # provisioner and its test, and the dependency graph the pinned
            # run links against (portable-pty, vt100, clap, ...). The paths
            # and protocol crates are included because `pohunek integration`
            # resolves its install home via `pohunek_paths::state_home()` and
            # negotiates via `pohunek_protocol` types
            # (`SUPPORTED_PROTOCOL_VERSIONS`, `IntegrationRecovery`). The
            # `hermes-compatibility` (Linux) and `hermes-compatibility-macos`
            # jobs share this filter; the smoke script and its fixtures are
            # inputs of the macOS job's packaged-plugin smoke.
            hermes:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'compat/hermes/**'
              - 'crates/cli/Cargo.toml'
              - 'crates/cli/src/**'
              - 'crates/paths/**'
              - 'crates/protocol/**'
              - 'crates/xtask/Cargo.toml'
              - 'crates/xtask/src/**'
              - 'scripts/provision-hermes-compat'
              - 'scripts/tests/provision-hermes-compat.sh'
              - 'packaging/**'
              - 'scripts/smoke-hermes-plugin-release'
              - 'scripts/tests/smoke-hermes-plugin-release.sh'
              - 'scripts/tests/fixtures/smoke-*'
              - '.github/workflows/ci.yml'
            # Generated TS binding drift lives under a schedule or when the
            # protocol surface or generation driver changes (issue #125).
            # Covers both generators' inputs and outputs: the main protocol
            # bindings plus the relay bindings (`crates/relay-protocol`, its
            # `pohunek-relay-protocol` ts-rs export, `relay-generated`, and the
            # emitted JSON fixtures) that `cargo xtask ts check` regenerates.
            docs_ts:
              - 'crates/protocol/**'
              - 'crates/relay-protocol/**'
              - 'crates/xtask/Cargo.toml'
              - 'crates/xtask/src/**'
              - 'web/shared/src/generated/**'
              - 'web/shared/src/relay-generated/**'
              - 'web/shared/fixtures/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            # The release build catches a broken release profile before
            # tagging. That is caused by profile/manifest, lockfile, Cargo
            # configuration, toolchain, or packaging changes; ordinary source
            # edits already compile in the debug jobs. The root manifest
            # carries `[profile.release]`.
            release:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/release'
              - 'packaging/**'

  integration:
    name: tests (heavy, PTY + Hermes)
    needs: build-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # xtask::dependency_policy resolves an isolated fixture with
      # `cargo tree --offline` and runs Clippy on it, so this job needs a
      # toolchain with Clippy and the locked crates in the cargo registry. It
      # compiles nothing else: the test binaries come from the archive.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Fetch locked dependency sources
        run: cargo fetch --locked

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      # The daemon socket tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`); it comes out of the archive, which
      # cannot be built without it.
      - name: Verify exhaustive disjoint test partitions
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" check

      - name: Heavy tests (bounded nextest concurrency)
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run heavy

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label heavy target/nextest/heavy/junit.xml

      # Per-test timing evidence for the test-performance work (JUnit `time`
      # attributes). Nextest writes the report under its own storage directory.
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-heavy
          path: relocated/target/nextest/heavy/junit.xml
          if-no-files-found: warn

  # Issue #100: the ignored real-systemd suites drive the runner's own systemd
  # user manager (transient worker units, the namespaced daemon unit, and the
  # `pohunek service` transactions). Hosted Ubuntu runners run a user manager
  # without lingering; the bus address is exported because the job shell does
  # not carry one.
  systemd-supervision:
    name: real systemd supervision
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_SYSTEMD_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Designated `bins` saver: the build-bins binaries plus the test
          # builds of the ignored systemd suites, a superset of build-bins.
          shared-key: bins
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Require a running systemd user manager
        run: |
          systemctl --version | head -n 1
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${XDG_RUNTIME_DIR}/bus" >> "$GITHUB_ENV"
          systemctl --user is-system-running --wait || systemctl --user is-system-running | grep -qx degraded

      - name: Build daemon, worker, and CLI binaries
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli --bins

      - name: Export binary paths
        run: |
          echo "POHUNEK_DAEMON_BIN=$PWD/target/debug/pohunekd" >> "$GITHUB_ENV"
          echo "POHUNEK_WORKER_BIN=$PWD/target/debug/pohunek-sessiond" >> "$GITHUB_ENV"
          echo "POHUNEK_CLI_BIN=$PWD/target/debug/pohunek" >> "$GITHUB_ENV"

      - name: Platform systemd backend
        run: cargo test --locked -p pohunek-platform --test systemd -- --ignored --test-threads 1

      - name: Daemon durability on transient units
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test systemd_durable_worker -- --ignored --test-threads 1

      - name: pohunek service transactions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test service_systemd -- --ignored --test-threads 1

      - name: Supervised worker lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test supervised_lifecycle -- --ignored --test-threads 1

      - name: pohunek service upgrade with live workers
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test service_upgrade -- --ignored --test-threads 1

  # Relay heavy tests are the only PostgreSQL fixture consumers, so they get
  # their own job whose Postgres service only starts when relay-relevant files
  # changed (issue #121) — except on the weekly sweep and manual dispatch,
  # which are documented as full runs even when the paths filter is empty.
  # Push to main stays filtered on purpose: the merged commit's relay files
  # still trigger the job via fetch-depth-2 detection, while unrelated pushes
  # never start the Postgres service.
  integration-relay:
    name: tests (relay DB, PostgreSQL)
    needs: [changes, build-tests]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      - name: Relay database tests (bounded nextest concurrency)
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run relay-db
        env:
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          POHUNEK_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/pohunek_test

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label relay-db target/nextest/relay-db/junit.xml

      - name: Upload relay DB test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-relay-db
          path: relocated/target/nextest/relay-db/junit.xml
          if-no-files-found: warn

  doctests:
    name: doctests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      # Doctests link the debug library builds that the `test-debug` saver
      # (`build-tests`) persists; this job only restores them.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug
          save-if: false

      # Nextest does not execute rustdoc tests; preserve the cargo test gate.
      - name: Documentation tests
        run: cargo test --doc --workspace --all-features

  # Full release build: schedule, push to main, manual dispatch, or a pull
  # request that changes a `release` filter input.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release build
        run: cargo build --workspace --release

  # TS-binding drift is gated by paths filter (issue #125); it only runs on
  # schedule, push to main, manual dispatch (always a full run), or when the
  # protocol/generation inputs change.
  # It is kept as its own job so `docs check` always runs every PR.
  ts-drift:
    name: TS binding drift (xs check)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_ts == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Designated `xtask` saver: the xtask binary plus the ts-rs export
          # test builds, a superset of what hermes-compatibility restores.
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: TS binding drift
        run: cargo xtask ts check
        env:
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold

  hermes-compatibility:
    name: pinned Hermes compatibility (model-free)
    runs-on: ubuntu-latest
    needs: [build-bins, changes]
    if: ${{ needs.build-bins.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.hermes == 'true') }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      # Cache the provisioned pinned Hermes runtime. Inputs that drive
      # provisioning: the lock file, the provisioner script, its test, the
      # exact resolved Python interpreter (the venv's `pyvenv.cfg` hard-links
      # to it, so a runner-image Python bump invalidates the runtime), and the
      # workflow itself (see scripts/provision-hermes-compat); uv itself is
      # already cached via `enable-cache` above, so this is just the resolved
      # venv. Key on all of them so a provisioner change re-provisions.
      - name: Cache Hermes runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      # The compatibility gate itself is driven by `cargo xtask`, which is built
      # from source in this job, so a toolchain is still required here.
      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore only: ts-drift saves `xtask`.
          shared-key: xtask
          save-if: false

      - name: Check fail-closed Hermes provisioning
        run: scripts/tests/provision-hermes-compat.sh

      - name: Provision locked Hermes runtime
        id: hermes
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/hermes-compat-cache"
          install_dir="$RUNNER_TEMP/hermes-compat"
          if [[ -d "$cache_dir" ]]; then
            # Cache hit: restore the previously provisioned runtime. The
            # provisioner emits the executable at `venv/bin/hermes` inside the
            # install root; fail closed if the restored cache lacks it.
            rm -rf "$install_dir"
            cp -a "$cache_dir" "$install_dir"
            hermes_bin="$install_dir/venv/bin/hermes"
          else
            hermes_bin="$(scripts/provision-hermes-compat "$install_dir")"
            # Stage the fresh runtime for caching. Copy errors fail the step
            # (no `|| true`): a partial cache_dir under an immutable key
            # would poison every later run until the key changes. The staged
            # copy must contain the executable too — the post-check below only
            # verifies install_dir, not the copy.
            rm -rf "$cache_dir"
            cp -a "$install_dir" "$cache_dir"
            [[ -f "$cache_dir/venv/bin/hermes" && -x "$cache_dir/venv/bin/hermes" ]] \
              || { echo "cached Hermes copy incomplete at $cache_dir/venv/bin/hermes" >&2; exit 1; }
          fi
          [[ -f "$hermes_bin" && -x "$hermes_bin" ]] \
            || { echo "provisioned Hermes executable missing at $hermes_bin" >&2; exit 1; }
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Download built CLI
        uses: actions/download-artifact@v4
        with:
          name: pohunek-bins
          path: target/debug

      - name: Check pinned Hermes compatibility
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/debug/pohunek
          pohunek_bin="$(realpath target/debug/pohunek)"
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "$pohunek_bin"

      # Persist the staged runtime only after the compatibility gate passed:
      # `if: success()` plus this position (after the check) means a broken
      # or partial runtime is never uploaded under the immutable cache key.
      - name: Persist Hermes runtime cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

  # Native Apple Silicon counterpart of `hermes-compatibility`. It provisions
  # the same locked Hermes runtime under the runner's /bin/bash 3.2 and BSD
  # userland, then runs the model-free compatibility gate and the packaged
  # plugin smoke natively. Every missing prerequisite fails the job; nothing
  # is skipped.
  hermes-compatibility-macos:
    name: pinned Hermes compatibility (macOS arm64, model-free)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.hermes == 'true' }}
    needs: changes
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      # The runtime is provisioned by scripts/provision-hermes-compat, which
      # needs git, python3, uv, and one SHA-256 tool (macOS ships shasum).
      - name: Require provisioning prerequisites
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          for executable in git python3 uv shasum; do
            command -v "$executable" >/dev/null 2>&1 \
              || { echo "required executable is unavailable: $executable" >&2; exit 1; }
          done
          /bin/bash --version | head -n 1

      # Same inputs as the Linux runtime cache plus the CPU architecture; a
      # runtime provisioned on Linux is never restored here.
      - name: Cache Hermes runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hermes-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runs the shell tests with /bin/bash (3.2) first on PATH, so the
      # provisioner and the smoke run under the stock macOS shell.
      - name: Check fail-closed Hermes provisioning and smoke scripts
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          PATH="/bin:$PATH" /bin/bash scripts/tests/provision-hermes-compat.sh
          PATH="/bin:$PATH" /bin/bash scripts/tests/smoke-hermes-plugin-release.sh

      - name: Provision locked Hermes runtime
        id: hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/hermes-compat-cache"
          install_dir="$RUNNER_TEMP/hermes-compat"
          if [[ -d "$cache_dir" ]]; then
            # Cache hit: restore the previously provisioned runtime; fail
            # closed if the restored cache lacks the executable.
            rm -rf "$install_dir"
            cp -a "$cache_dir" "$install_dir"
            hermes_bin="$install_dir/venv/bin/hermes"
          else
            hermes_bin="$(scripts/provision-hermes-compat "$install_dir")"
            # A partial cache_dir under an immutable key would poison later
            # runs, so a copy error fails the step and the staged copy is
            # verified.
            rm -rf "$cache_dir"
            cp -a "$install_dir" "$cache_dir"
            [[ -f "$cache_dir/venv/bin/hermes" && -x "$cache_dir/venv/bin/hermes" ]] \
              || { echo "cached Hermes copy incomplete at $cache_dir/venv/bin/hermes" >&2; exit 1; }
          fi
          [[ -f "$hermes_bin" && -x "$hermes_bin" ]] \
            || { echo "provisioned Hermes executable missing at $hermes_bin" >&2; exit 1; }
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Test Hermes harness natively
        run: cargo test --locked -p xtask --lib hermes

      - name: Build offline documentation
        run: cargo xtask docs site

      # The packaged archive is built with the release scripts and extracted
      # outside the checkout, so the gate and the smoke can only use what the
      # published macOS CLI archive contains: the binary with its embedded
      # plugin and skill assets, and the packaged smoke script.
      - name: Build, package, and extract the CLI archive outside the source tree
        id: packaged
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/ { in_pkg = 1; next } /^\[/ { in_pkg = 0 } in_pkg && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          bindir="$(packaging/macos/build-release cli)"
          dist="$RUNNER_TEMP/dist-cli"
          rm -rf "$dist"
          mkdir -p "$dist"
          archive="$(packaging/macos/package --development cli "$version" "$bindir" target/pohunek-docs "$dist")"
          extract_dir="$RUNNER_TEMP/packaged-pohunek"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          packaged_dir="$(cd "$extract_dir/$(basename "$archive" .tar.gz)" && pwd -P)"
          if git -C "$packaged_dir" rev-parse --git-dir >/dev/null 2>&1; then
            echo "packaged directory is inside a Git worktree: $packaged_dir" >&2
            exit 1
          fi
          test -x "$packaged_dir/pohunek"
          test -x "$packaged_dir/packaging/smoke-hermes-plugin-release"
          printf 'dir=%s\n' "$packaged_dir" >> "$GITHUB_OUTPUT"

      - name: Check pinned Hermes compatibility
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "${{ steps.packaged.outputs.dir }}/pohunek"

      - name: Smoke packaged plugin installation against pinned Hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          "${{ steps.packaged.outputs.dir }}/packaging/smoke-hermes-plugin-release" \
            "${{ steps.packaged.outputs.dir }}/pohunek" \
            "${{ steps.hermes.outputs.bin }}"

      # Persist the staged runtime only after the gate and smoke passed.
      - name: Persist Hermes runtime cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

  # Build the three runnable binaries exactly once. The web e2e and pinned
  # Hermes jobs reuse this artifact instead of each rebuilding Rust, which used
  # to cost a full duplicate build per job (issue #122).
  build-bins:
    name: build bins (pohunekd + pohunek-sessiond + pohunek)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore only: systemd-supervision saves `bins`.
          shared-key: bins
          save-if: false

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries are needed.
      - name: Build daemon, session worker, and CLI
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: pohunek-bins
          path: |
            target/debug/pohunekd
            target/debug/pohunek-sessiond
            target/debug/pohunek
          if-no-files-found: error

  web:
    name: web SDK + control center
    runs-on: ubuntu-latest
    needs: build-bins
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # `bun install` re-downloads every registry tarball without a cache.
      # Reuse Bun's global package cache, keyed by web/bun.lock and the
      # setup-bun bun-version pin above, so repeat runs install from disk
      # instead of the network.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun run typecheck

      - name: Lint web
        working-directory: web
        run: bun run lint

      - name: Test web
        working-directory: web
        run: bun test

      # Build once, reuse for the Playwright e2e below. `bun run test:e2e`
      # rebuilds the frontend itself, so invoke the Playwright CLI directly.
      - name: Build web control center
        working-directory: web
        run: bun run build:frontend

      # The lockfile pins the Playwright version, so its browser build is
      # derived from web/bun.lock instead of a hand-maintained literal.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --only-shell chromium

      - name: Test web control center
        working-directory: web
        run: bun ./node_modules/@playwright/test/cli.js test --config frontend/playwright.config.ts

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries must be present.
      # They come from the build-bins artifact (issue #122): no Rust toolchain
      # or cargo cache is needed in this job.
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: pohunek-bins
          path: target/debug

      - name: Restore executable bits on downloaded binaries
        run: chmod +x target/debug/pohunekd target/debug/pohunek-sessiond target/debug/pohunek

      - name: SDK e2e against real daemon
        working-directory: web
        run: bun test sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Backend e2e against real daemon
        working-directory: web
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd
          POHUNEK_CLI_BIN: ${{ github.workspace }}/target/debug/pohunek
          POHUNEK_PYTHON_BIN: /usr/bin/python3

  # Dependency hygiene (M-STATIC-VERIFICATION): security advisories, the Cargo
  # feature matrix, and unused dependencies. Kept off the critical `test` job so
  # an advisory in a transitive crate stays visible without masking a real
  # failure.
  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Prebuilt, checksum-verified binary; `fallback: none` fails the step
      # rather than compiling cargo-audit from source.
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
          fallback: none

      # Runs from the repo root so `.cargo/audit.toml` (the reviewed ignore
      # list) applies. Exits non-zero on any unignored vulnerability;
      # unmaintained/unsound/yanked warnings are reported without failing.
      - name: Audit dependencies
        run: cargo audit

  docs:
    name: docs check (schema + drift + source-map + runbooks + secrets + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: the docs job builds without the mold RUSTFLAGS, and
          # RUSTFLAGS is part of the rust-cache key, so it cannot share `xtask`.
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: docs check
        run: cargo xtask docs check
        env:
          RUSTFLAGS: -D warnings

  feature-matrix:
    name: cargo-hack (feature powerset)
    runs-on: ubuntu-latest
    # Expensive (issue #125): run only on schedule, push to main, manual
    # dispatch (always a full run), or when the dependency graph / feature
    # set / CI workflow changes.
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.feature_matrix == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hack
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack

      # Validates every feature combination compiles. knowledge gates its
      # protocol bridge behind the `protocol` feature; --all-features only
      # exercises the everything-on case.
      - name: Check feature powerset
        run: cargo hack --feature-powerset --workspace clippy --all-targets

  # Pull requests get the stable source-level `shear` job below. cargo-udeps
  # needs the nightly toolchain and a full workspace build, so it runs only on
  # push to main, the weekly sweep, and manual dispatch. It is the backstop for
  # what cargo-shear cannot see: a dependency whose only reference sits in code
  # compiled out for the host (e.g. `#[cfg(target_os = "macos")]` on Linux).
  udeps:
    name: cargo-udeps (unused dependencies)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-udeps
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-udeps
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-udeps

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets --all-features

  # Unused-dependency check for every event, including pull requests. It reads
  # manifests and sources without compiling, so it needs only stable cargo for
  # `cargo metadata` and finishes in seconds. It also reports unused
  # `[workspace.dependencies]` entries and direct dependencies that are loaded
  # transitively anyway, both of which cargo-udeps misses (issue #173). A false
  # positive is suppressed per crate with
  # `[package.metadata.cargo-shear] ignored = ["<crate>"]` plus a reason comment.
  shear:
    name: cargo-shear (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install cargo-shear
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-shear@1.14.0

      - name: Check for unused dependencies
        run: cargo shear --locked --deny-warnings --format=github
