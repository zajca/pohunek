      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codex-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Build the package deterministically
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask package verify runtime-packages/codex
          cargo xtask package build runtime-packages/codex --output "$RUNNER_TEMP/codex.tar.zst" \
            --evidence-dir "$RUNNER_TEMP/package-evidence-codex"
          echo "POHUNEK_CODEX_PACKAGE_ARCHIVE=$RUNNER_TEMP/codex.tar.zst" >> "$GITHUB_ENV"

      # Uploaded right after the build, so the evidence of the archive under
      # test survives a failing test run.
      - name: Upload the package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-codex
          path: ${{ runner.temp }}/package-evidence-codex
          if-no-files-found: error

      # A verified baseline means the selector rebuilt this package from this
      # commit and got the digest of the released archive, so the archive
      # under test must be the released one. A different digest means two
      # builds of identical inputs disagree: the package build is not
      # reproducible, and the job fails. The digest is read only from a
      # successful selection.
      - name: Match the release baseline
        shell: bash
        env:
          BASELINE_DIGEST: ${{ needs.package-selection.result == 'success' && needs.package-selection.outputs.codex_baseline_digest || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_DIGEST" ]; then
            echo "No verified release baseline for codex; the rebuilt archive has nothing to match."
            exit 0
          fi
          actual="sha256:$(sha256sum "$RUNNER_TEMP/codex.tar.zst" | cut -d' ' -f1)"
          if [ "$actual" != "$BASELINE_DIGEST" ]; then
            echo "::error::the rebuilt codex archive is $actual but the verified release baseline is $BASELINE_DIGEST: the package build is not reproducible"
            exit 1
          fi
          echo "The rebuilt codex archive is the released baseline $actual."

      - name: Build the session worker
        run: cargo build --locked -p pohunek-session-worker --bin pohunek-sessiond

      # The `package` nextest profile runs the binary serially with a per-test
      # timeout and writes a JUnit report. nextest writes it only when the run
      # ends, so a report the build cache restored under target/ is removed
      # first and never stands in for this run.
      - name: Drive the real Codex
        run: |
          rm -f target/nextest/package/junit.xml
          cargo nextest run --locked --profile package -p pohunek-cli --test all -E 'test(/^codex_package::/)' --run-ignored all --test-threads 1

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "codex package" target/nextest/package/junit.xml

      - name: Upload the package test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-junit-codex
          path: target/nextest/package/junit.xml
          if-no-files-found: warn

  # Official Claude Code runtime package against the real, locked Claude Code
  # release. The job installs the npm tree pinned by
  # `compat/claude/npm/package-lock.json` (the package's postinstall links the
  # native binary, so scripts stay enabled), checks the binary's locked SHA-256,
  # builds the package with `cargo xtask package build`, and runs the always-on
  # parity tests plus the real-Claude tests: a real `claude` with a throwaway
  # CLAUDE_CONFIG_DIR, a dummy API key, a loopback Messages stub, hooks
  # registered by pohunek's own integration install, and every live screen and
  # title read through the package manifest. The tests install the built
  # archive through a signed catalog with a throwaway key and trust anchor
  # generated in the test process, so the launches go through the installed
  # package and its version probe. The screen-capture tests do nothing without
  # POHUNEK_CLAUDE_CAPTURE_DIR, which this job does not set. The job has not
  # run on a hosted runner yet: the Node of the runner image and the npm
  # postinstall are the assumptions to check on its first run.
  claude-package:
    name: Claude Code runtime package (locked release, model-free)
    runs-on: ubuntu-latest
    needs: package-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.package-selection.result != 'success' || needs.package-selection.outputs.claude != 'false') }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_CLAUDE_E2E: "1"
    # Ten real-Claude tests at the package profile's 3-minute kill must all end
    # before the job timeout (.config/nextest.toml, profile.package).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the Claude Code lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          lock=compat/claude/compatibility-lock.json
          {
            echo "release=$(jq -er '.upstream.release' "$lock")"
            echo "sha256=$(jq -er '.upstream.sha256["linux-x64"]' "$lock")"
          } >> "$GITHUB_OUTPUT"

      - name: Install the locked Claude Code release
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/compat/claude/npm"
          if ! npm ci --prefix "$project" --ignore-scripts=false --no-audit --no-fund; then
            echo "Failed to install the pinned Claude Code npm tree from $project/package-lock.json" >&2
            exit 1
          fi
          bin="$project/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          binary="$(readlink -f "$bin/claude")"
          actual="$(sha256sum "$binary" | cut -d' ' -f1)"
          test "$actual" = "${{ steps.lock.outputs.sha256 }}" \
            || { echo "installed Claude Code binary $actual is not the locked ${{ steps.lock.outputs.sha256 }}" >&2; exit 1; }
          installed="$(env -i PATH="$bin:$PATH" HOME="$RUNNER_TEMP" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-version-home" claude --version)"
          test "$installed" = "${{ steps.lock.outputs.release }} (Claude Code)" \
            || { echo "installed Claude Code '$installed' is not the locked ${{ steps.lock.outputs.release }}" >&2; exit 1; }

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: claude-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Build the package deterministically
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask package verify runtime-packages/claude
          cargo xtask package build runtime-packages/claude --output "$RUNNER_TEMP/claude.tar.zst" \
            --evidence-dir "$RUNNER_TEMP/package-evidence-claude"
          echo "POHUNEK_CLAUDE_PACKAGE_ARCHIVE=$RUNNER_TEMP/claude.tar.zst" >> "$GITHUB_ENV"

      # Uploaded right after the build, so the evidence of the archive under
      # test survives a failing test run.
      - name: Upload the package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-claude
          path: ${{ runner.temp }}/package-evidence-claude
          if-no-files-found: error

      # A verified baseline means the selector rebuilt this package from this
      # commit and got the digest of the released archive, so the archive
      # under test must be the released one. A different digest means two
      # builds of identical inputs disagree: the package build is not
      # reproducible, and the job fails. The digest is read only from a
      # successful selection.
      - name: Match the release baseline
        shell: bash
        env:
          BASELINE_DIGEST: ${{ needs.package-selection.result == 'success' && needs.package-selection.outputs.claude_baseline_digest || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_DIGEST" ]; then
            echo "No verified release baseline for claude; the rebuilt archive has nothing to match."
            exit 0
          fi
          actual="sha256:$(sha256sum "$RUNNER_TEMP/claude.tar.zst" | cut -d' ' -f1)"
          if [ "$actual" != "$BASELINE_DIGEST" ]; then
            echo "::error::the rebuilt claude archive is $actual but the verified release baseline is $BASELINE_DIGEST: the package build is not reproducible"
            exit 1
          fi
          echo "The rebuilt claude archive is the released baseline $actual."

      - name: Build the session worker
        run: cargo build --locked -p pohunek-session-worker --bin pohunek-sessiond

      # The `package` nextest profile runs the binary serially with a per-test
      # timeout and writes a JUnit report. nextest writes it only when the run
      # ends, so a report the build cache restored under target/ is removed
      # first and never stands in for this run.
      - name: Drive the real Claude Code
        run: |
          rm -f target/nextest/package/junit.xml
          cargo nextest run --locked --profile package -p pohunek-cli --test all -E 'test(/^claude_package::/)' --run-ignored all --test-threads 1

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "claude package" target/nextest/package/junit.xml

      - name: Upload the package test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-junit-claude
          path: target/nextest/package/junit.xml
          if-no-files-found: warn

  # Native Apple Silicon counterpart of `hermes-package`. It provisions
  # the same locked Hermes runtime under the runner's /bin/bash 3.2 and BSD
  # userland, then runs the model-free compatibility gate and the packaged
  # plugin smoke natively. Every missing prerequisite fails the job; nothing
  # is skipped.
  hermes-compatibility-macos:
    name: pinned Hermes compatibility (macOS arm64, model-free)
    # A pull request runs it only for its narrow input filter (issue #1050);
    # core inputs are covered by the main and nightly tiers. The Linux
    # `hermes-package` job follows the runtime package selection instead.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) || (github.event_name == 'pull_request' && needs.changes.outputs.hermes_macos == 'true') }}
    needs: [changes, macos-release-build]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    # The debug build of the CLI integration tests for the real Hermes session
    # takes a large share of a cold run; the release daemon comes from
    # `macos-release-build`.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      # Bootstrap python3 for the provisioner's helper programs and the shell
      # tests. setup-python installs the python.org framework build here, whose
      # bin/python3.x re-executes Python.app; the Hermes venv therefore runs
      # the provisioner's pinned non-framework standalone CPython instead.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      # The runtime is provisioned by scripts/provision-hermes-compat, which
      # needs curl, git, python3, tar, uv, and one SHA-256 tool (macOS ships
      # shasum).
      - name: Require provisioning prerequisites
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          for executable in curl git python3 tar uv shasum; do
            command -v "$executable" >/dev/null 2>&1 \
              || { echo "required executable is unavailable: $executable" >&2; exit 1; }
          done
          /bin/bash --version | head -n 1

      # Same inputs as the Linux runtime cache plus the CPU architecture; a
      # runtime provisioned on Linux is never restored here.
      - name: Cache Hermes runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('crates/xtask/src/upstream_stage.rs') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hermes-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # Runs the shell tests with /bin/bash (3.2) first on PATH, so the
      # provisioner and the smoke run under the stock macOS shell.
      - name: Check fail-closed Hermes provisioning and smoke scripts
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          PATH="/bin:$PATH" /bin/bash scripts/tests/provision-hermes-compat.sh
          PATH="/bin:$PATH" /bin/bash scripts/tests/smoke-hermes-plugin-release.sh

      # Staged and verified as in the Linux job. /bin (bash 3.2) comes first
      # on the PATH the provisioner inherits through `compat stage-upstream`.
      - name: Provision locked Hermes runtime
        id: hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/hermes-compat-cache"
          stage_root="$RUNNER_TEMP/hermes-compat"
          stage="$stage_root/hermes"
          rm -rf "$stage_root"
          mkdir -p "$stage_root"
          if [[ -d "$cache_dir" ]]; then
            cp -a "$cache_dir" "$stage"
            cargo xtask compat verify-stage --runtime hermes --dir "$stage_root"
          else
            PATH="/bin:$PATH" cargo xtask compat stage-upstream --runtime hermes --out "$stage_root"
            # A partial cache_dir under an immutable key would poison later
            # runs, so a copy error fails the step; the restored copy is
            # verified on the next hit.
            rm -rf "$cache_dir"
            cp -a "$stage" "$cache_dir"
          fi
          hermes_bin="$stage/venv/bin/hermes"
          printf 'cache=%s\nstage_root=%s\n' "$cache_dir" "$stage_root" >> "$GITHUB_OUTPUT"
          [[ -f "$hermes_bin" && -x "$hermes_bin" ]] \
            || { echo "provisioned Hermes executable missing at $hermes_bin" >&2; exit 1; }
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"
          # The pinned venv interpreter carries PyYAML; the package tests'
          # plugin harness needs it, and runner Pythons lack it or are
          # group-writable framework builds the harness refuses.
          printf 'python=%s\n' "${hermes_bin%/*}/python" >> "$GITHUB_OUTPUT"

      # Every xtask lib test whose name contains `hermes`, one process each.
      # Each run keeps its JUnit report under its own name, because both runs
      # of this job write the macos profile's single report path; that path is
      # cleared first, so a run that writes no report copies none.
      - name: Test Hermes harness natively
        shell: /bin/bash {0}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-junit"
          rm -f target/nextest/macos/junit.xml || exit 1
          cargo nextest run --locked --profile macos -p xtask --lib -E 'test(hermes)'
          status=$?
          cp target/nextest/macos/junit.xml "$RUNNER_TEMP/hermes-junit/harness.xml" || status=1
          exit "$status"

      - name: Build offline documentation
        run: cargo xtask docs site

      # The version-A binaries come from `macos-release-build`; this job does
      # not compile them.
      - name: Download the daemon binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-daemon
          path: ${{ runner.temp }}/macos-release-daemon-download

      - name: Unpack the daemon binaries
        id: binaries
        shell: bash
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/macos-release-daemon"
          rm -rf "$bindir"
          mkdir -p "$bindir"
          tar -C "$bindir" -xf "$RUNNER_TEMP/macos-release-daemon-download/macos-release-daemon.tar"
          for binary in pohunek pohunekd pohunek-sessiond; do
            test -x "$bindir/$binary"
          done
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      # The archive is packaged with the release scripts and extracted outside
      # the checkout, so the gate and the smoke can only use what the published
      # macOS daemon archive contains: the binaries and the packaged smoke
      # script.
      - name: Package and extract the daemon archive outside the source tree
        id: packaged
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/ { in_pkg = 1; next } /^\[/ { in_pkg = 0 } in_pkg && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          bindir="${{ steps.binaries.outputs.bindir }}"
          dist="$RUNNER_TEMP/dist-daemon"
          rm -rf "$dist"
          mkdir -p "$dist"
          archive="$(packaging/macos/package --development daemon "$version" "$bindir" target/pohunek-docs "$dist")"
          extract_dir="$RUNNER_TEMP/packaged-pohunek"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          packaged_dir="$(cd "$extract_dir/$(basename "$archive" .tar.gz)" && pwd -P)"
          if git -C "$packaged_dir" rev-parse --git-dir >/dev/null 2>&1; then
            echo "packaged directory is inside a Git worktree: $packaged_dir" >&2
            exit 1
          fi
          for binary in pohunek pohunekd pohunek-sessiond; do
            test -x "$packaged_dir/$binary"
          done
          test -x "$packaged_dir/packaging/smoke-hermes-plugin-release"
          printf 'dir=%s\n' "$packaged_dir" >> "$GITHUB_OUTPUT"

      # The gate and the smoke install the operator plugin from the Hermes
      # runtime package, built here from runtime-packages/hermes. The smoke's
      # catalog is signed with a throwaway key that only its anchor trusts.
      - name: Build the Hermes runtime package and its throwaway catalog
        id: package
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/hermes-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          scripts/build-hermes-package "$package_dir/hermes.tar.zst"
          cargo xtask hermes throwaway-catalog \
            --package "$package_dir/hermes.tar.zst" \
            --output-dir "$package_dir/trust"
          printf 'dir=%s\n' "$package_dir" >> "$GITHUB_OUTPUT"

      - name: Check pinned Hermes compatibility
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --bin-dir "${{ steps.packaged.outputs.dir }}" \
            --package "${{ steps.package.outputs.dir }}/hermes.tar.zst"

      # The previous step wrote into the stage it used; the next one runs on
      # a fresh restore of the untouched copy at the same absolute path.
      - name: Restore the pristine Hermes stage
        shell: /bin/bash {0}
        env:
          CACHE_DIR: ${{ steps.hermes.outputs.cache }}
          STAGE_ROOT: ${{ steps.hermes.outputs.stage_root }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT/hermes"
          cp -a "$CACHE_DIR" "$STAGE_ROOT/hermes"
          cargo xtask compat verify-stage --runtime hermes --dir "$STAGE_ROOT"

      - name: Smoke packaged plugin installation against pinned Hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          "${{ steps.packaged.outputs.dir }}/packaging/smoke-hermes-plugin-release" \
            "${{ steps.packaged.outputs.dir }}" \
            "${{ steps.package.outputs.dir }}/hermes.tar.zst" \
            "${{ steps.package.outputs.dir }}/trust/runtime-catalog.json" \
            "${{ steps.package.outputs.dir }}/trust/runtime-catalog-anchor.json" \
            "${{ steps.hermes.outputs.bin }}"

      # The test daemon spawns the session worker found beside the test
      # profile, so it is built from this checkout before the real session.
      - name: Build the session worker
        run: cargo build --locked -p pohunek-session-worker --bin pohunek-sessiond

      # The previous step wrote into the stage it used; the next one runs on
      # a fresh restore of the untouched copy at the same absolute path.
      - name: Restore the pristine Hermes stage
        shell: /bin/bash {0}
        env:
          CACHE_DIR: ${{ steps.hermes.outputs.cache }}
          STAGE_ROOT: ${{ steps.hermes.outputs.stage_root }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT/hermes"
          cp -a "$CACHE_DIR" "$STAGE_ROOT/hermes"
          cargo xtask compat verify-stage --runtime hermes --dir "$STAGE_ROOT"

      # One real pinned Hermes turn through the selected package and the public
      # session commands against a loopback model, natively on arm64. Only the
      # test receives the provisioned executable path; PATH stays the runner's.
      - name: Drive a real pinned Hermes session through the package
        env:
          POHUNEK_HERMES_E2E: "1"
          POHUNEK_HERMES_BIN: ${{ steps.hermes.outputs.bin }}
          POHUNEK_PYTHON_BIN: ${{ steps.hermes.outputs.python }}
        shell: /bin/bash {0}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-junit"
          rm -f target/nextest/macos/junit.xml || exit 1
          cargo nextest run --locked --profile macos -p pohunek-cli --test all -E 'test(/^hermes_package::/)' --run-ignored all --test-threads 1
          status=$?
          cp target/nextest/macos/junit.xml "$RUNNER_TEMP/hermes-junit/package.xml" || status=1
          exit "$status"

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "hermes macos" "$RUNNER_TEMP/hermes-junit/harness.xml" "$RUNNER_TEMP/hermes-junit/package.xml"

      - name: Upload Hermes macOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-macos-junit
          path: ${{ runner.temp }}/hermes-junit/
          if-no-files-found: warn

      # Persist the staged runtime only after the gate and smoke passed.
      - name: Persist Hermes runtime cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('crates/xtask/src/upstream_stage.rs') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

  # Each test runs at most once per OS in a run (#1226): this job reads every
  # JUnit report of the run and fails on a test two jobs of the same OS ran,
  # unless scripts/test-duplicates.json allows it with a reason. It runs in the
  # main and nightly tiers, where every test job runs.
  test-duplicates:
    name: test duplicates (same OS)
    needs:
      - platform-contracts
      - macos-tier
      - fast-tests
      - integration
      - integration-relay
      - hermes-package
      - pi-package
      - codex-package
      - claude-package
      - hermes-compatibility-macos
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # Only this workflow's test jobs: the release rehearsal's reusable
      # workflow uploads its own JUnit reports, which this job does not wait for.
      - name: Download the run's JUnit reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{nextest-junit-*,package-junit-*,macos-lane-junit,macos-tier-junit,hermes-macos-junit}'
          path: ${{ runner.temp }}/junit

      - name: Check for same-OS duplicates
        run: python3 scripts/test-duplicates "$RUNNER_TEMP/junit"

  # Build the three runnable binaries exactly once. The SDK e2e job reuses
  # this artifact instead of rebuilding Rust (issue #122).
  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  build-bins:
    name: build bins (pohunekd + pohunek-sessiond + pohunek)
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore only: systemd-supervision saves `bins`.
          shared-key: bins
          save-if: false

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries are needed.
      - name: Build daemon, session worker, and CLI
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: pohunek-bins
          path: |
            target/debug/pohunekd
            target/debug/pohunek-sessiond
            target/debug/pohunek
          if-no-files-found: error

      # The daemon serves `hermes` only from the official Hermes package, so the
      # Hermes plugin e2e installs the archive built from runtime-packages/hermes
      # through a throwaway signed catalog whose trust anchor it places beside
      # its own copy of the daemon. The SDK job has no Rust toolchain, so both
      # are built here.
      - name: Build the Hermes package and its throwaway catalog
        run: |
          set -euo pipefail
          rm -rf target/hermes-e2e
          mkdir -p target/hermes-e2e
          scripts/build-hermes-package target/hermes-e2e/hermes.tar.zst
          cargo xtask hermes throwaway-catalog \
            --package target/hermes-e2e/hermes.tar.zst \
            --output-dir target/hermes-e2e/catalog

      - name: Upload the Hermes package and its throwaway catalog
        uses: actions/upload-artifact@v4
        with:
          name: hermes-e2e-package
          path: target/hermes-e2e
          if-no-files-found: error

  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  sdk:
    name: SDK workspace
    runs-on: ubuntu-latest
    needs: [build-bins, test-selection]
    if: ${{ !cancelled() && needs.build-bins.result == 'success' && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # `bun install` re-downloads every registry tarball without a cache.
      # Reuse Bun's global package cache, keyed by bun.lock and the
      # setup-bun bun-version pin above, so repeat runs install from disk
      # instead of the network.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Lint workspace
        run: bun run lint

      - name: Test workspace
        run: bun test

      # Real SDK release tarballs installed by URL into a throwaway consumer
      # whose registry is unreachable, so a packaging break fails the PR instead
      # of the release.
      # The packed tarballs must run under the oldest and the newest Node the
      # docs promise (>= 20 for the socket transport, >= 22 for the WebSocket
      # transport). The contract test runs its Node assertions with the binary
      # named by POHUNEK_TEST_NODE_BIN (skipped when unset), so each step below
      # runs the whole contract once per Node major.
      - name: Install Node 20 for the SDK Node contract
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: SDK pack contract under Node 20
        run: POHUNEK_TEST_NODE_BIN="$(command -v node)" bun test sdk/ts/scripts

      - name: Install Node 22 for the SDK Node contract
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SDK pack contract under Node 22
        run: POHUNEK_TEST_NODE_BIN="$(command -v node)" bun test sdk/ts/scripts

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries must be present.
      # They come from the build-bins artifact (issue #122): no Rust toolchain
      # or cargo cache is needed in this job.
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: pohunek-bins
          path: target/debug

      - name: Restore executable bits on downloaded binaries
        run: chmod +x target/debug/pohunekd target/debug/pohunek-sessiond target/debug/pohunek

      - name: Download the Hermes package and its throwaway catalog
        uses: actions/download-artifact@v4
        with:
          name: hermes-e2e-package
          path: target/hermes-e2e

      - name: SDK e2e against real daemon
        run: bun test sdk/ts/sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Hermes plugin e2e against real daemon
        run: bun test sdk/ts/sdk/test/hermes-plugin.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd
          POHUNEK_CLI_BIN: ${{ github.workspace }}/target/debug/pohunek
          POHUNEK_PYTHON_BIN: /usr/bin/python3
          POHUNEK_HERMES_PACKAGE: ${{ github.workspace }}/target/hermes-e2e/hermes.tar.zst
          POHUNEK_HERMES_CATALOG_DIR: ${{ github.workspace }}/target/hermes-e2e/catalog

  # The SDK workspace on Apple Silicon (issue #103): typecheck, lint, unit
  # tests, and the SDK e2e suite against the real macOS pohunekd,
  # pohunek-sessiond and pohunek.
  sdk-macos:
    name: SDK workspace (macOS arm64)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) || (github.event_name == 'pull_request' && needs.changes.outputs.sdk_macos == 'true') }}
    needs: changes
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-1.3.11-

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sdk-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The real daemon spawns `pohunek-sessiond` by path from the same
      # directory, and the suites drive the real `pohunek` CLI.
      - name: Build daemon, session worker, and CLI
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Lint workspace
        run: bun run lint

      - name: Test workspace
        run: bun test

      - name: SDK e2e against real daemon
        run: bun test sdk/ts/sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

  # Dependency hygiene (M-STATIC-VERIFICATION): security advisories, the Cargo
  # feature matrix, and unused dependencies. Kept off the critical `test` job so
  # an advisory in a transitive crate stays visible without masking a real
  # failure.
  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  audit:
    name: cargo-audit (RustSec advisories)
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `cargo audit` goes through the rustup proxy, which resolves the
      # rust-toolchain.toml pin in the repository root.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      # Prebuilt, checksum-verified binary; `fallback: none` fails the step
      # rather than compiling cargo-audit from source.
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
          fallback: none

      # Runs from the repo root so `.cargo/audit.toml` (the reviewed ignore
      # list) applies. Exits non-zero on any unignored vulnerability;
      # unmaintained/unsound/yanked warnings are reported without failing.
      - name: Audit dependencies
        run: cargo audit

  docs:
    name: docs check (schema + drift + source-map + runbooks + secrets + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: the docs job builds without the mold RUSTFLAGS, and
          # RUSTFLAGS is part of the rust-cache key, so it cannot share `xtask`.
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: docs check
        run: cargo xtask docs check
        env:
          RUSTFLAGS: -D warnings

  feature-matrix:
    name: cargo-hack (feature powerset)
    runs-on: ubuntu-latest
    # Expensive (issue #125): run only on schedule, push to main, manual
    # dispatch (always a full run), or when the dependency graph / feature
    # set / CI workflow changes.
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.feature_matrix == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hack
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack

      # Validates every feature combination compiles. knowledge gates its
      # protocol bridge behind the `protocol` feature; --all-features only
      # exercises the everything-on case.
      - name: Check feature powerset
        run: cargo hack --feature-powerset --workspace clippy --all-targets

  # Pull requests get the stable source-level `shear` job below. cargo-udeps
  # needs the nightly toolchain and a full workspace build, so it runs only on
  # push to main, the nightly sweep, and manual dispatch. It is the backstop for
  # what cargo-shear cannot see: a dependency whose only reference sits in code
  # compiled out for the host (e.g. `#[cfg(target_os = "macos")]` on Linux).
  udeps:
    name: cargo-udeps (unused dependencies)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      # A dated nightly, never a floating one (scripts/check-rust-toolchain-pin);
      # scripts/bump-rust-toolchain --nightly moves it. setup-rust exports
      # RUSTUP_TOOLCHAIN so cargo uses it despite rust-toolchain.toml.
      - name: Install nightly toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-10-12

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-udeps
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-udeps
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-udeps

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets --all-features

  # Unused-dependency check for every event, including pull requests. It reads
  # manifests and sources without compiling, so it needs only stable cargo for
  # `cargo metadata` and finishes in seconds. It also reports unused
  # `[workspace.dependencies]` entries and direct dependencies that are loaded
  # transitively anyway, both of which cargo-udeps misses (issue #173). A false
  # positive is suppressed per crate with
  # `[package.metadata.cargo-shear] ignored = ["<crate>"]` plus a reason comment.
  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  shear:
    name: cargo-shear (unused dependencies)
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install cargo-shear
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-shear@1.14.0

      - name: Check for unused dependencies
        run: cargo shear --locked --deny-warnings --format=github
