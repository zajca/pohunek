name: CI

# Test everything on every push to main and on every pull request: formatting,
# lints (warnings are errors), the full test suite, and a release build of both
# binaries so a broken release profile is caught before tagging.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # The daemon socket tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`). `cargo test` only builds the bin's
      # test harness, never the runnable binary, so build it explicitly first.
      - name: Build session worker for daemon tests
        run: cargo build -p pohunek-session-worker --bin pohunek-sessiond

      - name: Test
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release

  docs:
    name: docs check (schema + drift + source-map + runbooks + secrets + release extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: docs check
        run: cargo xtask docs check
        env:
          RUSTFLAGS: -D warnings

      - name: TS binding drift
        run: cargo xtask ts check
        env:
          RUSTFLAGS: -D warnings

  web:
    name: web SDK + control center
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun run typecheck

      - name: Lint web
        working-directory: web
        run: bun run lint

      - name: Test web
        working-directory: web
        run: bun test

      - name: Build web control center
        working-directory: web
        run: bun run build:frontend

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Test web control center
        working-directory: web
        run: bun run test:e2e

      # The real daemon spawns the durable worker (`pohunek-sessiond`) by path,
      # so the e2e suites need both binaries present in target/debug.
      - name: Build daemon and session worker for web e2e
        run: cargo build -p pohunek-daemon -p pohunek-session-worker

      - name: SDK e2e against real daemon
        working-directory: web
        run: bun test sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Backend e2e against real daemon
        working-directory: web
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

  # Dependency hygiene (M-STATIC-VERIFICATION): security advisories, the Cargo
  # feature matrix, and unused dependencies. Kept off the critical `test` job so
  # an advisory in a transitive crate stays visible without masking a real
  # failure.
  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  feature-matrix:
    name: cargo-hack (feature powerset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-matrix

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Validates every feature combination compiles. knowledge gates its
      # protocol bridge behind the `protocol` feature; --all-features only
      # exercises the everything-on case.
      - name: Check feature powerset
        run: cargo hack --feature-powerset --workspace clippy --all-targets

  udeps:
    name: cargo-udeps (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: udeps

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets --all-features
