name: CI

# Test everything on every push to main and on every pull request: formatting,
# lints (warnings are errors), the full test suite, and a release build of both
# binaries so a broken release profile is caught before tagging. Doctests run on
# every pull request. The release build (job `release-build`) runs on push to
# main, the daily schedule, and manual dispatch, and on pull requests only when
# the `release` paths filter matches (manifests, lockfile, .cargo, toolchain
# pins, the release/CI workflows, scripts/release, packaging). The release
# rehearsal (jobs `release-rehearsal-build` and `release-rehearsal`) runs the
# reusable release workflows with a throwaway key and publishes nothing; it is
# part of the nightly tier, not of the main tier.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: CI tier to run
        required: true
        type: choice
        options:
          - main
          - nightly
      dispatch_id:
        description: Correlates an automated evidence request with its workflow run
        required: false
        type: string
  # Daily sweep to catch regressions in jobs that are path-filtered out on
  # normal PRs (issue #125). Runs at 05:00 UTC; `pull_request_target`
  # is intentionally avoided to keep the default pull-request provenance model.
  schedule:
    - cron: '0 5 * * *'

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('CI [tier={0}] [dispatch={1}]', inputs.tier, inputs.dispatch_id) || (github.event_name == 'workflow_dispatch' && format('CI [tier={0}]', inputs.tier)) || ' ' }}


# A new PR push cancels the PR's run in progress (latest wins). Pushes to main
# drain (#1209): the running main run completes, and GitHub keeps only the
# newest push pending behind it, replacing an older pending one. Each scheduled
# or manual run gets its own group, so it neither cancels nor waits for those.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation in CI: rust-cache strips incremental
  # artifacts before persisting anyway, so producing them only wastes time.
  # Kept explicit (issue #124) so every job benefits even before restore.
  CARGO_INCREMENTAL: "0"
  # G2 of #1218: a narrowed pull request runs its tests from a sparse tree
  # holding only the files whose change selects them. Off until a G3 seeding
  # run shows every package's tests green from its own sparse tree.
  TEST_SELECTION_SPARSE: "false"
  # A Python script never imports from its own directory or the working
  # directory, so a file a pull request adds there cannot shadow a module.
  PYTHONSAFEPATH: "1"
  # Test binaries (issue #170): job `build-tests` compiles the workspace test
  # binaries once (`cargo nextest archive --workspace --all-features`) and
  # uploads the archive. The test jobs (fast shards, heavy, relay DB) download
  # it and run from it via scripts/test-partitions --archive-file; they install
  # only cargo-nextest, no rust-cache (the heavy job also needs a toolchain with
  # Clippy and the fetched crate sources for xtask::dependency_policy). Tests
  # resolve binaries and sources at run time (`CARGO_BIN_EXE_*`,
  # `CARGO_MANIFEST_DIR`, the worker beside the test binaries), so the archive
  # is relocatable: the test jobs check the repository out into `relocated/`,
  # a different absolute path than the one `build-tests` compiled at, and every
  # run proves it. `.config/nextest.toml` archive.include makes the archive
  # build fail when pohunek-sessiond is missing, so a test never runs without
  # its worker.
  # Job `build-bins` stays a separate default-feature build: the archive
  # compiles with --all-features, which enables cli's `test-util` seams, and
  # the SDK e2e job must exercise shipped binaries. The Hermes jobs build their
  # binaries with default features in-job for the same reason.
  # Compile cache (issue #164): Swatinem/rust-cache is the only compile-cache
  # layer. Each Rust job restores the entry of its job type (`shared-key`:
  # clippy, test-debug, bins, release, xtask, docs, hack, nightly-udeps,
  # platform-contracts, darwin-check). The full key also hashes the toolchain, the
  # RUST*/CARGO* environment (RUSTFLAGS included), and the Cargo manifests.
  # rust-cache saves only on a key miss and the first finisher wins, so each
  # key has exactly one designated saver, the job that builds the superset
  # of the key's artifacts; every other job in the group sets `save-if:
  # false`. The saver saves only for refs/heads/main (push, schedule, and
  # dispatch on main): PR runs restore main's entries and never evict them.
  # The mold -C link-arg=-fuse-ld=mold RUSTFLAGS live in each Linux Rust
  # job's `env`, not here, because the macOS and docs jobs do not install
  # mold. .github/actions/setup-mold puts mold on PATH without touching
  # /usr/bin/ld: only those RUSTFLAGS select mold.
  # Pinned mold release for .github/actions/setup-mold. MOLD_SHA256 is the
  # sha256 GitHub publishes for the release asset
  # mold-2.42.1-x86_64-linux.tar.gz (`gh api repos/rui314/mold/releases/tags/v2.42.1`,
  # asset `digest`), cross-checked against a local download. Bump both together.
  MOLD_VERSION: "2.42.1"
  MOLD_SHA256: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855
  # Pinned zig release for .github/actions/setup-zig, used only as the C compiler
  # of the `darwin-check` job. ZIG_SHA256 is the sha256 ziglang.org publishes for
  # zig-x86_64-linux-0.17.0.tar.xz (https://ziglang.org/download/index.json).
  # Bump both together.
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  # Time limit of the release baseline download in `package-selection`. The
  # assets it selects are small (release v0.34.2: 10 files, 15 KB in all), so
  # a healthy download is one API listing plus a request per file, done in
  # seconds; two minutes leaves room for slow requests and larger packages. A
  # download that runs out of time counts as failed: every package job runs.
  PACKAGE_BASELINE_FETCH_TIMEOUT: 120s
  # Releases listed by `package-version-bump` to find the last released
  # version at or below the workspace version. `gh release list` returns the
  # newest releases first, and the wanted release is the newest one at or
  # below the workspace version; 200 is far more releases than are published
  # between two workspace version bumps.
  PACKAGE_BUMP_RELEASE_LIMIT: 200

jobs:
  platform-contracts:
    name: platform contracts (arm64)
    # macOS runners are costly (issue #125): run in the main/nightly tiers or
    # on a PR when platform inputs change via the paths filter. A narrowed
    # selection whose lane part selects no lane package skips it (#1225).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) || (github.event_name == 'pull_request' && needs.changes.outputs.macos == 'true' && (needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.lane != 'false'))) }}
    needs: [changes, test-selection]
    runs-on: macos-15
    # The lane's test phase takes about 450 s on macos-15; the rest of the
    # budget covers the toolchain, cache restore and a cold build.
    timeout-minutes: 45
    env:
      # Compile against the oldest supported macOS, 14.0. CI tests on macOS 15
      # only; macOS 14 is a supported build target without CI acceptance.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      # The documented macOS contributor path (issue #801): the dev-bootstrap
      # scenarios under the runner's own python3, and the real host's native
      # path, which must report the launchd gui/<uid> domain every launchd
      # suite below needs. `shell: bash` adds pipefail, so a non-zero
      # dev-bootstrap exit fails the step while tee still shows its document.
      - name: Check the macOS contributor path
        shell: bash
        run: |
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "python3 " + sys.version.split()[0] + " is older than 3.11; scripts/dev-bootstrap needs tomllib")'
          python3 -m unittest discover -s scripts/tests -p test_dev_bootstrap.py
          report="$RUNNER_TEMP/dev-bootstrap-native.json"
          scripts/dev-bootstrap --json --path native | tee "$report"
          python3 -I - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          status = {row["name"]: row["status"] for row in doc["rows"]}.get("launchd-gui-domain")
          if doc["os"] != "Darwin" or status != "ok":
              sys.exit(f"dev-bootstrap --path native: os {doc['os']!r}, launchd-gui-domain {status!r}; expected Darwin and 'ok'")
          PY

      - name: Require the Hermes test interpreter
        uses: ./.github/actions/hermes-test-python

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-contracts
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Verify native APFS test volume
        run: diskutil info / | grep -q 'Type (Bundle):.*apfs'

      # Issue #100: every launchd suite needs the logged-in GUI session's
      # `gui/<uid>` domain. Its absence is a hard failure, never a skip.
      - name: Require the launchd gui domain
        run: /bin/launchctl print "gui/$(id -u)" >/dev/null

      # Linux clippy never compiles the launchd backend or other
      # `cfg(target_os = "macos")` code, so the lane lints it natively. The
      # lint is not replaced by scripts/darwin-check, which runs --all-features.
      # pohunek-worker-protocol must stay free of platform code (issue #98).
      - name: Lint macOS lane packages
        run: cargo clippy --locked -p pohunek-platform -p pohunek-paths -p pohunek-worker-protocol -p pohunek-session-worker -p pohunek-service-config -p pohunek-test-support -p pohunek-daemon -p pohunek-cli -p pohunek-hostcheck --all-targets -- -D warnings

      # One archive holds the test binaries of the nine lane packages, and the
      # binaries the tests spawn by path. The macos profile in
      # .config/nextest.toml sets the thread count, retries and the launchd
      # test group for the run below.
      - name: Build macOS lane archive
        if: ${{ !cancelled() }}
        run: cargo nextest archive --locked --profile macos -p pohunek-platform -p pohunek-paths -p pohunek-worker-protocol -p pohunek-session-worker -p pohunek-service-config -p pohunek-test-support -p pohunek-daemon -p pohunek-cli -p pohunek-hostcheck --archive-file "$RUNNER_TEMP/macos-lane.tar.zst"

      # Fails when a lane test is absent from the archive or selected twice.
      - name: Check macOS lane partition
        if: ${{ !cancelled() }}
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/macos-lane.tar.zst" check-macos --scope lane

      # Covers the Darwin process backend (same-user facts, descendants, cwd,
      # controlling-terminal groups, the kqueue NOTE_EXIT watch), the Darwin peer
      # backend (LOCAL_PEERCRED, LOCAL_PEERPID, and the last_pid drift that
      # Binding::revalidate must reject), and the real gui/<uid> launchd suites.
      # Those paths run only on a native runner.
      # Independent of the check: the tests still run when the partition check fails.
      - name: Download test selection
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection

      # A narrowed selection runs the lane tests of its lane part; the lint
      # and the doctests stay whole. `SKIP_OWNED_BY` repeats the
      # `hermes-compatibility-macos` condition: when that job runs, it runs the
      # `hermes_package` module with the ignored real-Hermes tests, so the lane
      # leaves that module out (#1226).
      - name: Run macOS lane tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NARROWED: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
          SKIP_OWNED_BY: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.hermes_macos == 'true') && 'hermes-macos' || '' }}
        run: |
          set -euo pipefail
          if [ "$NARROWED" = true ]; then
            python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/macos-lane.tar.zst" run-macos --selection "$RUNNER_TEMP/test-selection/selection.json" ${SKIP_OWNED_BY:+--skip-owned-by "$SKIP_OWNED_BY"}
          else
            python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/macos-lane.tar.zst" run-macos ${SKIP_OWNED_BY:+--skip-owned-by "$SKIP_OWNED_BY"}
          fi

      # nextest runs no doctests, so the lane packages' doc examples run here,
      # natively, where their Darwin code paths are compiled.
      - name: Run macOS lane doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --doc -p pohunek-platform -p pohunek-paths -p pohunek-worker-protocol -p pohunek-session-worker -p pohunek-service-config -p pohunek-test-support -p pohunek-daemon -p pohunek-cli -p pohunek-hostcheck

      - name: Test APFS foreign-owner rejection
        if: ${{ !cancelled() }}
        # The foreign-owned directory needs root. The lane's lib test binary is
        # run from the archive extracted by the steps above, so no root-owned
        # file is written under target/, which rust-cache saves.
        shell: bash
        run: |
          set -euo pipefail
          metadata="$PWD/target/nextest/binaries-metadata.json"
          test -f "$metadata" || { echo "archive metadata missing: $metadata" >&2; exit 1; }
          bin="$(python3 -I -c "
          import json, os, sys
          metadata, root = sys.argv[1], sys.argv[2]
          summary = json.load(open(metadata))
          target_dir = summary['rust-build-meta']['target-directory'].rstrip('/')
          entry = summary['rust-binaries'].get('pohunek-platform')
          if entry is None:
              sys.exit('no pohunek-platform lib test binary in the archive metadata')
          path = entry['binary-path']
          # The archive records the build-time target directory; extraction
          # places the binaries under <root>/target. Only that extracted copy
          # is the binary this run built, so no other path is accepted.
          if os.path.isabs(path):
              if not path.startswith(target_dir + '/'):
                  sys.exit(f'binary path {path} is outside the recorded target directory {target_dir}')
              path = os.path.relpath(path, target_dir)
          extracted = os.path.join(root, 'target', path)
          if not os.path.isfile(extracted):
              sys.exit(f'pohunek-platform lib test binary not extracted at {extracted}')
          print(extracted)
          " "$metadata" "$PWD")"
          output="$RUNNER_TEMP/apfs-root-test.txt"
          (cd "$PWD/crates/platform" && sudo env TMPDIR=/tmp "$bin" filesystem::tests::apfs_foreign_owned_private_directory_is_rejected --ignored --exact) | tee "$output"
          # libtest exits 0 when the filter matches nothing, so require that
          # exactly this one test ran and passed.
          grep -qx 'test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]* filtered out; finished in .*' "$output" \
            || { echo "the APFS root test did not run exactly once" >&2; exit 1; }

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "macos lane" target/nextest/macos/junit.xml

      - name: Upload macOS lane test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-lane-junit
          path: target/nextest/macos/junit.xml
          if-no-files-found: warn

  # The macOS packages the PR lane does not test (issue #361): their macOS-only
  # test code runs here on main and nightly, never on a pull request.
  macos-tier:
    name: macOS tier packages (arm64)
    # No pull_request branch: this job never starts on a pull request.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Require the Hermes test interpreter
        uses: ./.github/actions/hermes-test-python

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-tier
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # xtask's dependency_policy test reads the registry sources of the locked
      # dependency graph, which an archive build does not fetch.
      - name: Fetch locked crate sources
        run: cargo fetch --locked

      # Same contract as the lane: a launchd-backed test in these packages fails
      # when the `gui/<uid>` domain is absent, and never skips.
      - name: Require the launchd gui domain
        run: /bin/launchctl print "gui/$(id -u)" >/dev/null

      - name: Build macOS tier archive
        run: cargo nextest archive --locked --profile macos -p pohunek-platform -p pohunek-paths -p pohunek-worker-protocol -p pohunek-session-worker -p pohunek-service-config -p pohunek-test-support -p pohunek-daemon -p pohunek-cli -p pohunek-hostcheck -p pohunek-client -p pohunek-netbird -p pohunek-package -p xtask --archive-file "$RUNNER_TEMP/macos-all.tar.zst"

      # Covers all 13 macOS packages: the lane's nine and the tier's four.
      - name: Check macOS partition
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/macos-all.tar.zst" check-macos --scope all

      # The Hermes macOS job runs in every workflow run that starts this job and
      # runs the xtask Hermes harness tests itself, so they are left out here (#1226).
      - name: Run macOS tier tests
        if: ${{ !cancelled() }}
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/macos-all.tar.zst" run-macos-tier --skip-owned-by hermes-macos

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "macos tier" target/nextest/macos/junit.xml

      - name: Upload macOS tier test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-tier-junit
          path: target/nextest/macos/junit.xml
          if-no-files-found: warn

  # The version-A release daemon for aarch64-apple-darwin, built once per run
  # (issue #1210). `macos-package` and `hermes-compatibility-macos` download
  # it instead of compiling it on their own macOS runners; it runs whenever
  # either of them does.
  macos-release-build:
    name: macOS release daemon build (macos-15)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) || github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.macos_package == 'true' || needs.changes.outputs.hermes_macos == 'true')) }}
    needs: changes
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-release-build-macos-15
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # build-release maps the checkout, cargo home and sysroot paths to fixed
      # names, so the binaries do not depend on which runner built them. The
      # tar keeps their executable mode, which an artifact upload drops.
      - name: Build the daemon component
        shell: bash
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release daemon)"
          tar -C "$bindir" -cf "$RUNNER_TEMP/macos-release-daemon.tar" pohunek pohunekd pohunek-sessiond
          {
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo '```'
            (cd "$bindir" && shasum -a 256 pohunek pohunekd pohunek-sessiond)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the daemon binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-daemon
          path: ${{ runner.temp }}/macos-release-daemon.tar
          retention-days: 1
          if-no-files-found: error

  # Native Apple Silicon packaging (issue #104): the daemon archive is packaged
  # from the binaries of `macos-release-build`, and the nightly tier rebuilds
  # them cold here and requires byte-identical binaries and archive. Its Mach-O
  # files are audited, and the extracted archives are installed, upgraded, and
  # uninstalled against real launchd with live sessions
  # (scripts/acceptance/macos-package-install). Archives built here take the
  # release path (`package --stage-release`, then `package --adhoc-release`), so
  # they carry ad-hoc signatures and `signing adhoc` in the MANIFEST, and
  # `verify-signed --adhoc` checks them.
  macos-package:
    # macOS 15 is the tested platform. The archives target macOS 14.0, a
    # supported build target that CI does not run (issue #1224).
    name: macOS package install and upgrade (macos-15)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'main' || inputs.tier == 'nightly')) || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.macos_package == 'true') }}
    needs: [changes, macos-release-build]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # mold is Linux-only: keep the default linker on macOS runners.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-package-macos-15
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build offline documentation
        run: cargo xtask docs site

      # The version-A binaries come from `macos-release-build`; this job does
      # not compile them.
      - name: Download the daemon binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-daemon
          path: ${{ runner.temp }}/macos-release-daemon-download

      - name: Unpack the daemon binaries
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/macos-release-daemon"
          rm -rf "$bindir"
          mkdir -p "$bindir"
          tar -C "$bindir" -xf "$RUNNER_TEMP/macos-release-daemon-download/macos-release-daemon.tar"
          for binary in pohunek pohunekd pohunek-sessiond; do
            test -x "$bindir/$binary"
          done
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Package version A
        id: package-a
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/ { in_pkg = 1; next } /^\[/ { in_pkg = 0 } in_pkg && /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/dist-a"
          staging="$(packaging/macos/package --stage-release daemon "$version" \
            "${{ steps.build.outputs.bindir }}" target/pohunek-docs "$RUNNER_TEMP/dist-a")"
          archive="$(packaging/macos/package --adhoc-release daemon "$version" "$staging")"
          packaging/macos/verify-signed --adhoc "$staging"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # The same commit rebuilt here from a cold release directory, at the same
      # checkout path as on the builder's runner, must produce the builder's
      # binaries and the same archive. Cargo mixes the RUSTFLAGS text (which
      # carries the checkout path for path remapping) into every crate's
      # metadata hash, so the path itself stays fixed.
      - name: Rebuild from a cold release directory and compare
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly') }}
        shell: bash
        run: |
          set -euo pipefail
          # The builder's job summary names its runner image, for a mismatch.
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          first="$RUNNER_TEMP/first-binaries"
          mkdir -p "$first" "$RUNNER_TEMP/dist-repro"
          for binary in pohunek pohunekd pohunek-sessiond; do
            cp "${{ steps.build.outputs.bindir }}/$binary" "$first/"
          done
          rm -rf target/aarch64-apple-darwin/release
          bindir="$(packaging/macos/build-release daemon)"
          for binary in pohunek pohunekd pohunek-sessiond; do
            cmp "$first/$binary" "$bindir/$binary" \
              || { echo "::error::$binary is not reproducible from a cold build"; exit 1; }
          done
          rebuilt_staging="$(packaging/macos/package --stage-release daemon \
            "${{ steps.package-a.outputs.version }}" "$bindir" target/pohunek-docs "$RUNNER_TEMP/dist-repro")"
          rebuilt="$(packaging/macos/package --adhoc-release daemon \
            "${{ steps.package-a.outputs.version }}" "$rebuilt_staging")"
          cmp "${{ steps.package-a.outputs.archive }}" "$rebuilt" \
            || { echo "::error::the daemon archive is not reproducible from a cold build"; exit 1; }

      # A second version of the same tree, so the upgrade installs different
      # real binaries. The workspace version is bumped only in this runner's
      # checkout and restored afterwards.
      - name: Build and package version B
        id: package-b
        shell: bash
        run: |
          set -euo pipefail
          version_b="$(python3 - <<'PY'
          import re
          text = open("Cargo.toml").read()
          match = re.search(r'(\[workspace\.package\][^\[]*?version\s*=\s*")(\d+)\.(\d+)\.(\d+)(")', text, re.S)
          major, minor, patch = (int(match.group(i)) for i in (2, 3, 4))
          bumped = "%d.%d.%d" % (major, minor, patch + 1)
          open("Cargo.toml", "w").write(text[:match.start()] + match.group(1) + bumped + match.group(5) + text[match.end():])
          print(bumped)
          PY
          )"
          bindir="$(CARGO_LOCKED_FLAG="" packaging/macos/build-release daemon)"
          mkdir -p "$RUNNER_TEMP/dist-b"
          staging="$(packaging/macos/package --stage-release daemon "$version_b" "$bindir" target/pohunek-docs "$RUNNER_TEMP/dist-b")"
          archive="$(packaging/macos/package --adhoc-release daemon "$version_b" "$staging")"
          packaging/macos/verify-signed --adhoc "$staging"
          git checkout -- Cargo.toml Cargo.lock
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Install, upgrade, and uninstall from the archives
        timeout-minutes: 20
        env:
          PKG_ACCEPT_ARCHIVE: ${{ steps.package-a.outputs.archive }}
          PKG_ACCEPT_UPGRADE_ARCHIVE: ${{ steps.package-b.outputs.archive }}
        run: scripts/acceptance/macos-package-install

  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  test:
    name: fmt + clippy
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

  # Lints the macOS-only code on a Linux runner in about two minutes cold
  # (issue #365), so a `cfg(target_os = "macos")` compile or lint error fails a
  # pull request here instead of after the 9-13 minute native `platform
  # contracts (arm64)` job. It only checks: nothing is linked or run, so the
  # native jobs stay the acceptance evidence. The Apple SDK is absent, so
  # scripts/darwin-check compiles the C build scripts of `ring` and `psm` with
  # `zig cc`, which carries the macOS libc headers. Runs on every event, like
  # `fmt + clippy`: one cheap job whose failure is the signal, with no paths
  # filter that could hide a macOS-only break.
  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  darwin-check:
    name: macOS lint from Linux (aarch64-apple-darwin clippy)
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    env:
      # No mold link argument: the lint links nothing, and with an explicit
      # `--target` RUSTFLAGS apply to the Apple target only.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: darwin-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy for aarch64-apple-darwin
        run: scripts/darwin-check

  # Selects the pull request's tests with the selector of its merge base
  # (scripts/ci-test-selection); every other event runs every test. A test
  # job narrows or skips only on an explicit output of a successful run of
  # this job, so a failed or skipped selection runs everything.
  test-selection:
    name: test selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      narrowed: ${{ steps.narrow.outputs.narrowed }}
      docs_only: ${{ steps.select.outputs.docs_only }}
      script_tests: ${{ steps.select.outputs.script_tests }}
      sdk_gates: ${{ steps.select.outputs.sdk_gates }}
      fast_shards: ${{ steps.plan.outputs.fast_shards }}
      heavy: ${{ steps.plan.outputs.heavy }}
      relay_db: ${{ steps.plan.outputs.relay_db }}
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base of a pull request and its base commit needs history;
          # every other event runs every test from this commit alone.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Install mold linker
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: false

      # The event and the base commit reach the script only through the
      # environment. It writes a full selection naming the cause whenever it
      # cannot select.
      - name: Select the tests
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/test-selection"
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-test-selection --base "$BASE_SHA" --out "$out"
          else
            scripts/ci-test-selection --full "a $EVENT run runs every test" --out "$out"
          fi
          cat "$out/outputs.env" >> "$GITHUB_OUTPUT"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The selection and the plan are written by scripts of the head tree.
      # They may narrow the run only when the test pipeline, every file that
      # decides or runs the CI test jobs, equals its merge-base copy: then the
      # head scripts are the merge base's. This step alone writes `narrowed`,
      # and every job that skips or narrows tests requires it.
      # Trust bound: a pull request runs its own ci.yml, so one that rewrites
      # it can remove any check, as in any design. Such a change is in the
      # pipeline (`.github/`), so its run never narrows, and its protection is
      # the review of workflow changes.
      - name: Decide whether the selection narrows the run
        id: narrow
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          set -euo pipefail
          # The CI_RULES paths of `cargo xtask affected` and the files
          # scripts/test-partitions reads. All of scripts/: a file added next
          # to a script can shadow a module it imports.
          pipeline=(
            .github
            .config/nextest.toml
            scripts
          )
          narrowed=false
          if [ "$EVENT" != pull_request ]; then
            reason="a $EVENT run runs every test"
          elif ! base=$(git merge-base "$BASE_SHA" HEAD); then
            reason="the pull request has no merge base with $BASE_SHA"
          elif ! changed=$(git diff --no-renames --name-only "$base" HEAD -- "${pipeline[@]}"); then
            reason="the test pipeline cannot be compared with the merge base"
          elif [ -n "$changed" ]; then
            reason="the pull request changes the test pipeline: $(echo "$changed" | head -n 5 | paste -sd ' ')"
          elif [ "$MODE" != packages ] && [ "$MODE" != none ]; then
            reason="the selection is $MODE"
          else
            narrowed=true
            reason="the test pipeline equals the merge base's"
          fi
          echo "narrowed=$narrowed" >> "$GITHUB_OUTPUT"
          echo "Narrowed: $narrowed ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan the test jobs
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-partitions plan --selection "$RUNNER_TEMP/test-selection/selection.json" >> "$GITHUB_OUTPUT"

      - name: Upload test selection
        uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection/
          retention-days: 1
          if-no-files-found: error

  # Compiles every workspace test binary exactly once for the fast shards, the
  # heavy job, and the relay DB job (issue #170). Designated `test-debug`
  # saver; the same `--workspace --all-features` build also warms doctests.
  build-tests:
    name: build tests (nextest archive)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # The archive holds the test binaries, the runnable bins the tests spawn,
      # and pohunek-sessiond (archive.include in .config/nextest.toml, an error
      # when absent). It is kept outside target/ so rust-cache never saves it.
      - name: Archive workspace test binaries
        run: cargo nextest archive --profile ci --workspace --all-features --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Report archive size
        run: |
          size="$(stat -c %s "$RUNNER_TEMP/nextest-archive.tar.zst")"
          echo "nextest archive: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      # The archive is already zstd-compressed: store it as is (level 0).
      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  fast-tests:
    name: tests (${{ matrix.shard }}, fast)
    needs: [build-tests, test-selection]
    if: ${{ !cancelled() && needs.build-tests.result == 'success' && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.fast_shards != '[]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shards a narrowed selection plans; every shard otherwise.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.fast_shards || '["core", "daemon", "relay", "cli"]') }}
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      - name: Download test selection
        if: github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection

      # A test that runs cargo, such as `cargo metadata` in xtask's affected
      # tests, finds the pinned toolchain installed. Otherwise rustup installs
      # it mid-test, and concurrent installs race on ~/.rustup/downloads.
      - name: Install Rust toolchain
        uses: ./relocated/.github/actions/setup-rust

      - name: Check script regressions
        if: matrix.shard == 'core' && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.script_tests != 'false')
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # Every workflow installs Rust from rust-toolchain.toml or a dated nightly.
      - name: Check the Rust toolchain pin
        if: matrix.shard == 'core'
        run: scripts/check-rust-toolchain-pin

      # The tests run from a tree holding only the files whose change selects
      # them, so a read of any other path fails instead of passing with the
      # test skipped. A run without sparse.txt keeps the full tree.
      - name: Keep only the selection's files in the tree
        if: env.TEST_SELECTION_SPARSE == 'true' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sparse="$RUNNER_TEMP/test-selection/sparse.txt"
          if [ -f "$sparse" ]; then
            git sparse-checkout set --no-cone --stdin < "$sparse"
            echo "sparse tree of $(wc -l < "$sparse") files"
          fi

      # No dependency on Clippy, PostgreSQL, PTYs, or the release build.
      - name: Run fast shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          NARROWED: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
        run: |
          set -euo pipefail
          selection=()
          if [ "$NARROWED" = true ]; then
            selection=(--selection "$RUNNER_TEMP/test-selection/selection.json")
          fi
          python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run "$SHARD" "${selection[@]}"

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "fast ${{ matrix.shard }}" target/nextest/ci/junit.xml

      - name: Upload shard timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: relocated/target/nextest/ci/junit.xml
          if-no-files-found: warn

    # Determine which CI jobs the changed files require. Heavy non-default jobs
  # (feature-powerset, macOS contracts, Hermes compatibility, and TS-binding
  # drift) only run when their inputs change or on a schedule; the
  # always-critical jobs (fmt, clippy, fast tests, heavy tests, doctests,
  # docs check, relay DB) still run on every push and PR. The release build
  # is gated by the `release` filter. The workflow file
  # itself forces a relay run so filter edits are always validated. Every
  # filter lists rust-toolchain.toml and .github/actions/setup-rust/**, so a
  # toolchain pin change runs every Rust job.
  changes:
    name: required jobs (paths filter)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      feature_matrix: ${{ steps.filter.outputs.feature_matrix }}
      macos: ${{ steps.filter.outputs.macos }}
      macos_package: ${{ steps.filter.outputs.macos_package }}
      sdk_macos: ${{ steps.filter.outputs.sdk_macos }}
      hermes_macos: ${{ steps.filter.outputs.hermes_macos }}
      docs_ts: ${{ steps.filter.outputs.docs_ts }}
      release: ${{ steps.filter.outputs.release }}
      release_rehearsal: ${{ steps.filter.outputs.release_rehearsal }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
    steps:
      # Push events (after merge to main) resolve the filter with git commands
      # against the previous commit, which needs more than a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Every job of the run checks out GITHUB_SHA (the merge ref of a pull
      # request, the run's commit otherwise), so this tree is the tree the run
      # tests. scripts/ci-evidence reads it from the artifact name to accept a
      # dispatch run as evidence for another commit of the same tree; its
      # tree_match_max_age_days stays below the retention.
      - name: Record the tested tree
        id: tree
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/tested-tree"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Tested tree \`$tree\` of commit \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the tested-tree record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30
          # A re-run of this job uploads the same record again.
          overwrite: true
          if-no-files-found: error
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relay:
              - 'crates/relay/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay/migrations/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # cargo-hack feature-powerset is expensive (issue #125): run only
            # on schedule or when the dependency graph, feature set, or any
            # workspace Rust source changes — the powerset compiles feature
            # branches of source code, not just manifests.
            feature_matrix:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'crates/**/*.rs'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # macOS platform, path, private-protocol, session-worker, daemon,
            # CLI, launchd, and Hermes filesystem contracts run on the native
            # arm64 runner (issues #96-#100 and #125): gate on every crate
            # exercised by the job and every crate the daemon and CLI link, the cross-platform dependency graph, and
            # the Cargo configuration (.cargo/config.toml carries Apple-specific
            # linker/target flags that can break only the macOS build). The root
            # manifest is included because these crates inherit workspace
            # package, dependency, and lint settings from it. The job also runs
            # the macOS contributor path (scripts/dev-bootstrap and its
            # scenarios, issue #801), and the lane's nextest profile and runner
            # (.config/nextest.toml, scripts/test-partitions, issue #361).
            macos:
              - 'Cargo.toml'
              - 'crates/platform/**'
              - 'crates/paths/**'
              - 'crates/worker-protocol/**'
              - 'crates/session-worker/**'
              - 'crates/terminal/**'
              - 'crates/logging/**'
              - 'crates/service-config/**'
              - 'crates/test-support/**'
              - 'crates/daemon/**'
              - 'crates/cli/**'
              - 'crates/protocol/**'
              - 'crates/client/**'
              - 'crates/knowledge/**'
              - 'crates/hostcheck/**'
              - 'crates/netbird/**'
              - 'crates/overlay/**'
              - 'crates/prompt/**'
              - 'crates/assistant/**'
              - 'crates/package/**'
              - 'scripts/acceptance/**'
              - 'scripts/dev-bootstrap'
              - 'scripts/tests/test_dev_bootstrap.py'
              - 'scripts/test-partitions'
              - '.config/nextest.toml'
              - '.github/actions/hermes-test-python/**'
              - 'crates/relay-client/**'
              - 'crates/relay-protocol/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # Native macOS release packaging (issue #104): PRs gate the archive
            # scripts, install acceptance and launchd service code. Main and
            # nightly runs cover the complete packaged daemon dependency tree.
            # The macOS package job is part of PR CI only when its packaging,
            # install-acceptance, or launchd-specific inputs change. Main and
            # nightly runs provide the broad package-build coverage.
            macos_package:
              - 'packaging/**'
              - 'scripts/acceptance/macos-package-install'
              - 'scripts/acceptance/launchd_lifetime_evidence.py'
              - 'crates/platform/src/supervisor/launchd/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # The SDK workspace runs natively on Apple Silicon against the
            # real macOS daemon (issue #103): PRs run it for SDK workspace
            # inputs; main and nightly also exercise the Rust binaries.
            sdk_macos:
              - 'sdk/ts/**'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # Narrow PR filter of the pinned Hermes compatibility job on macOS
            # (issue #125): the locked runtime metadata, the Hermes package,
            # the CLI's Hermes integration, the Hermes harness of xtask, the
            # provisioner, the package and smoke scripts and their tests. On
            # pull requests the job also runs whenever the runtime package
            # selection selects the Hermes package, which every core change
            # and every file of the package does; main and nightly always run
            # it. The Linux `hermes-package` job follows the selection only.
            hermes_macos:
              - 'compat/hermes/**'
              - 'runtime-packages/hermes/**'
              - 'crates/cli/src/hermes_integration/**'
              - 'crates/cli/tests/support/hermes_provider.rs'
              - 'crates/worker-protocol/src/hook_schema.rs'
              - 'crates/xtask/src/hermes*.rs'
              - 'crates/xtask/src/hermes/**'
              - 'crates/daemon/src/agent/hermes.rs'
              - 'scripts/provision-hermes-compat'
              - 'scripts/tests/provision-hermes-compat.sh'
              - 'scripts/build-hermes-package'
              - 'scripts/smoke-hermes-plugin-release'
              - 'scripts/tests/smoke-hermes-plugin-release.sh'
              - 'scripts/tests/fixtures/smoke-*'
              - 'sdk/ts/sdk/test/e2e.test.ts'
              - 'sdk/ts/sdk/test/hermes-plugin.e2e.test.ts'
              - '.github/workflows/ci.yml'
              - '.config/nextest.toml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # Generated TS binding drift lives under a schedule or when the
            # protocol surface or generation driver changes (issue #125).
            # Covers both generators' inputs and outputs: the main protocol
            # bindings plus the relay bindings (`crates/relay-protocol`, its
            # `pohunek-relay-protocol` ts-rs export, `relay-generated`, and the
            # emitted JSON fixtures) that `cargo xtask ts check` regenerates.
            docs_ts:
              - 'crates/protocol/**'
              - 'crates/relay-protocol/**'
              - 'crates/xtask/Cargo.toml'
              - 'crates/xtask/src/**'
              - 'sdk/ts/protocol/src/generated/**'
              - 'sdk/ts/protocol/src/relay-generated/**'
              - 'sdk/ts/protocol/fixtures/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
            # The release build catches a broken release profile before
            # tagging. That is caused by profile/manifest, lockfile, Cargo
            # configuration, toolchain, or packaging changes; ordinary source
            # edits already compile in the debug jobs. The root manifest
            # carries `[profile.release]`.
            release:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/release'
              - 'packaging/**'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-sccache/**'
            # Release rehearsal (issue #150): the release workflows, the
            # packaging and assembly tools, the compatibility matrix and locks,
            # the official packages, the consumer suite, the scripts the rows
            # and the archive smoke run, the SDK pack inputs, and the crates the
            # assembler and the signed catalog live in. The product crates,
            # docs and SDK sources it also reads are left out on purpose; the
            # guard in scripts/tests/test_ci_tiers.py names them. The rehearsal
            # builds the Linux release artifacts from this commit, runs every
            # matrix row, assembles and signs a bundle with a throwaway key and
            # runs the network-isolated archive smoke on it.
            release_rehearsal:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-build.yml'
              - '.github/workflows/release-evidence.yml'
              - 'packaging/**'
              - 'scripts/release-workflow/**'
              - 'scripts/tests/test_release_workflow.py'
              - 'scripts/tests/test_release_workflow_scripts.py'
              - 'crates/xtask/**'
              - 'crates/package/**'
              - 'compat/**'
              - 'runtime-packages/**'
              - 'crates/cli/tests/release_consumer.rs'
              - 'crates/cli/tests/support/**'
              - 'scripts/provision-hermes-compat'
              - 'scripts/smoke-hermes-plugin-release'
              - 'scripts/tests/test_smoke_archive.py'
              - 'sdk/ts/scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-sccache/**'
            # Upgrade from the previous release's published binaries to this
            # build with a live session (issue #525): the crates that decide
            # whether a live session survives (public protocol, worker
            # protocol, daemon, worker, CLI service engine) and the crates
            # they link that carry state or paths, the installer wrapper, and
            # the harness itself.
            upgrade:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'crates/protocol/**'
              - 'crates/daemon/**'
              - 'crates/session-worker/**'
              - 'crates/worker-protocol/**'
              - 'crates/cli/**'
              - 'crates/client/**'
              - 'crates/platform/**'
              - 'crates/paths/**'
              - 'crates/service-config/**'
              - 'crates/terminal/**'
              - 'scripts/upgrade-test'
              - 'packaging/install-daemon.sh'
              - '.github/workflows/upgrade.yml'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-rust/**'

  integration:
    name: tests (heavy, PTY + Hermes)
    needs: [build-tests, test-selection]
    if: ${{ !cancelled() && needs.build-tests.result == 'success' && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.heavy != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # xtask::dependency_policy resolves an isolated fixture with
      # `cargo tree --offline` and runs Clippy on it, so this job needs a
      # toolchain with Clippy and the locked crates in the cargo registry. It
      # compiles nothing else: the test binaries come from the archive.
      - name: Install Rust toolchain
        uses: ./relocated/.github/actions/setup-rust
        with:
          components: clippy

      - name: Fetch locked dependency sources
        run: cargo fetch --locked

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      # The daemon socket tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`); it comes out of the archive, which
      # cannot be built without it.
      - name: Verify exhaustive disjoint test partitions
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" check

      - name: Download test selection
        if: github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection

      # The tests run from a tree holding only the files whose change selects
      # them, so a read of any other path fails instead of passing with the
      # test skipped. A run without sparse.txt keeps the full tree.
      - name: Keep only the selection's files in the tree
        if: env.TEST_SELECTION_SPARSE == 'true' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sparse="$RUNNER_TEMP/test-selection/sparse.txt"
          if [ -f "$sparse" ]; then
            git sparse-checkout set --no-cone --stdin < "$sparse"
            echo "sparse tree of $(wc -l < "$sparse") files"
          fi

      - name: Heavy tests (bounded nextest concurrency)
        shell: bash
        env:
          SHARD: heavy
          NARROWED: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
        run: |
          set -euo pipefail
          selection=()
          if [ "$NARROWED" = true ]; then
            selection=(--selection "$RUNNER_TEMP/test-selection/selection.json")
          fi
          python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run "$SHARD" "${selection[@]}"

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label heavy target/nextest/heavy/junit.xml

      # Per-test timing evidence for the test-performance work (JUnit `time`
      # attributes). Nextest writes the report under its own storage directory.
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-heavy
          path: relocated/target/nextest/heavy/junit.xml
          if-no-files-found: warn

  # Issue #100: the ignored real-systemd suites drive the runner's own systemd
  # user manager (transient worker units, the namespaced daemon unit, the
  # `pohunek service` transactions, and the workflow plugin units of #326). Hosted Ubuntu runners run a user manager
  # without lingering; the bus address is exported because the job shell does
  # not carry one.
  systemd-supervision:
    name: real systemd supervision
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_SYSTEMD_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Designated `bins` saver: the build-bins binaries plus the test
          # builds of the ignored systemd suites, a superset of build-bins.
          shared-key: bins
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Require a running systemd user manager
        run: |
          systemctl --version | head -n 1
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${XDG_RUNTIME_DIR}/bus" >> "$GITHUB_ENV"
          systemctl --user is-system-running --wait || systemctl --user is-system-running | grep -qx degraded

      - name: Build daemon, worker, and CLI binaries
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli --bins

      - name: Export binary paths
        run: |
          {
            echo "POHUNEK_DAEMON_BIN=$PWD/target/debug/pohunekd"
            echo "POHUNEK_WORKER_BIN=$PWD/target/debug/pohunek-sessiond"
            echo "POHUNEK_CLI_BIN=$PWD/target/debug/pohunek"
          } >> "$GITHUB_ENV"

      - name: Platform systemd backend
        run: cargo test --locked -p pohunek-platform --test systemd -- --ignored --test-threads 1

      - name: Daemon durability on transient units
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test systemd_durable_worker -- --ignored --test-threads 1

      - name: pohunek service transactions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'service_systemd::'

      # Issue #1013: bare `pohunek setup` against the user manager, including
      # the fresh-host run from a signed release.
      - name: pohunek setup on a host
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'setup_host_native::'

      # The `pohunek setup` binary runs that plan a fresh host read the PATH
      # the systemd user manager gives the daemon job.
      - name: pohunek setup binary on a fresh host
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'setup_host::'

      - name: Supervised worker lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-daemon --test supervised_lifecycle -- --ignored --test-threads 1

      - name: pohunek service upgrade with live workers
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'service_upgrade::'

      # Issue #326: workflow plugin jobs and services as persistent user units
      # running the `pohunek workflow __exec` trampoline.
      - name: Workflow plugin units
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'workflow_systemd::'

      # Issue #148: the reaction dispatcher unit and its event delivery.
      - name: Workflow event reactions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pohunek-cli --test all -- --ignored --test-threads 1 'workflow_reactions::'

  # Issue #525: a session started on the previous release survives
  # `pohunek service upgrade` to this build. The job is the reusable
  # upgrade.yml, which downloads the previous release's published binaries and
  # runs scripts/upgrade-test; it is skipped, not failed, when no relevant path
  # changed.
  upgrade-test:
    name: upgrade from the previous release
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.upgrade == 'true' }}
    uses: ./.github/workflows/upgrade.yml
    permissions:
      contents: read

  # Relay heavy tests are the only PostgreSQL fixture consumers, so they get
  # their own job whose Postgres service only starts when relay-relevant files
  # changed (issue #121) — except on the nightly sweep and nightly manual
  # dispatch, which are full runs even when the paths filter is empty.
  # Push to main stays filtered on purpose: the merged commit's relay files
  # still trigger the job via fetch-depth-2 detection, while unrelated pushes
  # never start the Postgres service.
  integration-relay:
    name: tests (relay DB, PostgreSQL)
    needs: [changes, build-tests, test-selection]
    if: ${{ !cancelled() && needs.build-tests.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly') || needs.changes.outputs.relay == 'true') && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.relay_db != 'false') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image from Google's cache, pinned to its OCI index.
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      # A test that runs cargo, such as `cargo metadata` in xtask's affected
      # tests, finds the pinned toolchain installed. Otherwise rustup installs
      # it mid-test, and concurrent installs race on ~/.rustup/downloads.
      - name: Install Rust toolchain
        uses: ./relocated/.github/actions/setup-rust

      - name: Download test selection
        if: github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection

      # The tests run from a tree holding only the files whose change selects
      # them, so a read of any other path fails instead of passing with the
      # test skipped. A run without sparse.txt keeps the full tree.
      - name: Keep only the selection's files in the tree
        if: env.TEST_SELECTION_SPARSE == 'true' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sparse="$RUNNER_TEMP/test-selection/sparse.txt"
          if [ -f "$sparse" ]; then
            git sparse-checkout set --no-cone --stdin < "$sparse"
            echo "sparse tree of $(wc -l < "$sparse") files"
          fi

      - name: Relay database tests (bounded nextest concurrency)
        shell: bash
        env:
          SHARD: relay-db
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          POHUNEK_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/pohunek_test
          NARROWED: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
        run: |
          set -euo pipefail
          selection=()
          if [ "$NARROWED" = true ]; then
            selection=(--selection "$RUNNER_TEMP/test-selection/selection.json")
          fi
          python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" run "$SHARD" "${selection[@]}"

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label relay-db target/nextest/relay-db/junit.xml

      - name: Upload relay DB test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-relay-db
          path: relocated/target/nextest/relay-db/junit.xml
          if-no-files-found: warn

  # Skipping the shards a narrowed plan does not start can drop no selected
  # test: every selected test must lie in a planned shard. It runs on every
  # narrowed selection, whichever test jobs that selection starts.
  test-selection-check:
    name: test selection check
    needs: [build-tests, test-selection]
    if: ${{ !cancelled() && needs.build-tests.result == 'success' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relocated
    steps:
      - uses: actions/checkout@v4
        with:
          path: relocated

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive

      - name: Download test selection
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: ${{ runner.temp }}/test-selection

      - name: Verify the planned shards hold every selected test
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive/nextest-archive.tar.zst" check --selection "$RUNNER_TEMP/test-selection/selection.json"

  # A skipped test job counts as passed, so this job fails a run where a test
  # job failed, was cancelled, or was skipped without a narrowed selection of
  # a pull request that plans nothing for it. The relay DB job is also gated
  # by its paths filter, so only its failure or cancellation counts. The gate
  # jobs of the docs-only path must succeed or be skipped by that path, and the
  # macOS lane by its paths filter or a narrowed selection without lane tests.
  test-selection-verdict:
    name: test selection verdict
    needs: [changes, test-selection, build-tests, test-selection-check, fast-tests, integration, integration-relay, test, darwin-check, doctests, build-bins, sdk, audit, shear, platform-contracts, macos-release-build, hermes-compatibility-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail a test job that failed or was skipped without a narrowed selection
        if: ${{ needs.build-tests.result != 'success' || (needs.fast-tests.result != 'success' && !(needs.fast-tests.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode != 'full' && needs.test-selection.outputs.fast_shards == '[]')) || (needs.integration.result != 'success' && !(needs.integration.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode != 'full' && needs.test-selection.outputs.heavy == 'false')) || needs.integration-relay.result == 'failure' || needs.integration-relay.result == 'cancelled' || needs.test-selection-check.result == 'failure' || needs.test-selection-check.result == 'cancelled' || (github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode != 'full' && needs.test-selection-check.result != 'success') }}
        shell: bash
        env:
          RESULTS: "selection=${{ needs.test-selection.result }} narrowed=${{ needs.test-selection.outputs.narrowed }} mode=${{ needs.test-selection.outputs.mode }} build=${{ needs.build-tests.result }} check=${{ needs.test-selection-check.result }} fast=${{ needs.fast-tests.result }} heavy=${{ needs.integration.result }} relay-db=${{ needs.integration-relay.result }}"
        run: |
          echo "::error::test jobs did not run as the selection requires: $RESULTS"
          exit 1
      - name: Fail a gate job that failed or was skipped without the docs-only path
        if: ${{ (needs.test.result != 'success' && !(needs.test.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.darwin-check.result != 'success' && !(needs.darwin-check.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.doctests.result != 'success' && !(needs.doctests.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.build-bins.result != 'success' && !(needs.build-bins.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.sdk.result != 'success' && !(needs.sdk.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.audit.result != 'success' && !(needs.audit.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) || (needs.shear.result != 'success' && !(needs.shear.result == 'skipped' && github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.mode == 'none' && needs.test-selection.outputs.docs_only == 'true')) }}
        shell: bash
        env:
          RESULTS: "selection=${{ needs.test-selection.result }} narrowed=${{ needs.test-selection.outputs.narrowed }} mode=${{ needs.test-selection.outputs.mode }} docs_only=${{ needs.test-selection.outputs.docs_only }} test=${{ needs.test.result }} darwin-check=${{ needs.darwin-check.result }} doctests=${{ needs.doctests.result }} build-bins=${{ needs.build-bins.result }} sdk=${{ needs.sdk.result }} audit=${{ needs.audit.result }} shear=${{ needs.shear.result }}"
        run: |
          echo "::error::gate jobs did not run as the selection requires: $RESULTS"
          exit 1
      - name: Fail a macOS lane that failed or was skipped without a reason
        if: ${{ needs.platform-contracts.result == 'failure' || needs.platform-contracts.result == 'cancelled' || (needs.platform-contracts.result == 'skipped' && !(github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.macos != 'true' || (github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.narrowed == 'true' && needs.test-selection.outputs.lane == 'false')))) }}
        shell: bash
        env:
          RESULTS: "lane=${{ needs.platform-contracts.result }} changes=${{ needs.changes.result }} macos=${{ needs.changes.outputs.macos }} selection=${{ needs.test-selection.result }} narrowed=${{ needs.test-selection.outputs.narrowed }} lane_plan=${{ needs.test-selection.outputs.lane }}"
        run: |
          echo "::error::the macOS lane did not run as the selection requires: $RESULTS"
          exit 1
      # Under the lane's `SKIP_OWNED_BY` condition the lane leaves the
      # `hermes_package` tests to the Hermes macOS job, so that job must pass.
      - name: Fail a Hermes macOS job that did not pass the tests the lane left to it
        if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.hermes_macos == 'true') && needs.hermes-compatibility-macos.result != 'success' }}
        shell: bash
        env:
          RESULTS: "hermes-macos=${{ needs.hermes-compatibility-macos.result }} macos-release-build=${{ needs.macos-release-build.result }} hermes_macos=${{ needs.changes.outputs.hermes_macos }}"
        run: |
          echo "::error::the Hermes macOS job did not pass the hermes_package tests the macOS lane left to it: $RESULTS"
          exit 1

  # Skipped on the docs-only path of a pull request (#1218): a narrowed
  # selection whose every changed file has no Rust tests and no gate but
  # `docs check`. Any other outcome of the selection runs it.
  doctests:
    name: doctests
    needs: test-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.test-selection.result != 'success' || needs.test-selection.outputs.narrowed != 'true' || needs.test-selection.outputs.mode != 'none' || needs.test-selection.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: ./.github/actions/setup-rust

      # Doctests link the debug library builds that the `test-debug` saver
      # (`build-tests`) persists; this job only restores them.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug
          save-if: false

      # Nextest does not execute rustdoc tests; preserve the cargo test gate.
      - name: Documentation tests
        run: cargo test --doc --workspace --all-features

  # Full release build: schedule, push to main, manual dispatch, or a pull
  # request that changes a `release` filter input.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release build
        run: cargo build --workspace --release

  # Release rehearsal (issue #150): the PR-time proof of the release assembly.
  # It runs the same reusable workflows as a tag with mode `rehearsal`: the
  # Linux archives, packages and SDK tarballs are built from this commit, every
  # (runtime x target) row runs against the pinned upstream, a bundle is
  # assembled and signed with a throwaway key derived from public values (no
  # secret, no environment, no provenance, nothing published) and the
  # network-isolated archive smoke runs on it. It runs on schedule, `nightly`
  # manual dispatch, or a pull request that changes a `release_rehearsal` filter
  # input. It never runs on push to main or a `main` dispatch: the release gate
  # takes it from the nightly evidence of the release commit. It never runs for
  # a fork or Dependabot pull request, whose token cannot hold the scopes the
  # called workflow declares. The caller grants `id-token`/`attestations` only
  # because a called workflow cannot hold a scope its caller lacks; the attest
  # jobs are skipped in this mode.
  release-rehearsal-build:
    name: release rehearsal (build)
    needs: changes
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly') || (github.event_name == 'pull_request' && needs.changes.outputs.release_rehearsal == 'true')) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      mode: rehearsal

  release-rehearsal:
    name: release rehearsal (evidence, assembly, archive smoke)
    needs: [changes, release-rehearsal-build]
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly') || (github.event_name == 'pull_request' && needs.changes.outputs.release_rehearsal == 'true')) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    uses: ./.github/workflows/release-evidence.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release-rehearsal-build.outputs.version }}
      commit: ${{ github.sha }}
      mode: rehearsal
      targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin

  # TS-binding drift is gated by paths filter (issue #125); it only runs on
  # schedule, push to main, manual dispatch (always a full run), or when the
  # protocol/generation inputs change.
  # It is kept as its own job so `docs check` always runs every PR.
  ts-drift:
    name: TS binding drift (xs check)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs_ts == 'true' }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Designated `xtask` saver: the xtask binary plus the ts-rs export
          # test builds, a superset of what package-selection restores.
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: TS binding drift
        run: cargo xtask ts check
        env:
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold

  # Official Hermes runtime package against the pinned, locked Hermes
  # release. `compat stage-upstream` stages the runtime with the provisioner
  # that `compat/hermes/compatibility-lock.json` selects, the package is built
  # from runtime-packages/hermes with `cargo xtask package build`, and the job
  # runs the model-free compatibility gate and a real pinned Hermes session
  # through the installed package against a loopback provider. It builds the
  # binaries it tests, so like the other package jobs it depends only on the
  # package selection.
  hermes-package:
    name: pinned Hermes compatibility (model-free)
    runs-on: ubuntu-latest
    needs: package-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.package-selection.result != 'success' || needs.package-selection.outputs.hermes != 'false') }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    # The job builds the daemon, the session worker, the CLI and its
    # integration tests; the Pi and Codex package jobs need about the same
    # build, so this keeps their 30 minutes plus room for the Hermes
    # provisioning and compatibility gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Bootstrap python3 for the provisioner's helper programs and the shell
      # tests. The Hermes venv itself runs the standalone CPython that the
      # provisioner pins and verifies, never this interpreter.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      # Cache the staged pinned Hermes runtime. Inputs that drive staging:
      # the lock file, the provisioner script (which also pins the standalone
      # CPython the venv is built from, inside the install root), its test,
      # the stage layout and manifests of `cargo xtask compat stage-upstream`
      # (crates/xtask/src/upstream_stage.rs), and the workflow itself; uv
      # itself is already cached via `enable-cache` above, so this is just
      # the resolved runtime. Key on all of them so any change restages.
      - name: Cache Hermes runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('crates/xtask/src/upstream_stage.rs') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      # The compatibility gate itself is driven by `cargo xtask`, which is built
      # from source in this job, so a toolchain is still required here.
      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hermes-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Check fail-closed Hermes provisioning
        run: scripts/tests/provision-hermes-compat.sh

      # `compat stage-upstream` runs the provisioner in place at
      # `<stage_root>/hermes` and records every byte in STAGE.sha256 and
      # STAGE.links. The stage is only ever used at that path, because its
      # console scripts name the venv interpreter by absolute path, so a cache
      # hit restores it there. `compat verify-stage` then detects drift and
      # consumer writes against the manifests and the committed lock and
      # provisioner; the manifests travel inside the cached tree, so trust in
      # a restored cache rests on the cache key and the cache's branch
      # scoping, not on the manifests. The cache is a copy taken before any
      # consumer ran: Hermes, its sessions and the CLI's isolated-mode Python
      # probes write into the stage they use, so each later consumer step
      # gets a fresh restore of that copy
      # (docs/knowledge/concepts/upstream-staging.md).
      - name: Provision locked Hermes runtime
        id: hermes
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/hermes-compat-cache"
          stage_root="$RUNNER_TEMP/hermes-compat"
          stage="$stage_root/hermes"
          rm -rf "$stage_root"
          mkdir -p "$stage_root"
          if [[ -d "$cache_dir" ]]; then
            cp -a "$cache_dir" "$stage"
            cargo xtask compat verify-stage --runtime hermes --dir "$stage_root"
          else
            cargo xtask compat stage-upstream --runtime hermes --out "$stage_root"
            # Copy errors fail the step (no `|| true`): a partial cache_dir
            # under an immutable key would poison every later run until the
            # key changes, and the restored copy is verified on the next hit.
            rm -rf "$cache_dir"
            cp -a "$stage" "$cache_dir"
          fi
          hermes_bin="$stage/venv/bin/hermes"
          printf 'cache=%s\nstage_root=%s\n' "$cache_dir" "$stage_root" >> "$GITHUB_OUTPUT"
          [[ -f "$hermes_bin" && -x "$hermes_bin" ]] \
            || { echo "provisioned Hermes executable missing at $hermes_bin" >&2; exit 1; }
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"
          # The pinned venv interpreter carries PyYAML; the package tests'
          # plugin harness needs it, and runner Pythons lack it or are
          # group-writable framework builds the harness refuses.
          printf 'python=%s\n' "${hermes_bin%/*}/python" >> "$GITHUB_OUTPUT"

      # The binaries under test, built as the `build-bins` job builds them.
      - name: Build daemon, session worker, and CLI
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      # Later cargo steps rebuild binaries in target/debug (the session worker,
      # and `pohunek` with test-only features for the integration tests), so
      # the release consumer gets this copy of the default-feature binaries
      # built above.
      - name: Keep the built binaries for the release consumer
        shell: bash
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/pohunek-bins"
          mkdir -p "$bins"
          cp target/debug/pohunek target/debug/pohunekd target/debug/pohunek-sessiond "$bins/"
          chmod 0755 "$bins/pohunek" "$bins/pohunekd" "$bins/pohunek-sessiond"

      # The gate installs the operator plugin from this archive through the
      # daemon built above.
      - name: Build the package deterministically
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask package verify runtime-packages/hermes
          cargo xtask package build runtime-packages/hermes --output "$RUNNER_TEMP/hermes.tar.zst" \
            --evidence-dir "$RUNNER_TEMP/package-evidence-hermes"
          echo "archive=$RUNNER_TEMP/hermes.tar.zst" >> "$GITHUB_OUTPUT"

      # Uploaded right after the build, so the evidence of the archive under
      # test survives a failing gate or test run.
      - name: Upload the package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-hermes
          path: ${{ runner.temp }}/package-evidence-hermes
          if-no-files-found: error

      # A verified baseline means the selector rebuilt this package from this
      # commit and got the digest of the released archive, so the archive
      # under test must be the released one. A different digest means two
      # builds of identical inputs disagree: the package build is not
      # reproducible, and the job fails. The digest is read only from a
      # successful selection.
      - name: Match the release baseline
        shell: bash
        env:
          BASELINE_DIGEST: ${{ needs.package-selection.result == 'success' && needs.package-selection.outputs.hermes_baseline_digest || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_DIGEST" ]; then
            echo "No verified release baseline for hermes; the rebuilt archive has nothing to match."
            exit 0
          fi
          actual="sha256:$(sha256sum "$RUNNER_TEMP/hermes.tar.zst" | cut -d' ' -f1)"
          if [ "$actual" != "$BASELINE_DIGEST" ]; then
            echo "::error::the rebuilt hermes archive is $actual but the verified release baseline is $BASELINE_DIGEST: the package build is not reproducible"
            exit 1
          fi
          echo "The rebuilt hermes archive is the released baseline $actual."

      - name: Check pinned Hermes compatibility
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/debug/pohunek target/debug/pohunekd target/debug/pohunek-sessiond
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --bin-dir "$(realpath target/debug)" \
            --package "${{ steps.package.outputs.archive }}"

      # The test daemon spawns the session worker found beside the test
      # profile, so it is built from this checkout before the real session.
      - name: Build the session worker
        run: cargo build --locked -p pohunek-session-worker --bin pohunek-sessiond

      # The gate wrote into the stage it used; the session runs on a fresh
      # restore of the untouched copy at the same absolute path.
      - name: Restore the pristine Hermes stage
        shell: bash
        env:
          CACHE_DIR: ${{ steps.hermes.outputs.cache }}
          STAGE_ROOT: ${{ steps.hermes.outputs.stage_root }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT/hermes"
          cp -a "$CACHE_DIR" "$STAGE_ROOT/hermes"
          cargo xtask compat verify-stage --runtime hermes --dir "$STAGE_ROOT"

      # One real pinned Hermes turn through the selected package and the public
      # session commands against a loopback model. Only the test receives the
      # provisioned executable path; PATH stays the runner's. The `package`
      # nextest profile runs the binary serially with a per-test timeout and
      # writes a JUnit report. nextest writes it only when the run ends, so a
      # report the build cache restored under target/ is removed first and
      # never stands in for this run.
      - name: Drive a real pinned Hermes session through the package
        env:
          POHUNEK_HERMES_E2E: "1"
          POHUNEK_HERMES_BIN: ${{ steps.hermes.outputs.bin }}
          POHUNEK_PYTHON_BIN: ${{ steps.hermes.outputs.python }}
        run: |
          rm -f target/nextest/package/junit.xml
          cargo nextest run --locked --profile package -p pohunek-cli --test all -E 'test(/^hermes_package::/)' --run-ignored all --test-threads 1

      # The session test wrote into the stage it used; the release consumer
      # runs on another fresh restore of the untouched copy at the same
      # absolute path.
      - name: Restore the pristine Hermes stage for the release consumer
        shell: bash
        env:
          CACHE_DIR: ${{ steps.hermes.outputs.cache }}
          STAGE_ROOT: ${{ steps.hermes.outputs.stage_root }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT/hermes"
          cp -a "$CACHE_DIR" "$STAGE_ROOT/hermes"
          cargo xtask compat verify-stage --runtime hermes --dir "$STAGE_ROOT"

      # The release consumer suite in row mode on the package built above, as
      # scripts/release-workflow/run-row calls it: a throwaway catalog for the
      # archive, a scrubbed environment, the stage's bin directory first on
      # PATH, a short root outside any Git checkout (socket path length; the
      # CLI refuses a Hermes home inside a Git workspace), and the
      # default-feature binaries this job built, copied aside before any later
      # cargo step rebuilt them. It
      # installs the package, installs the operator plugin from it, and drives
      # one turn, stop and resume against the loopback model
      # (docs/development.md, "Release consumer suite"). The report must name
      # the archive's digest.
      - name: Run the release consumer suite for Hermes (row mode)
        shell: bash
        env:
          STAGE_ROOT: ${{ steps.hermes.outputs.stage_root }}
          PACKAGE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          scripts/release-workflow/build-consumer "$RUNNER_TEMP/consumer"
          work=$(mktemp -d /tmp/pkrow.XXXXXX)
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/bin" "$work/cwd" "$work/home" "$work/t"
          cp "$RUNNER_TEMP/pohunek-bins/pohunek" "$RUNNER_TEMP/pohunek-bins/pohunekd" \
            "$RUNNER_TEMP/pohunek-bins/pohunek-sessiond" "$work/bin/"
          (
            cd "$work/cwd"
            exec env -i \
              PATH="$STAGE_ROOT/hermes/bin:/usr/bin:/bin" \
              HOME="$work/home" \
              XDG_CONFIG_HOME="$work/home/.config" \
              XDG_DATA_HOME="$work/home/.local/share" \
              XDG_STATE_HOME="$work/home/.local/state" \
              XDG_CACHE_HOME="$work/home/.cache" \
              TMPDIR="$work/t" \
              LANG=C.UTF-8 \
              POHUNEK_CONSUMER_BIN_DIR="$work/bin" \
              POHUNEK_CONSUMER_RUNTIME=hermes \
              POHUNEK_CONSUMER_PACKAGE="$PACKAGE" \
              POHUNEK_CONSUMER_REPORT="$work/report.json" \
              "$RUNNER_TEMP/consumer/release_consumer" \
              --exact the_release_binaries_serve_the_runtime_out_of_process --nocapture
          )
          digest="sha256:$(sha256sum "$PACKAGE" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" \
            '.runtime == "hermes" and .package_digest == $digest' "$work/report.json"

      # Persist the staged runtime only after the compatibility gate passed:
      # `if: success()` plus this position (after the check) means a broken
      # or partial runtime is never uploaded under the immutable cache key.
      - name: Persist Hermes runtime cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-compat-cache
          key: >-
            hermes-runtime-${{ runner.os }}-
            ${{ hashFiles('compat/hermes/compatibility-lock.json') }}-
            ${{ hashFiles('scripts/provision-hermes-compat') }}-
            ${{ hashFiles('scripts/tests/provision-hermes-compat.sh') }}-
            ${{ hashFiles('crates/xtask/src/upstream_stage.rs') }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "hermes package" target/nextest/package/junit.xml

      - name: Upload the package test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-junit-hermes
          path: target/nextest/package/junit.xml
          if-no-files-found: warn

  # Runtime package selection for pull requests (issue #149). `cargo xtask
  # package affected` classifies every file the pull request changes against
  # its base commit: a file of `runtime-packages/<p>/` or `compat/<p>/` selects
  # package <p>, reviewed prose selects nothing, and every other file (any
  # crate, manifest, lockfile, Cargo or toolchain configuration, workflow,
  # script, packaging, or a file a crate embeds) is a core change that selects
  # every official package. `cargo xtask package baseline` then checks each
  # package against the signed release of the workspace version: a package
  # whose bytes, lock and fixtures the release `v<version>` built and attested
  # is `verified`, any other is `missing`. A package job is selected (`true`)
  # when the core changed, its package changed, or its baseline is not
  # verified, so a pull request skips a package only when it is unchanged, the
  # core is unchanged and the signed release proves the package. The package
  # jobs below skip only when this job succeeded and reported their package as
  # `false`; a failed or skipped selection runs every package job. Push,
  # schedule and dispatch runs skip this job and run every package job.
  package-selection:
    name: runtime package selection
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      core_changed: ${{ steps.select.outputs.core_changed }}
      pi: ${{ steps.select.outputs.pi }}
      codex: ${{ steps.select.outputs.codex }}
      claude: ${{ steps.select.outputs.claude }}
      hermes: ${{ steps.select.outputs.hermes }}
      pi_baseline_digest: ${{ steps.select.outputs.pi_baseline_digest }}
      codex_baseline_digest: ${{ steps.select.outputs.codex_baseline_digest }}
      claude_baseline_digest: ${{ steps.select.outputs.claude_baseline_digest }}
      hermes_baseline_digest: ${{ steps.select.outputs.hermes_baseline_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base of the pull request and its base commit needs history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: false

      # The base commit comes through the environment, never interpolated into
      # the script. Any failure fails the job, which runs every package job.
      - name: Classify the changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cargo xtask package affected --base "$BASE_SHA" --json > "$RUNNER_TEMP/package-affected.json"

      # The workspace version names the baseline release. Read here, without
      # the token: the version script is checkout code. A workspace version
      # that is not X.Y.Z fails the job, which runs every package job.
      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(scripts/release-workflow/version rehearsal "")" >> "$GITHUB_OUTPUT"

      # The baseline is the GitHub Release `v<workspace version>` of this
      # repository, never "latest", read with the run's read-only token. This
      # step runs only `gh` and system tools, never checkout code. The assets
      # land outside the checkout: an untracked file in the work tree would
      # count as a change. A download that fails or exceeds
      # PACKAGE_BASELINE_FETCH_TIMEOUT leaves the directory empty, so the
      # verifier reports every package missing and every package job runs; the
      # download never fails the job.
      - name: Fetch the release baseline
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/package-baseline"
          mkdir -p "$dir"
          if ! timeout "$PACKAGE_BASELINE_FETCH_TIMEOUT" gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern runtime-catalog.json --pattern 'attestation-*.json' --pattern 'pohunek-runtime-*.tar.zst'; then
            echo "::warning::release v$VERSION assets could not be downloaded within $PACKAGE_BASELINE_FETCH_TIMEOUT; every package job runs"
            rm -rf "$dir"
            mkdir -p "$dir"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Anything read from the release only ever makes a package missing. The
      # verifier exits non-zero only when the checkout itself is unreadable;
      # that fails the job, which runs every package job.
      - name: Verify the release baseline
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIR: ${{ steps.release.outputs.dir }}
        run: |
          set -euo pipefail
          cargo xtask package baseline --catalog "$RELEASE_DIR/runtime-catalog.json" \
            --anchor packaging/runtime-catalog-anchor.json --release-dir "$RELEASE_DIR" \
            --version "$VERSION" --json > "$RUNNER_TEMP/package-baseline.json"

      # A package runs when the core changed, the package changed, or its
      # baseline is not verified; a package absent from the verdicts is not
      # verified. `<p>_baseline_digest` carries a verified baseline digest for
      # the package job to compare its rebuilt archive with, empty otherwise.
      # Verdicts of another release or of an unknown shape fail the job.
      - name: Select the runtime packages
        id: select
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          selection="$(cat "$RUNNER_TEMP/package-affected.json")"
          baseline="$(cat "$RUNNER_TEMP/package-baseline.json")"
          jq -e '(.core_changed | type == "boolean") and (.packages | type == "array") and all(.packages[]; type == "string")' <<<"$selection" >/dev/null
          jq -e --arg version "$VERSION" '(.version == $version) and (.packages | type == "object") and all(.packages[]; .verdict == "verified" or .verdict == "missing")' <<<"$baseline" >/dev/null
          core_changed="$(jq -r '.core_changed' <<<"$selection")"
          {
            echo "packages=$(jq -c '.packages' <<<"$selection")"
            echo "core_changed=$core_changed"
            for package in pi codex claude hermes; do
              changed="$(jq -r --arg package "$package" '.packages | index($package) != null' <<<"$selection")"
              digest="$(jq -r --arg package "$package" '.packages[$package] // {} | if .verdict == "verified" and ((.digest // "") | test("^sha256:[0-9a-f]{64}$")) then .digest else "" end' <<<"$baseline")"
              if [ "$core_changed" = true ] || [ "$changed" = true ] || [ -z "$digest" ]; then
                echo "$package=true"
              else
                echo "$package=false"
              fi
              echo "${package}_baseline_digest=$digest"
            done
          } >> "$GITHUB_OUTPUT"

  # Version gate of the official packages (issue #894). `cargo xtask package
  # bump` fails a pull request that changes a package's archive without a
  # version above the released versions of that runtime. It compares against
  # the last published release at or below the workspace version, not the
  # workspace version itself, so the gate keeps working while a release is
  # being prepared. A violation or an unverifiable catalog fails the job. A
  # release that cannot be listed or downloaded only leaves the gate undecided,
  # with a warning: an outage must not block every pull request, and a catalog
  # that is present is never accepted without its verification. No package job
  # needs this job.
  package-version-bump:
    name: package version bump
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit of the baseline has to be in the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: false

      # The version script is checkout code, so this step runs without the token.
      # A standalone assignment fails the step when the script fails; inside
      # `echo` the failure would leave an empty version and skip the gate.
      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(scripts/release-workflow/version rehearsal "")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The last published release at or below the workspace version: the
      # highest `vX.Y.Z` tag among the listed non-draft, non-pre-release
      # releases whose version does not exceed the workspace version. Empty
      # when there is none or the listing fails. This step runs only `gh` and
      # system tools, never checkout code, with the run's read-only token.
      - name: Select the last released version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit "$PACKAGE_BUMP_RELEASE_LIMIT" --json tagName --jq '.[].tagName')"; then
            echo "::warning::the releases of $GITHUB_REPOSITORY could not be listed; the version bump gate is undecided"
            tags=""
          fi
          released=""
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || continue
            candidate="${BASH_REMATCH[1]}"
            # `sort -V` keeps the candidate at or below the workspace version
            # only when it sorts last of the two (equal versions included).
            [ "$(printf '%s\n%s\n' "$candidate" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] || continue
            if [ -z "$released" ] || [ "$(printf '%s\n%s\n' "$released" "$candidate" | sort -V | tail -n 1)" = "$candidate" ]; then
              released="$candidate"
            fi
          done <<< "$tags"
          echo "version=$released" >> "$GITHUB_OUTPUT"

      # The catalog of the released version, the only release file the gate
      # reads: a changed package is judged by the catalog's entries, and an
      # unchanged one passes whatever its archive says. A download that fails
      # or exceeds PACKAGE_BASELINE_FETCH_TIMEOUT leaves the directory empty,
      # which the gate reports as undecided; the download never fails the job.
      - name: Fetch the released baseline
        id: fetch
        if: ${{ steps.release.outputs.version != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/package-bump-baseline"
          mkdir -p "$dir"
          if ! timeout "$PACKAGE_BASELINE_FETCH_TIMEOUT" gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern runtime-catalog.json; then
            echo "::warning::release v$VERSION catalog could not be downloaded within $PACKAGE_BASELINE_FETCH_TIMEOUT; the version bump gate is undecided"
            rm -rf "$dir"
            mkdir -p "$dir"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Checkout code runs here, without the token. The command exits non-zero
      # for a failing package, for a catalog that does not verify and for an
      # unreadable checkout; an absent catalog exits 0 with the `undecided`
      # verdict, which is reported as a warning.
      - name: Check the version bump
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DIR: ${{ steps.fetch.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::warning::no published release at or below the workspace version; the version bump gate is undecided"
            exit 0
          fi
          cargo xtask package bump --catalog "$RELEASE_DIR/runtime-catalog.json" \
            --anchor packaging/runtime-catalog-anchor.json --release-dir "$RELEASE_DIR" \
            --version "$VERSION" --json > "$RUNNER_TEMP/package-bump.json"
          if [ "$(jq -r '.verdict' "$RUNNER_TEMP/package-bump.json")" = undecided ]; then
            echo "::warning::the catalog of release v$VERSION is absent; the version bump gate is undecided"
          fi

  # Official Pi runtime package against the real, locked Pi release. The job
  # installs the npm tree pinned by `compat/pi/npm/package-lock.json`,
  # builds the package with `cargo xtask package build`, installs it into a real
  # daemon with explicit-digest trust and drives a real `pi` through launch,
  # detection, resume and fork. The model is a loopback stub: no provider, no
  # credential and no model call. The always-running unit tests in the same
  # test binary keep the descriptor, the supported range and the lock in sync;
  # this job proves the locked release still behaves as they say.
  pi-package:
    name: Pi runtime package (locked release, model-free)
    runs-on: ubuntu-latest
    needs: package-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.package-selection.result != 'success' || needs.package-selection.outputs.pi != 'false') }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_PI_E2E: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the Pi lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          lock=compat/pi/compatibility-lock.json
          {
            echo "release=$(jq -er '.upstream.release' "$lock")"
            echo "node=$(jq -er '.upstream.node_min' "$lock")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.lock.outputs.node }}

      - name: Install the locked Pi release
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/compat/pi/npm"
          if ! npm ci --prefix "$project" --ignore-scripts --no-audit --no-fund; then
            echo "Failed to install the pinned Pi npm tree from $project/package-lock.json" >&2
            exit 1
          fi
          bin="$project/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          installed="$(env -i PATH="$bin:$PATH" HOME="$RUNNER_TEMP" pi --version)"
          test "$installed" = "${{ steps.lock.outputs.release }}" \
            || { echo "installed Pi $installed is not the locked ${{ steps.lock.outputs.release }}" >&2; exit 1; }

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pi-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Build the package deterministically
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask package verify runtime-packages/pi
          cargo xtask package build runtime-packages/pi --output "$RUNNER_TEMP/pi.tar.zst" \
            --evidence-dir "$RUNNER_TEMP/package-evidence-pi"
          echo "POHUNEK_PI_PACKAGE_ARCHIVE=$RUNNER_TEMP/pi.tar.zst" >> "$GITHUB_ENV"

      # Uploaded right after the build, so the evidence of the archive under
      # test survives a failing test run.
      - name: Upload the package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-pi
          path: ${{ runner.temp }}/package-evidence-pi
          if-no-files-found: error

      # A verified baseline means the selector rebuilt this package from this
      # commit and got the digest of the released archive, so the archive
      # under test must be the released one. A different digest means two
      # builds of identical inputs disagree: the package build is not
      # reproducible, and the job fails. The digest is read only from a
      # successful selection.
      - name: Match the release baseline
        shell: bash
        env:
          BASELINE_DIGEST: ${{ needs.package-selection.result == 'success' && needs.package-selection.outputs.pi_baseline_digest || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_DIGEST" ]; then
            echo "No verified release baseline for pi; the rebuilt archive has nothing to match."
            exit 0
          fi
          actual="sha256:$(sha256sum "$RUNNER_TEMP/pi.tar.zst" | cut -d' ' -f1)"
          if [ "$actual" != "$BASELINE_DIGEST" ]; then
            echo "::error::the rebuilt pi archive is $actual but the verified release baseline is $BASELINE_DIGEST: the package build is not reproducible"
            exit 1
          fi
          echo "The rebuilt pi archive is the released baseline $actual."

      - name: Build the session worker
        run: cargo build --locked -p pohunek-session-worker --bin pohunek-sessiond

      # The `package` nextest profile runs the binary serially with a per-test
      # timeout and writes a JUnit report. nextest writes it only when the run
      # ends, so a report the build cache restored under target/ is removed
      # first and never stands in for this run.
      - name: Drive the real Pi through the installed package
        run: |
          rm -f target/nextest/package/junit.xml
          cargo nextest run --locked --profile package -p pohunek-cli --test all -E 'test(/^pi_package::/)' --run-ignored all --test-threads 1

      - name: Summarize flaky tests
        if: always()
        run: python3 scripts/junit-flaky-summary --label "pi package" target/nextest/package/junit.xml

      - name: Upload the package test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-junit-pi
          path: target/nextest/package/junit.xml
          if-no-files-found: warn

  # Official Codex runtime package against the real, locked Codex release. The
  # job installs the npm tree pinned by `compat/codex/npm/package-lock.json`,
  # builds the package with `cargo xtask package build`, and runs the
  # always-on parity tests plus the real-Codex tests: a real `codex` with a
  # fresh CODEX_HOME, a loopback Responses stub, hook trust written by pohunek's
  # own integration install, and every live screen and title read through the
  # package manifest. The tests install the built archive through a signed
  # catalog with a throwaway key and trust anchor generated in the test process,
  # so the launches go through the installed package and its version probe. The
  # job has not run on a hosted runner yet: the bubblewrap sandbox and the Node
  # of the runner image are the assumptions to check on its first run.
  codex-package:
    name: Codex runtime package (locked release, model-free)
    runs-on: ubuntu-latest
    needs: package-selection
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.package-selection.result != 'success' || needs.package-selection.outputs.codex != 'false') }}
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      POHUNEK_CODEX_E2E: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
