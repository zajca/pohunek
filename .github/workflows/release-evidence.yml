name: Release evidence

# Reusable evidence half of the release. Given the producer artifacts of the
# calling run (release-build.yml and, in a release, the macOS and SDK jobs of
# release.yml), it proves that every official runtime package works with the
# exact core binaries of the release, signs the runtime catalog over those
# digests and checks the final archives offline:
#
#   plan              the (runtime x target) rows from compat/matrix.json,
#                     grouped by runner (jq)
#   rows              one job per runner: builds the release consumer test
#                     executable once and uploads it for the smoke, then runs
#                     the runner's rows in sequence. Each row extracts the
#                     binaries from the daemon ARCHIVE, stages the pinned
#                     upstream (npm, or a provisioner script with Python and
#                     uv), runs the consumer out of process and emits
#                     attestation-<runtime>-<target>.json
#   attest            build provenance for every producer artifact (release only)
#   assemble          verifies provenance with `gh attestation verify`, then
#                     `cargo xtask release assemble` signs the catalog with the
#                     CI root key (release only; the environment `release`)
#   assemble-rehearsal the same assembly with a throwaway key derived from public
#                     values and a throwaway anchor, no secret (rehearsal only)
#   attest-bundle     build provenance for every file of the final bundle
#                     (release only)
#   smoke-scenarios   the synthetic-archive scenario suite on macos-15, as a
#                     call of release-smoke-scenarios.yml (release only; a
#                     rehearsal runs it from ci.yml, which must pass the job's
#                     result as `scenarios_result` for the verdict)
#   smoke             stages the upstreams, then runs packaging/smoke-archive
#                     on every Linux daemon archive in a network namespace and
#                     the Apple Silicon daemon archive on macos-15 under
#                     sandbox-exec after verify-signed --adhoc
#   verdict           fails unless exactly the jobs of the chosen mode succeeded
#                     (a skipped job would otherwise let a caller proceed),
#                     plus the caller's `scenarios_result` in a rehearsal
#
# Trust model. `rows`, `assemble*` and `smoke` run repository code
# and hold a read-only token; none of them can create an attestation or write
# to the repository. `attest` and `attest-bundle` are the only jobs with
# `id-token: write` and `attestations: write`; they check out nothing, run no
# repository or downloaded code, and are skipped in a rehearsal, so a CI run
# never mints provenance that `gh attestation verify` would accept for a
# throwaway-key bundle. Only `assemble` has the environment `release` (deployment
# policy: tags `v*`) and reads CATALOG_SIGNING_KEY_CI, in its signing step.
# This workflow never creates or edits a GitHub Release.
#
# The calling job must grant `id-token: write` and `attestations: write` even
# for a rehearsal: a called workflow cannot hold a scope its caller lacks.
# Linux jobs stay on ubuntu-24.04 (#1731), never ubuntu-latest: they build, assemble or run the shipped binaries, and the
# acceptance guests carry glibc 2.41, which `glibc-check` enforces; ubuntu-26.04 has glibc 2.43.
on:
  workflow_call:
    inputs:
      version:
        description: Release version X.Y.Z (the workspace version)
        type: string
        required: true
      commit:
        description: Full commit sha the artifacts were built from
        type: string
        required: true
      mode:
        description: "`release` signs with the CI root key; `rehearsal` uses a throwaway key and publishes nothing"
        type: string
        required: true
      targets:
        description: Optional space-separated targets to keep (rehearsal); empty means all
        type: string
        required: false
        default: ""
      scenarios_result:
        description: Result of the caller's archive-scenario job; a rehearsal requires "success" (issue #1259)
        type: string
        required: false
        default: ""
    secrets:
      CATALOG_SIGNING_KEY_CI:
        description: CI root seed, used only by the release assembly job
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Plan the compatibility rows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
      node: ${{ steps.rows.outputs.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the inputs and derive the row matrix
        id: rows
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          TARGETS: ${{ inputs.targets }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(scripts/release-workflow/version "$MODE" "$REF_NAME")" = "$VERSION"
          if [ "$MODE" = release ] && [ -n "$TARGETS" ]; then
            echo "::error::a release is never restricted to some targets"
            exit 1
          fi
          # shellcheck disable=SC2086
          rows="$(scripts/release-workflow/row-matrix compat/matrix.json $TARGETS)"
          node="$(scripts/release-workflow/node-version compat/matrix.json)"
          {
            echo "rows=$rows"
            echo "node=$node"
          } >> "$GITHUB_OUTPUT"

  # One job per runner runs the runner's rows in sequence (run-rows). The
  # setup is paid once: the toolchain, the consumer and xtask builds, Node,
  # Python and uv, and the downloads. Rows share the job's account, so each
  # row gets a fresh, empty, owner-only root for HOME, the XDG directories,
  # TMPDIR, cwd and its staged upstream (npm and uv caches included), and
  # run-rows checks after each row that it left no process, no root, no user
  # service or launchd job and no keychain item behind, and that nothing a
  # later row trusts changed (xtask, the consumer, the scripts, the archives,
  # earlier attestations, the Node, uv and Python installs, the checkout). The
  # daemon under test supervises its workers as direct children, so no row
  # uses the systemd user manager or the launchd user domain; the model stubs
  # bind ephemeral loopback ports. Rows run one at a time. A failing row stops
  # the rows after it only when it changed the account or what they trust, or
  # the guards could not check it. See the docstring of run-rows.
  rows:
    name: Rows on ${{ matrix.runner }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rows) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-rows-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the consumer executable
        run: scripts/release-workflow/build-consumer "$RUNNER_TEMP/consumer"

      - name: Build xtask
        run: cargo build --locked -p xtask

      # The consumer leaves the job before any upstream code runs in it.
      # Every upload of this job overwrites its artifact, so that a rerun of
      # the failed job replaces what the failed attempt uploaded.
      - name: Upload the consumer executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-consumer-${{ runner.os }}
          path: ${{ runner.temp }}/consumer/release_consumer
          if-no-files-found: error
          overwrite: true

      - name: Download the daemon archives of the runner
        if: ${{ matrix.rows != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ matrix.daemon_pattern }}
          merge-multiple: true
          path: ${{ runner.temp }}/daemon

      - name: Download the package archives
        if: ${{ matrix.rows != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-archives
          path: ${{ runner.temp }}/packages

      # The upstream runtimes are Node programs: the version is the highest
      # `upstream.node_min` of their locks, not the runner image default.
      - name: Install Node
        if: ${{ matrix.rows != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.plan.outputs.node }}

      # A lock whose `upstream.kind` is `provisioner` stages its upstream with
      # a repository script that builds a Python environment with uv: the
      # script needs python3 for its helper programs and uv, and the
      # environment runs the pinned CPython the script downloads and verifies,
      # never this interpreter. run-rows runs on this interpreter too. No uv
      # cache is kept between runs.
      - name: Install Python for provisioned upstreams
        if: ${{ matrix.rows != '' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv for provisioned upstreams
        if: ${{ matrix.rows != '' }}
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false

      - name: Run the rows and write their attestations
        if: ${{ matrix.rows != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          ROWS: ${{ matrix.rows }}
          ROW_LIMIT_SECONDS: ${{ matrix.row_limit_seconds }}
          DAEMON_DIR: ${{ runner.temp }}/daemon
          PACKAGES_DIR: ${{ runner.temp }}/packages
          CONSUMER: ${{ runner.temp }}/consumer/release_consumer
          OUT_DIR: ${{ runner.temp }}/rows
        run: |
          set -euo pipefail
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/run-rows

      - name: Upload the attestations
        if: ${{ matrix.rows != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attestation-${{ matrix.os }}
          path: ${{ runner.temp }}/rows/attestation-*.json
          if-no-files-found: error
          overwrite: true

      # Wall clock and outcome of each consumer run as a one-testcase JUnit
      # report per row. run-row writes it also when the consumer fails, so it
      # is uploaded whatever the rows' result; a row that stopped before the
      # consumer started has none.
      - name: Upload the row test reports
        if: ${{ always() && matrix.rows != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matrix-junit-${{ matrix.os }}
          path: ${{ runner.temp }}/rows/junit-*.xml
          if-no-files-found: warn
          overwrite: true

      # One result line per row, read by the verdict to name a failing row.
      - name: Upload the row results
        if: ${{ always() && matrix.rows != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: row-results-${{ matrix.os }}
          path: ${{ runner.temp }}/rows/row-results.jsonl
          if-no-files-found: warn
          overwrite: true

  # Build provenance for every producer artifact, so that the assembler can
  # require it. No checkout and no repository code: only artifacts are
  # downloaded, checked against their checksum files and attested.
  attest:
    name: Attest the producer artifacts
    if: ${{ inputs.mode == 'release' }}
    needs: [rows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          merge-multiple: true
          path: ${{ runner.temp }}/attest-assets

      - name: Download the macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-signed-*
          merge-multiple: true
          path: ${{ runner.temp }}/attest-assets

      - name: Download the package archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-archives
          path: ${{ runner.temp }}/attest-assets

      - name: Download the SDK tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-release-assets
          path: ${{ runner.temp }}/attest-assets

      - name: Download the row attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: attestation-*
          merge-multiple: true
          path: ${{ runner.temp }}/attest-assets

      # Every archive and tarball has exactly one checksum file, and each one
      # matches.
      - name: Check the asset checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/attest-assets"
          sha256sum -c ./*.sha256
          archives="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar.zst' \) | wc -l)"
          checksums="$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)"
          test "$archives" = "$checksums"

      - name: Attest the producer artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/attest-assets/*.tar.gz
            ${{ runner.temp }}/attest-assets/*.tgz
            ${{ runner.temp }}/attest-assets/*.tar.zst
            ${{ runner.temp }}/attest-assets/*.sha256
            ${{ runner.temp }}/attest-assets/*.json

  # Release assembly: the only job that reads the signing secret, and only in
  # its signing step. The key is written to tmpfs and shredded by
  # scripts/release-workflow/assemble, which runs the xtask built from this
  # very commit. No cache is restored in this job.
  assemble:
    name: Assemble and sign the release bundle
    if: ${{ inputs.mode == 'release' }}
    needs: [rows, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: ${{ runner.temp }}/dl/build

      - name: Download the macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-signed-*
          path: ${{ runner.temp }}/dl/macos

      - name: Download the package archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-archives
          path: ${{ runner.temp }}/dl/packages

      - name: Download the SDK tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-release-assets
          path: ${{ runner.temp }}/dl/sdk

      - name: Download the row attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: attestation-*
          path: ${{ runner.temp }}/dl/attestations

      # Every input must carry provenance from this repository's evidence
      # workflow at this commit and ref.
      - name: Verify the provenance of every input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          REF: ${{ github.ref }}
        run: scripts/release-workflow/verify-provenance "$RUNNER_TEMP/dl"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Build xtask
        run: cargo build --locked -p xtask

      - name: Collect the inputs
        run: |
          scripts/release-workflow/collect-inputs "$RUNNER_TEMP/inputs" \
            "$RUNNER_TEMP/dl/build" "$RUNNER_TEMP/dl/macos" "$RUNNER_TEMP/dl/packages" \
            "$RUNNER_TEMP/dl/sdk" "$RUNNER_TEMP/dl/attestations"

      - name: Sign and assemble the bundle
        shell: bash
        env:
          CATALOG_SIGNING_KEY_CI: ${{ secrets.CATALOG_SIGNING_KEY_CI }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/assemble \
            release "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/bundle"

      - name: Upload the release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  # The rehearsal assembly: the same inputs and the same assembler, signed with
  # a throwaway key derived from public values against the throwaway anchor the
  # rehearsal archives carry. No secret, no environment, no provenance
  # (nothing is attested in a rehearsal), and the bundle is never published.
  assemble-rehearsal:
    name: Assemble the rehearsal bundle
    if: ${{ inputs.mode == 'rehearsal' }}
    needs: [rows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: ${{ runner.temp }}/dl/build

      - name: Download the macOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-signed-*
          merge-multiple: true
          path: ${{ runner.temp }}/dl/macos

      - name: Download the package archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-archives
          path: ${{ runner.temp }}/dl/packages

      - name: Download the SDK tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-release-assets
          path: ${{ runner.temp }}/dl/sdk

      - name: Download the row attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: attestation-*
          path: ${{ runner.temp }}/dl/attestations

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-rows-${{ runner.os }}
          save-if: false

      - name: Build xtask
        run: cargo build --locked -p xtask

      - name: Collect the inputs
        run: |
          scripts/release-workflow/collect-inputs "$RUNNER_TEMP/inputs" \
            "$RUNNER_TEMP/dl/build" "$RUNNER_TEMP/dl/macos" "$RUNNER_TEMP/dl/packages" \
            "$RUNNER_TEMP/dl/sdk" "$RUNNER_TEMP/dl/attestations"

      - name: Assemble the rehearsal bundle
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          TARGETS: ${{ inputs.targets }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/assemble \
            rehearsal "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/bundle"

      - name: Upload the rehearsal bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  # Build provenance for every file of the final bundle (the rebuilt daemon
  # archives, the signed catalog and the inventory included), so that every
  # published asset has provenance. Like `attest`, it runs no code.
  attest-bundle:
    name: Attest the release bundle
    if: ${{ inputs.mode == 'release' }}
    needs: [assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      - name: Check the bundle inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c release-inventory.sha256

      - name: Attest the release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/bundle/*

  # The synthetic-archive smoke scenarios as their own job (issue #1259, D1).
  # A release runs them here, from the shared reusable workflow. A rehearsal
  # runs them from ci.yml instead — before the producer build and the bundle —
  # and passes the result as `scenarios_result`, which the verdict requires to
  # be `success`; so this job stays skipped in a rehearsal without weakening
  # the evidence.
  smoke-scenarios:
    name: Archive smoke scenarios (network-isolated, macos-15)
    if: ${{ inputs.mode == 'release' }}
    uses: ./.github/workflows/release-smoke-scenarios.yml
    permissions:
      contents: read

  # The network-isolated archive smoke on the final bundle: every Linux daemon
  # archive installs every official package offline and runs the consumer
  # against the staged, hash-verified upstream. The Apple Silicon daemon
  # archive also runs on macos-15 under sandbox-exec after verify-signed
  # --adhoc. The first step proves which isolation strategy the runner allows;
  # the smoke uses exactly that one and never runs un-isolated. The
  # synthetic-archive scenarios of the macOS leg run in `smoke-scenarios`
  # above (in a rehearsal, in ci.yml).
  smoke:
    name: Archive smoke (network-isolated, ${{ matrix.os }})
    needs: [plan, rows, assemble, assemble-rehearsal]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.assemble.result == 'success' || needs.assemble-rehearsal.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            smoke_target: ""
          - os: macos-15
            smoke_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-rows-${{ runner.os }}
          save-if: false

      - name: Download the release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      - name: Download the consumer executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-consumer-${{ runner.os }}
          path: ${{ runner.temp }}/consumer

      # The upstream runtimes are Node programs: the version is the highest
      # `upstream.node_min` of their locks, not the runner image default.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.plan.outputs.node }}

      # A lock whose `upstream.kind` is `provisioner` stages its upstream with
      # a repository script that builds a Python environment with uv: the
      # script needs python3 for its helper programs and uv, and the
      # environment runs the pinned CPython the script downloads and verifies,
      # never this interpreter. No uv cache is kept between runs.
      - name: Install Python for provisioned upstreams
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv for provisioned upstreams
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false

      - name: Build xtask
        run: cargo build --locked -p xtask

      # A throwaway step: it only proves that the runner can isolate the
      # network, and says how.
      - name: Probe the network isolation strategy
        id: isolation
        shell: bash
        run: |
          set -euo pipefail
          echo "strategy=$(scripts/release-workflow/probe-isolation)" >> "$GITHUB_OUTPUT"

      - name: Run the archive smoke on the daemon archives of this OS
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ISOLATION: ${{ steps.isolation.outputs.strategy }}
          CONSUMER: ${{ runner.temp }}/consumer/release_consumer
          SMOKE_TARGET: ${{ matrix.smoke_target }}
        run: |
          set -euo pipefail
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/run-smoke "$RUNNER_TEMP/bundle"

  # The caller proceeds on this workflow's result. A job skipped by an `if`
  # counts as success to the caller, so this job requires exactly the jobs of
  # the chosen mode to have succeeded and the other mode's jobs to be skipped.
  # It also names every planned row that did not pass, from the results the
  # row jobs upload; a planned row without a result (its job failed before
  # run-rows, timed out or lost its runner) is named as such.
  verdict:
    name: Evidence verdict
    if: ${{ always() }}
    needs: [plan, rows, attest, assemble, assemble-rehearsal, attest-bundle, smoke, smoke-scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Download the row results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: row-results-*
          path: ${{ runner.temp }}/row-results

      - name: Name every row that did not pass
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PLAN: ${{ needs.plan.outputs.rows }}
        run: |
          set -euo pipefail
          plan="${PLAN:-}"
          [ -n "$plan" ] || plan='{"include":[]}'
          mkdir -p "$RUNNER_TEMP/row-results"
          find "$RUNNER_TEMP/row-results" -type f -name row-results.jsonl -exec cat {} + > "$RUNNER_TEMP/row-results.jsonl"
          failed="$(jq -rn --argjson plan "$plan" --slurpfile results "$RUNNER_TEMP/row-results.jsonl" '
            $plan.include[]
            | .runner as $runner
            | .rows | split(" ")[] | select(length > 0)
            | split(":") as [$runtime, $target]
            | ([$results[] | select(.runtime == $runtime and .target == $target)] | first) as $result
            | if $result == null then "\($runtime) on \($target): no result from Rows on \($runner)"
              elif $result.status == "pass" then empty
              else "\($runtime) on \($target): \($result.status), \($result.message)" end
          ')"
          if [ -n "$failed" ]; then
            while IFS= read -r line; do
              echo "::error::row $line"
            done <<< "$failed"
            exit 1
          fi

      # The caller proceeds on this workflow's result, and a job skipped by an
      # `if` counts as success to the caller, so this step requires exactly the
      # jobs of the chosen mode to have succeeded and the other mode's jobs to
      # be skipped. In a rehearsal the archive scenarios (#1259) ran in the
      # caller, not here: its `scenarios_result` input must then be `success`,
      # so a failure, cancellation, skip or a caller that never ran them fails
      # the verdict.
      - name: Require the jobs of the mode
        if: ${{ !cancelled() }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SCENARIOS: ${{ inputs.scenarios_result }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -e --arg mode "$MODE" --arg scenarios "$SCENARIOS" '
            . as $needs
            | (if $mode == "release" then
                 {success: ["plan","rows","attest","assemble","attest-bundle","smoke","smoke-scenarios"], skipped: ["assemble-rehearsal"]}
               elif $mode == "rehearsal" then
                 {success: ["plan","rows","assemble-rehearsal","smoke"], skipped: ["attest","assemble","attest-bundle","smoke-scenarios"]}
               else error("unknown mode") end) as $want
            | all($want.success[]; . as $n | $needs[$n].result == "success")
              and all($want.skipped[]; . as $n | $needs[$n].result == "skipped")
              and (if $mode == "rehearsal" then $scenarios == "success" else true end)
          ' >/dev/null || { echo "::error::the evidence jobs of mode $MODE did not all succeed (external archive-scenario result: ${SCENARIOS:-<none>})"; exit 1; }
