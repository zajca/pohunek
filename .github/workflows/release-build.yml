name: Release build

# Reusable producer half of the release: the Linux CLI and daemon
# archives, the plugin kit bundles, the official runtime package archives
# and the TypeScript SDK tarballs, all from the exact commit of the calling
# run. Called by release.yml (mode `release`, a tag) and by ci.yml (mode
# `rehearsal`, the PR-time proof of the whole assembly).
#
# This workflow only produces workflow artifacts. It holds a read-only token,
# no secret and no environment, and it never creates or touches a GitHub
# Release; publication of the release bundle is the single `publish` job of
# release.yml, publication of the kit bundles is the plugin-kit-publish
# workflow (issue #1613).
#
# Artifacts (names are the contract with release-evidence.yml):
#   build-<component>-<target>  the archive and its .sha256
#   build-kit-<target>          the plugin kit bundle and its .sha256 (the
#                               attest job covers `build-*`, so the bundle is
#                               attested with the other producer artifacts;
#                               it never enters the release bundle)
#   package-archives            every runtime-packages/* archive and .sha256
#   sdk-release-assets          the SDK tarballs and their .sha256
#
# Mode `rehearsal` stages the daemon archives with a throwaway trust anchor
# (scripts/release-workflow/rehearsal-trust) written over
# packaging/runtime-catalog-anchor.json in the job's own ephemeral checkout, so
# the archives and the rehearsal's throwaway signing key agree. The production
# anchor is never changed, and a rehearsal bundle is never published.
# Linux jobs stay on ubuntu-24.04 (#1731), never ubuntu-latest: they build, assemble or run the shipped binaries, and the
# acceptance guests carry glibc 2.41, which `glibc-check` enforces; ubuntu-26.04 has glibc 2.43.
on:
  workflow_call:
    inputs:
      mode:
        description: "`release` for a tag run, `rehearsal` for a CI run that never publishes"
        type: string
        required: true
      version:
        description: The release version X.Y.Z of the checkout (the workspace version)
        type: string
        required: true
      nightly:
        description: "`true` when the caller runs the nightly tier (schedule or a `tier=nightly` dispatch); the kit jobs run only on a tag release or the nightly tier"
        type: string
        required: false
        default: "false"
    outputs:
      version:
        description: The release version X.Y.Z of the checkout (the workspace version)
        value: ${{ jobs.meta.outputs.version }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation: rust-cache strips incremental artifacts
  # before persisting anyway (issue #124).
  CARGO_INCREMENTAL: "0"
  # Pinned sccache release for .github/actions/setup-sccache. SCCACHE_SHA256
  # is the sha256 of sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz as
  # published in the release's .sha256 asset
  # (https://github.com/mozilla/sccache/releases/tag/v0.18.0), cross-checked
  # against a local download. Bump both together with release.yml.
  SCCACHE_VERSION: "0.18.0"
  SCCACHE_SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
  # Pinned mold release for .github/actions/setup-mold; the provenance of
  # MOLD_SHA256 is documented in ci.yml. Bump together with ci.yml, upgrade.yml,
  # gate-tests.yml, release.yml and release-build.yml.
  MOLD_VERSION: "2.42.1"
  MOLD_SHA256: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855
  # Retry bounds for `.github/scripts/ci-retry` (issue #2201; the values and
  # their calibration are documented in ci.yml). This workflow only needs the
  # apt and bun classes.
  CI_RETRY_ATTEMPTS: "3"
  CI_RETRY_BACKOFF_SECONDS: "10"
  CI_RETRY_ATTEMPT_TIMEOUT_APT_SECONDS: "180"
  CI_RETRY_ATTEMPT_TIMEOUT_BUN_SECONDS: "180"

jobs:
  meta:
    name: Resolve the release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A release run requires the tag to be exactly v<workspace version>.
      - name: Resolve and check the version
        id: version
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(scripts/release-workflow/version "$MODE" "$REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per target. Each component keeps its own `cargo build`
  # invocation, so feature unification across components cannot change its
  # bytes, while the components of a target share the compiled dependencies.
  # A component is staged and archived right after its build, before the
  # next one builds: the daemon build relinks `pohunek` in the same target
  # dir with the features of all three of its packages.
  binaries:
    name: Build ${{ matrix.target }} (${{ matrix.components }})
    needs: [meta]
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dynamically linked glibc build (primary target).
          - target: x86_64-unknown-linux-gnu
            components: cli daemon
          # Fully static musl CLI and daemon builds: self-contained binaries
          # that run on x86_64 Linux regardless of the host glibc version.
          - target: x86_64-unknown-linux-musl
            components: cli daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Python for Hermes release verification
        if: ${{ inputs.mode == 'release' && contains(matrix.components, 'daemon') }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv for Hermes release verification
        if: ${{ inputs.mode == 'release' && contains(matrix.components, 'daemon') }}
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install musl toolchain
        if: ${{ endsWith(matrix.target, '-musl') }}
        # The step limit bounds a hung mirror; apt's own timeouts end a stalled
        # connection inside each attempt, and the step fails with apt's error.
        timeout-minutes: 10
        run: |
          # One retried unit: update and install succeed or fail together, so
          # a DNS outage (#2192) retries from a clean package list.
          "$GITHUB_WORKSPACE/.github/scripts/ci-retry" --label apt-musl \
            --attempts "$CI_RETRY_ATTEMPTS" \
            --attempt-timeout "$CI_RETRY_ATTEMPT_TIMEOUT_APT_SECONDS" \
            --backoff "$CI_RETRY_BACKOFF_SECONDS" -- \
            sudo sh -c 'apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y musl-tools'

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      # Every job links host binaries (build scripts, `cargo xtask docs site`)
      # with the job-level mold RUSTFLAGS; only the musl target link itself
      # drops mold, in the "Build and package each component" step.
      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        timeout-minutes: 10
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Enable sccache
        uses: ./.github/actions/setup-sccache
        with:
          version: ${{ env.SCCACHE_VERSION }}
          sha256: ${{ env.SCCACHE_SHA256 }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-

      - name: Build docs artifacts
        run: cargo xtask docs site

      # The throwaway anchor replaces the production one in this ephemeral
      # checkout only; stage-archive copies it into the daemon archive alone.
      - name: Install the rehearsal trust anchor
        if: ${{ inputs.mode == 'rehearsal' && contains(matrix.components, 'daemon') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p xtask
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/rehearsal-trust \
            "$RUNNER_TEMP/rehearsal-trust" "$GITHUB_RUN_ID" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/rehearsal-trust/anchor.json" packaging/runtime-catalog-anchor.json

      - name: Build and package each component
        shell: bash
        env:
          # musl targets link statically via the musl toolchain wrapper, which
          # does not accept GNU ld replacement flags: keep mold GNU-only.
          RUSTFLAGS: ${{ endsWith(matrix.target, '-musl') && '-D warnings' || '-D warnings -C link-arg=-fuse-ld=mold' }}
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          COMPONENTS: ${{ matrix.components }}
        run: |
          set -euo pipefail
          # Archives are stamped with the commit time, so rebuilding the same
          # commit yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          build_args=(--release --locked --target "$TARGET")
          for component in $COMPONENTS; do
            case "$component" in
              cli)
                cargo build "${build_args[@]}" -p pohunek-cli --bin pohunek
                ;;
              daemon)
                cargo build "${build_args[@]}" \
                  -p pohunek-cli \
                  -p pohunek-daemon \
                  -p pohunek-session-worker \
                  --bin pohunek \
                  --bin pohunekd \
                  --bin pohunek-sessiond
                ;;
              *)
                echo "::error::unsupported release component: $component"
                exit 1
                ;;
            esac
            case "$component" in
              cli)
                packaging/check-no-embedded-knowledge docs/knowledge/assistant/system.md \
                  "target/$TARGET/release/pohunek"
                ;;
              daemon)
                packaging/check-no-embedded-knowledge docs/knowledge/assistant/system.md \
                  "target/$TARGET/release/pohunek" \
                  "target/$TARGET/release/pohunekd" \
                  "target/$TARGET/release/pohunek-sessiond"
                ;;
            esac
            name="$(packaging/stage-archive "$component" "$VERSION" "$TARGET" \
              "target/$TARGET/release" target/pohunek-docs dist)"
            if [ "$name" != "pohunek-$component-$VERSION-$TARGET" ]; then
              echo "::error::staged archive $name does not match the component $component"
              exit 1
            fi
            sh packaging/write-manifest "dist/$name" "$component" "$VERSION" "$TARGET" none
            sh packaging/archive dist "$name" dist
          done

      - name: Provision locked Hermes runtime
        if: ${{ inputs.mode == 'release' && contains(matrix.components, 'daemon') }}
        id: hermes
        shell: bash
        run: |
          set -euo pipefail
          hermes_bin="$(scripts/provision-hermes-compat "$RUNNER_TEMP/hermes-compat")"
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      # The gate and the packaged smoke install the operator plugin from the
      # Hermes runtime package through the archive's own daemon. This archive
      # does not carry the signed release catalog yet (the evidence workflow
      # assembles it), so the package is built here from
      # runtime-packages/hermes and authorized by a throwaway catalog whose
      # anchor only the smoke's private prefix trusts; the archive's
      # production anchor is untouched.
      - name: Verify packaged daemon against pinned Hermes
        if: ${{ inputs.mode == 'release' && contains(matrix.components, 'daemon') }}
        shell: bash
        env:
          HERMES_BIN: ${{ steps.hermes.outputs.bin }}
          ARCHIVE_NAME: pohunek-daemon-${{ needs.meta.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "dist/$ARCHIVE_NAME.tar.gz" -C "$extract_dir"
          release_root="$(realpath "$extract_dir/$ARCHIVE_NAME")"
          packaged_smoke="$release_root/packaging/smoke-hermes-plugin-release"
          for binary in pohunek pohunekd pohunek-sessiond; do
            test -x "$release_root/$binary"
          done
          test -x "$packaged_smoke"
          package_dir="$extract_dir/hermes-package"
          mkdir "$package_dir"
          scripts/build-hermes-package "$package_dir/hermes.tar.zst"
          cargo xtask hermes throwaway-catalog \
            --package "$package_dir/hermes.tar.zst" \
            --output-dir "$package_dir/trust"
          cargo xtask hermes compatibility \
            --hermes-bin "$HERMES_BIN" \
            --bin-dir "$release_root" \
            --package "$package_dir/hermes.tar.zst"
          "$packaged_smoke" "$release_root" "$package_dir/hermes.tar.zst" \
            "$package_dir/trust/runtime-catalog.json" \
            "$package_dir/trust/runtime-catalog-anchor.json" \
            "$HERMES_BIN"

      # Only the archives and their checksums leave this job, one artifact per
      # component. A rerun of the job replaces the uploads of its failed
      # attempt instead of failing on a name the attempt already used.
      - name: Upload the cli archive
        if: ${{ contains(matrix.components, 'cli') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-cli-${{ matrix.target }}
          path: |
            dist/pohunek-cli-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/pohunek-cli-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: true

      - name: Upload the daemon archive
        if: ${{ contains(matrix.components, 'daemon') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-daemon-${{ matrix.target }}
          path: |
            dist/pohunek-daemon-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/pohunek-daemon-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: true

  # The owner-side plugin kit bundles (issue #1613): `pohunek`, `pohunekd`,
  # `pohunek-sessiond` and `pohunek-plugin-kit` plus the descriptor schema
  # note, as one deterministic `.tar.zst` per target. The bundle is not a
  # release archive: it carries no MANIFEST, so it never enters the release
  # bundle assembled from `build-cli-*` and `build-daemon-*` (ruling 2); the
  # attest job downloads `build-*` and attests it with the other producer
  # artifacts. The macOS leg builds natively on macos-15 like the rehearsal
  # macOS job, not cross-compiled.
  #
  # The jobs run on a tag release and on the nightly tier (the schedule and
  # a `tier=nightly` dispatch, passed as the `nightly` input because the
  # caller's event is not visible inside a reusable workflow), never on a
  # pull request or push run: a rehearsal on any other event proves the
  # release assembly only (ruling 4). Two jobs with literal runners instead
  # of one matrix job: a job whose `runs-on` is an expression may not use
  # the rust cache.
  kit-linux:
    name: Build the plugin kit bundle for x86_64-unknown-linux-gnu
    if: ${{ inputs.mode == 'release' || inputs.nightly == 'true' }}
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-kit-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the kit binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            -p pohunek-cli \
            -p pohunek-daemon \
            -p pohunek-session-worker \
            -p pohunek-plugin-kit \
            --bin pohunek \
            --bin pohunekd \
            --bin pohunek-sessiond \
            --bin pohunek-plugin-kit

      - name: Stage and archive the kit bundle
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Archives are stamped with the commit time, so rebuilding the same
          # commit yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bindir="target/$TARGET/release"
          packaging/check-no-embedded-knowledge docs/knowledge/assistant/system.md \
            "$bindir/pohunek" \
            "$bindir/pohunekd" \
            "$bindir/pohunek-sessiond" \
            "$bindir/pohunek-plugin-kit"
          mkdir -p dist stage
          name="$(packaging/stage-kit-bundle "$VERSION" "$TARGET" "$bindir" stage)"
          if [ "$name" != "pohunek-plugin-kit-$VERSION-$TARGET" ]; then
            echo "::error::staged bundle $name does not match the kit name"
            exit 1
          fi
          packaging/archive-kit stage "$name" dist

      # A rerun of the job replaces the uploads of its failed attempt.
      - name: Upload the kit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-kit-${{ env.TARGET }}
          path: |
            dist/pohunek-plugin-kit-${{ needs.meta.outputs.version }}-${{ env.TARGET }}.tar.zst
            dist/pohunek-plugin-kit-${{ needs.meta.outputs.version }}-${{ env.TARGET }}.tar.zst.sha256
          if-no-files-found: error
          overwrite: true

  kit-macos:
    name: Build the plugin kit bundle for aarch64-apple-darwin
    if: ${{ inputs.mode == 'release' || inputs.nightly == 'true' }}
    needs: [meta]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-kit-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the kit binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            -p pohunek-cli \
            -p pohunek-daemon \
            -p pohunek-session-worker \
            -p pohunek-plugin-kit \
            --bin pohunek \
            --bin pohunekd \
            --bin pohunek-sessiond \
            --bin pohunek-plugin-kit

      - name: Stage and archive the kit bundle
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Archives are stamped with the commit time, so rebuilding the same
          # commit yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bindir="target/$TARGET/release"
          packaging/check-no-embedded-knowledge docs/knowledge/assistant/system.md \
            "$bindir/pohunek" \
            "$bindir/pohunekd" \
            "$bindir/pohunek-sessiond" \
            "$bindir/pohunek-plugin-kit"
          mkdir -p dist stage
          name="$(packaging/stage-kit-bundle "$VERSION" "$TARGET" "$bindir" stage)"
          if [ "$name" != "pohunek-plugin-kit-$VERSION-$TARGET" ]; then
            echo "::error::staged bundle $name does not match the kit name"
            exit 1
          fi
          packaging/archive-kit stage "$name" dist

      # A rerun of the job replaces the uploads of its failed attempt.
      - name: Upload the kit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-kit-${{ env.TARGET }}
          path: |
            dist/pohunek-plugin-kit-${{ needs.meta.outputs.version }}-${{ env.TARGET }}.tar.zst
            dist/pohunek-plugin-kit-${{ needs.meta.outputs.version }}-${{ env.TARGET }}.tar.zst.sha256
          if-no-files-found: error
          overwrite: true

  # One job for all official packages: every runtime-packages/<runtime>/
  # directory is verified (two builds compared) and archived. Adding a runtime
  # directory adds its archive here without a workflow edit. The same job then
  # packs the TypeScript SDK tarballs.
  packages:
    name: Build the runtime package archives and the SDK tarballs
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-packages
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build xtask
        run: cargo build --locked -p xtask

      - name: Verify and build every runtime package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/build-packages \
            "$VERSION" "$RUNNER_TEMP/package-archives" "$RUNNER_TEMP/package-evidence"

      # A rerun of the job, for example after a failed SDK pack, replaces the
      # uploads of its failed attempt.
      - name: Upload the package archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-archives
          path: ${{ runner.temp }}/package-archives
          if-no-files-found: error
          overwrite: true

      # The builder evidence (manifest, provenance input, compatibility vector)
      # is a workflow artifact only: no release job downloads it, so it never
      # reaches the assembler's inputs or the published bundle.
      - name: Upload the package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-evidence
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: error
          overwrite: true

      # The SDK tarballs are built with a read-only token and no persisted git
      # credentials, because packing installs and runs npm dependencies. That
      # code runs only after the package archives and their evidence have left
      # the job. The policy requires the tarballs in every bundle, so a
      # rehearsal packs them too.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      # The pack script compiles each package with the workspace's locked
      # TypeScript and `@types/*`, so the lockfile is installed first.
      - name: Install workspace dependencies
        run: |
          # Bun retries a failed request (BUN_CONFIG_HTTP_RETRY_COUNT) but
          # gives up after one timeout, which has no knob: the helper retries
          # the whole install instead.
          "$GITHUB_WORKSPACE/.github/scripts/ci-retry" --label bun-install-release-build \
            --attempts "$CI_RETRY_ATTEMPTS" \
            --attempt-timeout "$CI_RETRY_ATTEMPT_TIMEOUT_BUN_SECONDS" \
            --backoff "$CI_RETRY_BACKOFF_SECONDS" -- \
            bun install --frozen-lockfile

      # The asset base URL is where the release of this version serves its files.
      - name: Pack SDK tarballs
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.meta.outputs.version }}
          SDK_ASSET_DIR: sdk-dist
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bun sdk/ts/scripts/pack-release.ts \
            --version "$VERSION" \
            --base-url "$RELEASE_BASE_URL" \
            --out "$SDK_ASSET_DIR"
          ( cd "$SDK_ASSET_DIR" && sha256sum -c ./*.sha256 )

      - name: Upload SDK tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-release-assets
          path: sdk-dist
          if-no-files-found: error
          overwrite: true

  # Rehearsal-only macOS archives for CI (issue #929): native aarch64-apple-darwin
  # builds with a throwaway trust anchor. This job runs on macos-15 and produces
  # the macos-signed-<component> archives that the evidence workflow expects from
  # a rehearsal. In release mode, release.yml's stage-macos and package-macos jobs
  # build and sign the production archives instead, one job per component; a
  # rehearsal publishes nothing, so both of its components share one runner.
  # Each component is built by the same `packaging/macos/build-release
  # <component>` invocation as in stage-macos, and is staged and signed before
  # the next one builds: the daemon build relinks `pohunek` in the same target
  # dir. The timeout covers both components on a cold cache with room for a slow
  # runner, because a rehearsal that times out fails the release gate.
  rehearsal-macos:
    name: Build and sign cli and daemon for aarch64-apple-darwin (rehearsal)
    if: ${{ inputs.mode == 'rehearsal' }}
    needs: [meta]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-rehearsal
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build offline documentation
        run: cargo xtask docs site

      # Only the daemon archive carries the anchor; the cli staging never
      # reads it.
      - name: Install the rehearsal trust anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p xtask
          XTASK="$PWD/target/debug/xtask" scripts/release-workflow/rehearsal-trust \
            "$RUNNER_TEMP/rehearsal-trust" "$GITHUB_RUN_ID" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/rehearsal-trust/anchor.json" packaging/runtime-catalog-anchor.json

      - name: Build cli release binaries
        id: build-cli
        shell: bash
        env:
          COMPONENT: cli
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release "$COMPONENT")"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Stage and package the cli archive
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMPONENT: cli
          BINDIR: ${{ steps.build-cli.outputs.bindir }}
        run: |
          set -euo pipefail
          # Archives are stamped with the commit time, so rebuilding the same
          # commit yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          packaging/macos/package --stage-release "$COMPONENT" "$VERSION" \
            "$BINDIR" target/pohunek-docs dist
          # Ad-hoc sign, verify, and archive; runs no program from the tree.
          archive="$(packaging/macos/package --adhoc-release "$COMPONENT" "$VERSION" \
            "dist/pohunek-$COMPONENT-$VERSION-aarch64-apple-darwin")"
          mkdir -p "$RUNNER_TEMP/signed-upload/$COMPONENT"
          cp "$archive" "$archive.sha256" "$RUNNER_TEMP/signed-upload/$COMPONENT/"

      - name: Build daemon release binaries
        id: build-daemon
        shell: bash
        env:
          COMPONENT: daemon
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release "$COMPONENT")"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Stage and package the daemon archive
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMPONENT: daemon
          BINDIR: ${{ steps.build-daemon.outputs.bindir }}
        run: |
          set -euo pipefail
          # Archives are stamped with the commit time, so rebuilding the same
          # commit yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          packaging/macos/package --stage-release "$COMPONENT" "$VERSION" \
            "$BINDIR" target/pohunek-docs dist
          # Ad-hoc sign, verify, and archive; runs no program from the tree.
          archive="$(packaging/macos/package --adhoc-release "$COMPONENT" "$VERSION" \
            "dist/pohunek-$COMPONENT-$VERSION-aarch64-apple-darwin")"
          mkdir -p "$RUNNER_TEMP/signed-upload/$COMPONENT"
          cp "$archive" "$archive.sha256" "$RUNNER_TEMP/signed-upload/$COMPONENT/"

      # A rerun of the job replaces the uploads of its failed attempt.
      - name: Upload the signed cli archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-cli
          path: ${{ runner.temp }}/signed-upload/cli
          if-no-files-found: error
          overwrite: true

      - name: Upload the signed daemon archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-daemon
          path: ${{ runner.temp }}/signed-upload/daemon
          if-no-files-found: error
          overwrite: true
