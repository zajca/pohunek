name: Gate tests

# The release gate's test steps: format, clippy, the nextest archive, the
# partition proof, every shard, the doctests and the dependency audit, on the
# full workspace (the workflow takes no input, so no selection or sparse tree
# can narrow it). One definition serves both callers:
# - release.yml `gate` runs it on a release tag, after the exact-commit
#   evidence check;
# - ci.yml `release-gate` runs it in the nightly tier and on a pull request
#   that changes one of its inputs, so a break shows before the next tag.
# The called workflow holds only `contents: read` and receives no secret. The
# PostgreSQL service lives in the job because a called workflow cannot use its
# caller's services.

# The gate stays on ubuntu-24.04 (#1731), never ubuntu-latest, like the release
# jobs it guards.
on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation: rust-cache strips incremental artifacts
  # before persisting anyway (issue #124).
  CARGO_INCREMENTAL: "0"
  # Each Rust job's .github/actions/setup-sccache step exports RUSTC_WRAPPER
  # once the pinned sccache is verified in place. Bump SCCACHE_VERSION together
  # with release-build.yml and release.yml.
  SCCACHE_VERSION: "0.18.0"
  SCCACHE_SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
  # Pinned mold release for .github/actions/setup-mold; the provenance of
  # MOLD_SHA256 is documented in ci.yml. Bump together with ci.yml, upgrade.yml,
  # gate-tests.yml, release.yml and release-build.yml.
  MOLD_VERSION: "2.42.1"
  MOLD_SHA256: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855

jobs:
  tests:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Runner disk headroom (#1923). The Test step can exhaust the hosted
      # runner's root disk: clippy, the nextest archive and the doctests each
      # build the workspace, and six shards run from one archive. The
      # preinstalled Android SDK, .NET, GHC and CodeQL trees are unused by
      # this job, so they are removed first. Every `df` is logged under a
      # "disk:" line; read those lines of a run to see free space at each
      # stage. Measured on the 145G root disk of run 42207012636
      # (2026-11-06): 86G free before pruning (59G used), 108G after (the
      # prune freed 21G in 109 s); 94G free after the archive (target 12G,
      # archive 1.5G); 93G free after every shard, the minimum of the job.
      # Peak use is about 52G, so a healthy runner has ample headroom. The
      # run that failed with "No space left on device" (#1923) was on a
      # runner whose free space this job cannot predict: the `disk:` lines
      # of any failing run show whether the starting free space was low.
      - name: Free preinstalled toolchains
        timeout-minutes: 10
        env:
          # The whole prune loop shares one budget below the step's
          # timeout-minutes (600 s). Each removal gets the budget that is
          # left, and a removal that finds none left is skipped, so a slow
          # prune on a degraded runner becomes a warning, not a red gate.
          PRUNE_BUDGET_SECONDS: "480"
        run: |
          set -uo pipefail
          echo "disk: before pruning"
          df -h / "$RUNNER_TEMP" || true
          deadline=$((SECONDS + PRUNE_BUDGET_SECONDS))
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then
              remaining=$((deadline - SECONDS))
              if [ "$remaining" -le 0 ]; then
                echo "::warning::prune budget exhausted, skipping $dir"
                continue
              fi
              timeout "$remaining" sudo rm -rf -- "$dir" || echo "::warning::could not prune $dir"
            fi
          done
          echo "disk: after pruning"
          df -h / || true

      - name: Install mold linker
        uses: ./.github/actions/setup-mold
        timeout-minutes: 10
        with:
          version: ${{ env.MOLD_VERSION }}
          sha256: ${{ env.MOLD_SHA256 }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Enable sccache
        uses: ./.github/actions/setup-sccache
        with:
          version: ${{ env.SCCACHE_VERSION }}
          sha256: ${{ env.SCCACHE_SHA256 }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-
          # Only main saves; pull requests and tags restore its entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # xtask::dependency_policy resolves the locked graph with `--offline`, so
      # every locked package source must already be in the cargo registry.
      - name: Fetch locked dependency sources
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Measure disk before clippy
        timeout-minutes: 5
        run: |
          echo "disk: before clippy"
          df -h / || true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # The gate runs the tests the way CI does: one archive of the workspace
      # test binaries, shards proven exhaustive and disjoint, one nextest
      # process per test. The archive holds `pohunek-sessiond`, which the daemon
      # tests spawn by path (`archive.include` in .config/nextest.toml makes
      # its absence a build error).
      - name: Archive workspace test binaries
        run: cargo nextest archive --profile ci --workspace --all-features --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Measure disk after the archive
        timeout-minutes: 5
        run: |
          echo "disk: after the nextest archive"
          df -h / || true
          timeout 120 du -sh target "$RUNNER_TEMP/nextest-archive.tar.zst" ~/.cargo/registry || true

      - name: Verify exhaustive disjoint test partitions
        run: python3 scripts/test-partitions --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" check

      # Every shard runs before the step fails, so one red shard does not hide
      # another. Only the relay-db shard sees the PostgreSQL service, as in CI.
      - name: Test
        shell: bash
        env:
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          RELAY_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/pohunek_test
        run: |
          set -uo pipefail
          archive="$RUNNER_TEMP/nextest-archive.tar.zst"
          failed=()
          for shard in core daemon relay cli relay-db heavy; do
            rm -rf target/nextest
            echo "::group::shard $shard"
            if [ "$shard" = relay-db ]; then
              POHUNEK_RELAY_TEST_DATABASE_URL="$RELAY_DATABASE_URL" python3 scripts/test-partitions --archive-file "$archive" run "$shard" || failed+=("$shard")
            else
              python3 scripts/test-partitions --archive-file "$archive" run "$shard" || failed+=("$shard")
            fi
            echo "::endgroup::"
            echo "disk: after shard $shard"
            df -h / || true
            if [ "$shard" = heavy ]; then
              python3 scripts/junit-flaky-summary --label "$shard" target/nextest/heavy/junit.xml
            elif [ "$shard" = relay-db ]; then
              python3 scripts/junit-flaky-summary --label "$shard" target/nextest/relay-db/junit.xml
            else
              python3 scripts/junit-flaky-summary --label "$shard" target/nextest/ci/junit.xml
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::failed test shards: ${failed[*]}"
            exit 1
          fi

      # nextest runs no doctests.
      - name: Documentation tests
        run: cargo test --doc --workspace --all-features

      - name: Measure disk after the doctests
        timeout-minutes: 5
        run: |
          echo "disk: after the doctests"
          df -h / || true

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit release dependencies
        run: cargo audit
