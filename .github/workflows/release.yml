name: Release

# Triggered by pushing a `vX.Y.Z` tag (created by `scripts/release`). First runs
# the full quality gate (fmt/clippy/test) on the tagged commit, and only if that
# passes builds the native component binaries and the self-contained web control
# center for Linux x86_64, packages them with sha256 checksums, and attaches
# everything to a GitHub Release for that tag.
#
# A tag push does NOT run the CI workflow (CI runs on branch pushes and PRs), so
# the gate is duplicated here: no binary is published from a commit that fails
# fmt, clippy, or tests.
#
# The native Apple Silicon archives are built by `build-macos` on macOS runners,
# signed with a Developer ID certificate, and notarized; see that job.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation: rust-cache strips incremental artifacts
  # before persisting anyway (issue #124).
  CARGO_INCREMENTAL: "0"
  # NOTE (issue #124): SCCACHE_GHA_ENABLED/RUSTC_WRAPPER and the mold
  # -C link-arg=-fuse-ld=mold RUSTFLAGS live in each Rust job's `env`, not
  # here: workflow-level RUSTC_WRAPPER would also wrap steps that never run
  # the sccache-action (e.g. audit-check's `cargo install`), which fails with
  # "could not execute process `sccache ...` (never executed)".

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    env:
      # Bound concurrent isolated PostgreSQL fixture pools.
      RUST_TEST_THREADS: 4
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # Daemon integration tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`), which `cargo test` does not build.
      - name: Build session worker for daemon tests
        run: cargo build -p pohunek-session-worker --bin pohunek-sessiond

      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          POHUNEK_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pohunek_test

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit release dependencies
        run: cargo audit

  docs-gate:
    name: docs check (deterministic build + secret scan)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: docs check
        run: cargo xtask docs check

      - name: TypeScript protocol drift check
        run: cargo xtask ts check

  web-gate:
    name: web typecheck + lint + test + e2e
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `bun install` re-downloads every registry tarball without a cache.
      # Reuse Bun's global package cache, keyed by bun.lock and the
      # setup-bun bun-version pin above, so repeat runs install from disk
      # instead of the network.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run typecheck

      - name: Lint web
        run: bun run lint

      - name: Test web
        run: bun test

      - name: Build web control center
        run: bun run build:frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test web control center
        run: bun run test:e2e

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries must be present.
      - name: Build daemon, session worker, and CLI for web e2e
        run: cargo build -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: SDK e2e against real daemon
        run: bun test sdk/ts/sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Backend e2e against real daemon
        run: bun test web/backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd
          POHUNEK_CLI_BIN: ${{ github.workspace }}/target/debug/pohunek
          POHUNEK_PYTHON_BIN: /usr/bin/python3

  web-release:
    name: Build web control center for Linux x86_64
    needs: [gate, docs-gate, web-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `bun install` re-downloads every registry tarball without a cache.
      # Reuse Bun's global package cache, keyed by bun.lock and the
      # setup-bun bun-version pin above, so repeat runs install from disk
      # instead of the network.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build and package web control center
        id: package
        shell: bash
        run: bash web/release/package.sh "${GITHUB_REF_NAME#v}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            web/${{ steps.package.outputs.archive }}
            web/${{ steps.package.outputs.checksum }}

  build:
    name: Build ${{ matrix.component }} for ${{ matrix.target }}
    needs: [gate, docs-gate, web-gate]
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dynamically linked glibc build (primary target).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            component: cli
            archive_prefix: pohunek-cli
            binary: pohunek
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            component: daemon
            archive_prefix: pohunek-daemon
            binary: pohunekd
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            component: gui
            archive_prefix: pohunek-gui
            binary: pohunek-gui
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            component: relay
            archive_prefix: pohunek-relay
            binary: pohunek-relayd
          # Fully static musl CLI and daemon builds: self-contained binaries
          # that run on x86_64 Linux regardless of the host glibc version.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            component: cli
            archive_prefix: pohunek-cli
            binary: pohunek
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            component: daemon
            archive_prefix: pohunek-daemon
            binary: pohunekd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python for Hermes release verification
        if: matrix.component == 'cli'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv for Hermes release verification
        if: matrix.component == 'cli'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install GUI smoke-test dependencies
        if: matrix.component == 'gui'
        run: sudo apt-get update && sudo apt-get install -y weston

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install mold linker
        if: "!endsWith(matrix.target, '-musl')"
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-

      - name: Build release binaries
        shell: bash
        env:
          # musl targets link statically via the musl toolchain wrapper, which
          # does not accept GNU ld replacement flags: keep mold GNU-only.
          RUSTFLAGS: ${{ endsWith(matrix.target, '-musl') && '-D warnings' || '-D warnings -C link-arg=-fuse-ld=mold' }}
        run: |
          set -euo pipefail
          build_args=(--release --locked --target "${{ matrix.target }}")
          case "${{ matrix.component }}" in
            cli)
              cargo build "${build_args[@]}" -p pohunek-cli --bin pohunek
              ;;
            daemon)
              cargo build "${build_args[@]}" \
                -p pohunek-cli \
                -p pohunek-daemon \
                -p pohunek-session-worker \
                --bin pohunek \
                --bin pohunekd \
                --bin pohunek-sessiond
              ;;
            relay)
              cargo build "${build_args[@]}" -p pohunek-relay --bin pohunek-relayd
              ;;
            gui)
              # Package selection keeps daemon-only features out of the GUI
              # dependency graph; target selection alone does not isolate them.
              cargo build "${build_args[@]}" -p pohunek-gui --bin pohunek-gui
              ;;
            *)
              echo "::error::unsupported release component: ${{ matrix.component }}"
              exit 1
              ;;
          esac

      - name: Build docs artifacts
        run: cargo xtask docs site

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          component="${{ matrix.component }}"
          # Archives are stamped with the tagged commit's time, so rebuilding
          # the same tag yields the same archive bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          name="$(packaging/stage-archive "${component}" "${version}" "${target}" \
            "target/${target}/release" target/pohunek-docs dist)"
          if [ "${name}" != "${{ matrix.archive_prefix }}-${version}-${target}" ]; then
            echo "::error::staged archive ${name} does not match the matrix archive prefix"
            exit 1
          fi
          sh packaging/write-manifest "dist/${name}" "${component}" "${version}" "${target}" none
          sh packaging/archive dist "${name}" dist
          echo "archive=dist/${name}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test packaged GUI
        if: matrix.component == 'gui'
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          scripts/smoke-gui-release "$extract_dir/${{ matrix.archive_prefix }}-${GITHUB_REF_NAME#v}-${{ matrix.target }}/${{ matrix.binary }}"

      - name: Provision locked Hermes runtime
        if: matrix.component == 'cli'
        id: hermes
        shell: bash
        run: |
          set -euo pipefail
          hermes_bin="$(scripts/provision-hermes-compat "$RUNNER_TEMP/hermes-compat")"
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI against pinned Hermes
        if: matrix.component == 'cli'
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          release_root="$extract_dir/${{ matrix.archive_prefix }}-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          release_pohunek="$(realpath "$release_root/${{ matrix.binary }}")"
          packaged_smoke="$release_root/packaging/smoke-hermes-plugin-release"
          test -x "$release_pohunek"
          test -x "$packaged_smoke"
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "$release_pohunek"
          "$packaged_smoke" "$release_pohunek" "${{ steps.hermes.outputs.bin }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  # Signed and notarized native Apple Silicon archives (issue #104), in three
  # jobs so that signing credentials never share a runner with build code:
  #
  #   stage-macos    builds against the macOS 14.0 deployment target on the
  #                  maintained macos-15 image (packaging/macos/DEPLOYMENT_TARGET,
  #                  enforced by the Mach-O audit), runs the built `pohunek` for
  #                  the completions, audits the tree, and uploads it. No secret.
  #   sign-macos     a fresh runner in the protected `macos-signing` environment
  #                  downloads the staged tree, checks it, and signs, notarizes,
  #                  verifies, and archives it. It runs no program from the tree
  #                  and uses only pinned actions. Missing credentials fail it
  #                  before any work: a macOS archive is never published unsigned
  #                  and the run stays red until the credentials exist.
  #   verify-macos   extracts the signed archive outside the checkout, verifies
  #                  its signatures, and runs the packaged smokes. Read-only
  #                  token, no secret.
  #   publish-macos  downloads the signed archive again on a fresh runner,
  #                  checks its checksum, and attaches it without running
  #                  anything from it. The only job with a write token.
  #
  # Running the archives on macOS 14 itself is a separate acceptance gate.
  stage-macos:
    name: Stage ${{ matrix.component }} for aarch64-apple-darwin
    needs: [gate, docs-gate, web-gate]
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon, gui, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        if: matrix.component != 'web'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        if: matrix.component != 'web'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-${{ matrix.component }}

      - name: Build offline documentation
        if: matrix.component != 'web'
        run: cargo xtask docs site

      - name: Build release binaries
        if: matrix.component != 'web'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release "${{ matrix.component }}")"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install web dependencies
        if: matrix.component == 'web'
        run: bun install --frozen-lockfile

      # The compiled backend (Bun runtime plus the compiled SPA), smoke-tested
      # unsigned by package.sh; signing happens in the signing job.
      - name: Build the web control center input tree
        if: matrix.component == 'web'
        id: webinput
        shell: bash
        run: bash web/release/package.sh "${GITHUB_REF_NAME#v}" aarch64-apple-darwin --input-only

      # Staging runs the built `pohunek` to write the shell completions, which
      # is why it happens here and not next to the credentials.
      - name: Stage and audit the archive tree
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Archives are stamped with the tagged commit's time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          staging="$(packaging/macos/package --stage-release "${{ matrix.component }}" "${version}" \
            "${{ matrix.component == 'web' && steps.webinput.outputs.input || steps.build.outputs.bindir }}" \
            "${{ matrix.component == 'web' && 'web' || 'target/pohunek-docs' }}" dist)"
          # A tar keeps the modes that an artifact upload would drop.
          mkdir -p "$RUNNER_TEMP/stage-upload"
          tar -cf "$RUNNER_TEMP/stage-upload/stage.tar" -C "$(dirname "$staging")" "$(basename "$staging")"
          ( cd "$RUNNER_TEMP/stage-upload" && shasum -a 256 stage.tar > stage.tar.sha256 )

      - name: Upload the staged tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-stage-${{ matrix.component }}
          path: ${{ runner.temp }}/stage-upload
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    name: Sign ${{ matrix.component }} for aarch64-apple-darwin
    needs: [stage-macos]
    runs-on: macos-15
    environment: macos-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon, gui, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Require signing and notarization credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for variable in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID MACOS_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::macOS release credentials are missing (${missing[*]}); the public macOS release gate stays failed and no unsigned macOS archive is published"
            exit 1
          fi

      - name: Download the staged tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-stage-${{ matrix.component }}
          path: ${{ runner.temp }}/stage-download

      # The artifact is untrusted data: the directory it must hold is named from
      # the component and the tag, never from the artifact, and no artifact
      # value is ever interpolated into a script.
      - name: Check and extract the staged tree
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin"
          ( cd "$RUNNER_TEMP/stage-download" && shasum -a 256 -c stage.tar.sha256 )
          entries="$(tar -tf "$RUNNER_TEMP/stage-download/stage.tar")"
          if printf '%s\n' "$entries" | grep -v -e "^${name}/" -e "^${name}\$"; then
            echo "::error::the staged tarball holds entries outside ${name}"
            exit 1
          fi
          if printf '%s\n' "$entries" | grep -e '\.\.'; then
            echo "::error::the staged tarball holds a parent-directory component"
            exit 1
          fi
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/stage-download/stage.tar" -C dist
          test -d "dist/${name}"

      - name: Create ephemeral signing keychain
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: packaging/macos/signing-keychain create

      # Signs, notarizes, verifies, and archives the staged tree. It runs no
      # program from the tree.
      - name: Sign, notarize, verify, and package
        id: package
        shell: bash
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          archive="$(packaging/macos/package --sign-release "${{ matrix.component }}" "${version}" \
            "dist/pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin")"
          mkdir -p "$RUNNER_TEMP/signed-upload"
          cp "$archive" "$archive.sha256" "$RUNNER_TEMP/signed-upload/"

      # Always removes the keychain, restoring the runner's search list.
      - name: Remove ephemeral signing keychain
        if: always()
        shell: bash
        run: packaging/macos/signing-keychain delete

      - name: Upload the signed archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-${{ matrix.component }}
          path: ${{ runner.temp }}/signed-upload
          if-no-files-found: error
          retention-days: 1

  verify-macos:
    name: Verify ${{ matrix.component }} for aarch64-apple-darwin
    needs: [sign-macos]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon, gui, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the signed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-signed-${{ matrix.component }}
          path: ${{ runner.temp }}/signed-download

      # Everything below runs from the extracted archive outside the
      # checkout: the published bytes, not the build tree.
      - name: Extract the archive and verify its signatures
        id: extract
        shell: bash
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/signed-download/pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin.tar.gz"
          test -f "$archive"
          ( cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256" )
          extract_dir="$RUNNER_TEMP/extracted"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          root="$extract_dir/$(basename "$archive" .tar.gz)"
          if git -C "$root" rev-parse --git-dir >/dev/null 2>&1; then
            echo "extracted archive is inside a Git worktree: $root" >&2
            exit 1
          fi
          grep -q '^signing developer-id$' "$root/MANIFEST"
          packaging/macos/verify-signed --notarized --team-id "$MACOS_TEAM_ID" "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packaged daemon binaries
        if: matrix.component == 'daemon'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.extract.outputs.root }}"
          for binary in pohunek pohunekd pohunek-sessiond; do
            "$root/$binary" --version
          done

      # The signed backend runs under the hardened runtime with its JIT
      # entitlements, serving the compiled SPA from the extracted archive.
      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install web dependencies
        if: matrix.component == 'web'
        run: bun install --frozen-lockfile

      - name: Smoke-test the packaged web backend
        if: matrix.component == 'web'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.extract.outputs.root }}"
          test -x "$root/install.sh"
          test -f "$root/packaging/verify-archive"
          bun run web/release/smoke.ts "$root/pohunek-web" "$root/frontend"

      - name: Smoke-test the packaged app bundle
        if: matrix.component == 'gui'
        shell: bash
        run: scripts/smoke-gui-release-macos "${{ steps.extract.outputs.root }}/Pohunek.app"

      - name: Install Python for Hermes release verification
        if: matrix.component == 'cli'
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv for Hermes release verification
        if: matrix.component == 'cli'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Rust toolchain
        if: matrix.component == 'cli'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        if: matrix.component == 'cli'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-verify

      - name: Provision locked Hermes runtime
        if: matrix.component == 'cli'
        id: hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          hermes_bin="$(PATH="/bin:$PATH" scripts/provision-hermes-compat "$RUNNER_TEMP/hermes-compat")"
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI against pinned Hermes
        if: matrix.component == 'cli'
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          release_root="${{ steps.extract.outputs.root }}"
          release_pohunek="$(cd "$release_root" && pwd -P)/pohunek"
          packaged_smoke="$release_root/packaging/smoke-hermes-plugin-release"
          test -x "$release_pohunek"
          test -x "$packaged_smoke"
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "$release_pohunek"
          PATH="/bin:$PATH" "$packaged_smoke" "$release_pohunek" "${{ steps.hermes.outputs.bin }}"

  publish-macos:
    name: Publish ${{ matrix.component }} for aarch64-apple-darwin
    needs: [verify-macos]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon, gui, web]
    steps:
      - name: Download the signed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-signed-${{ matrix.component }}
          path: ${{ runner.temp }}/signed-download

      - name: Check the archive checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/signed-download"
          shasum -a 256 -c ./*.tar.gz.sha256
          test "$(ls ./*.tar.gz | wc -l | tr -d ' ')" = 1

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/signed-download/*.tar.gz
            ${{ runner.temp }}/signed-download/*.tar.gz.sha256
