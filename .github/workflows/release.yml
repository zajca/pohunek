name: Release

# Triggered by pushing a `vX.Y.Z` tag (created by `scripts/release`). First runs
# the full quality gate (fmt/clippy/test) on the tagged commit, and only if that
# passes builds the `pohunek` (CLI), `pohunekd` (daemon), and `pohunek-gui`
# binaries for each target on a native runner, packages them into per-target
# tarballs with sha256 checksums, and attaches everything to a GitHub Release
# for that tag.
#
# A tag push does NOT run the CI workflow (CI runs on branch pushes and PRs), so
# the gate is duplicated here: no binary is published from a commit that fails
# fmt, clippy, or tests.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

  docs-gate:
    name: docs check (deterministic build + secret scan)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: docs check
        run: cargo xtask docs check

  build:
    name: Build ${{ matrix.target }}
    needs: [gate, docs-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dynamically linked glibc build (primary target).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # Fully static musl build: a single self-contained binary that runs on
          # any x86_64 Linux regardless of the host glibc version.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --bin pohunek --bin pohunekd --bin pohunek-gui

      - name: Build docs artifacts
        run: cargo xtask docs site

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="pohunek-${version}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "${staging}"
          bindir="target/${{ matrix.target }}/release"
          cp "${bindir}/pohunek" "${bindir}/pohunekd" "${bindir}/pohunek-gui" "${staging}/"
          mkdir -p "${staging}/docs"
          cp -R target/pohunek-docs/offline "${staging}/docs/offline"
          cp target/pohunek-docs/manifest.json "${staging}/docs/manifest.json"
          for extra in README.md LICENSE; do
            if [ ! -f "${extra}" ]; then
              echo "::error file=${extra}::required release file is missing"
              exit 1
            fi
            cp "${extra}" "${staging}/"
          done
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "archive=dist/${name}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "${GITHUB_OUTPUT}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
