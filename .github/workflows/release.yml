name: Release

# Triggered by pushing a `vX.Y.Z` tag (created by `scripts/release`). The flow
# has one producer half, one evidence half and ONE writer:
#
#   gate, docs-gate, sdk-gate, upgrade-test   the quality gate on the tagged
#       commit (a tag push does not run the CI workflow, so the gate is
#       duplicated here);
#   build            release-build.yml: the Linux CLI/daemon/relay archives, the
#                    official runtime package archives and the SDK tarballs;
#   stage-macos, package-macos, verify-macos   the ad-hoc signed Apple Silicon
#                    archives (see the macOS comment below);
#   evidence         release-evidence.yml: per-row compatibility attestations,
#                    provenance, the signed catalog and final bundle, and the
#                    network-isolated archive smoke on that bundle;
#   publish          the only job with `contents: write`.
#
# Every producer and evidence job holds a read-only token and uploads workflow
# artifacts only; none of them can create or edit a GitHub Release. `publish`
# checks out nothing and runs no repository or downloaded code: it takes the
# `release-bundle` artifact, whose `release-inventory.sha256` is the only list
# of files, verifies it, refuses an existing release for the tag, creates a
# DRAFT, uploads exactly the inventory, verifies the draft's assets by name,
# size and digest, and only then publishes it. A visible release is therefore
# either complete or absent. `.github/workflows/notify-tap.yml` runs after this
# workflow and requires the release to be published.
#
# Provenance: the `attest` and `attest-bundle` jobs of release-evidence.yml are
# the only jobs with `id-token: write` and `attestations: write`; the caller
# job `evidence` must grant them because a called workflow cannot hold a scope
# its caller lacks. They run no repository or downloaded code. The signing key
# (the secret CATALOG_SIGNING_KEY_CI of the environment `release`) is read only
# by the signing step of the `assemble` job there.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disable incremental compilation: rust-cache strips incremental artifacts
  # before persisting anyway (issue #124).
  CARGO_INCREMENTAL: "0"
  # NOTE (issue #124): SCCACHE_GHA_ENABLED/RUSTC_WRAPPER and the mold
  # -C link-arg=-fuse-ld=mold RUSTFLAGS live in each Rust job's `env`, not
  # here: workflow-level RUSTC_WRAPPER would also wrap steps that never run
  # the sccache-action (e.g. audit-check's `cargo install`), which fails with
  # "could not execute process `sccache ...` (never executed)".

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bound concurrent isolated PostgreSQL fixture pools.
      RUST_TEST_THREADS: 4
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pohunek_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d pohunek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-

      # xtask::dependency_policy resolves the locked graph with `--offline`, so
      # every locked package source must already be in the cargo registry.
      - name: Fetch locked dependency sources
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # Daemon integration tests spawn the real durable worker by path
      # (`target/debug/pohunek-sessiond`), which `cargo test` does not build.
      - name: Build session worker for daemon tests
        run: cargo build -p pohunek-session-worker --bin pohunek-sessiond

      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Resolved at step level: the `job` context is not available in
          # job-level `env`, where it makes the whole workflow invalid.
          POHUNEK_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/pohunek_test

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit release dependencies
        run: cargo audit

  # Issue #525: the tagged commit must upgrade a session started on the
  # newest earlier release. It runs beside the gate and blocks every job that
  # builds a publishable binary (`build`, `stage-macos`), so nothing is
  # published from a commit that would break live sessions on upgrade.
  upgrade-test:
    name: upgrade from the previous release
    uses: ./.github/workflows/upgrade.yml
    permissions:
      contents: read

  docs-gate:
    name: docs check (deterministic build + secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-

      - name: docs check
        run: cargo xtask docs check

      - name: TypeScript protocol drift check
        run: cargo xtask ts check

  # The SDK gate owns everything that decides whether the SDK tarballs may be
  # published: workspace typecheck/lint/integration tests, the pack contract, and the
  # SDK and Hermes plugin suites against freshly built real binaries.
  sdk-gate:
    name: SDK typecheck + lint + test + pack contract + e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.11-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.11-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      # Real tarballs, a local HTTP server and a real `bun install` of a
      # consumer project; the consumer's registry is unreachable on purpose.
      # The packed tarballs must run under the oldest and the newest Node the
      # docs promise (>= 20 for the socket transport, >= 22 for the WebSocket
      # transport). The contract test runs its Node assertions with the binary
      # named by POHUNEK_TEST_NODE_BIN (skipped when unset), so each step below
      # runs the whole contract once per Node major.
      - name: Install Node 20 for the SDK Node contract
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: SDK pack contract under Node 20
        run: POHUNEK_TEST_NODE_BIN="$(command -v node)" bun test sdk/ts/scripts

      - name: Install Node 22 for the SDK Node contract
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: SDK pack contract under Node 22
        run: POHUNEK_TEST_NODE_BIN="$(command -v node)" bun test sdk/ts/scripts

      # The real daemon spawns `pohunek-sessiond` by path, and the Hermes plugin
      # e2e drives the real `pohunek` CLI, so all three binaries must be present.
      - name: Build daemon, session worker, and CLI for SDK e2e
        run: cargo build --locked -p pohunek-daemon -p pohunek-session-worker -p pohunek-cli

      - name: SDK e2e against real daemon
        run: bun test sdk/ts/sdk/test/e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd

      - name: Hermes plugin e2e against real daemon
        run: bun test sdk/ts/sdk/test/hermes-plugin.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_DAEMON_BIN: ${{ github.workspace }}/target/debug/pohunekd
          POHUNEK_CLI_BIN: ${{ github.workspace }}/target/debug/pohunek
          POHUNEK_PYTHON_BIN: /usr/bin/python3

  build:
    name: Build the release artifacts
    needs: [gate, docs-gate, sdk-gate, upgrade-test]
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      mode: release

  # Ad-hoc signed native Apple Silicon archives (issues #104, #481), in three
  # jobs so that no built program runs after the final bytes are produced:
  #
  #   stage-macos    builds against the macOS 14.0 deployment target on the
  #                  maintained macos-15 image (packaging/macos/DEPLOYMENT_TARGET,
  #                  enforced by the Mach-O audit), runs the built `pohunek` for
  #                  the completions, audits the tree, and uploads it.
  #   package-macos  a fresh runner downloads the staged tree, checks it, ad-hoc
  #                  signs every Mach-O file, verifies the signatures, writes the
  #                  manifest over the signed bytes, and archives it. It is a
  #                  separate job so that it runs nothing from the tree: the
  #                  program that wrote the completions never shares a runner
  #                  with the signing step that produces the final bytes.
  #   verify-macos   extracts the archive outside the checkout, verifies its
  #                  signatures, and runs the packaged smokes.
  #
  # The signed archives (artifacts `macos-signed-<component>`) enter the release
  # through the `evidence` job like every other producer artifact; no macOS job
  # can write to the repository. No macOS job uses an environment, a secret, or
  # a repository variable: an ad-hoc signature needs no credential. The
  # archive's provenance comes from the evidence workflow's attest job, not
  # from a signer identity.
  #
  # Running the archives on macOS 14 itself is a separate acceptance gate.
  stage-macos:
    name: Stage ${{ matrix.component }} for aarch64-apple-darwin
    needs: [gate, docs-gate, sdk-gate, upgrade-test]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-${{ matrix.component }}

      - name: Build offline documentation
        run: cargo xtask docs site

      - name: Build release binaries
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bindir="$(packaging/macos/build-release "${{ matrix.component }}")"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      # Staging runs the built `pohunek` to write the shell completions, which
      # is why it happens here and not next to the credentials.
      - name: Stage and audit the archive tree
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Archives are stamped with the tagged commit's time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          staging="$(packaging/macos/package --stage-release "${{ matrix.component }}" "${version}" \
            "${{ steps.build.outputs.bindir }}" target/pohunek-docs dist)"
          # A tar keeps the modes that an artifact upload would drop.
          mkdir -p "$RUNNER_TEMP/stage-upload"
          tar -cf "$RUNNER_TEMP/stage-upload/stage.tar" -C "$(dirname "$staging")" "$(basename "$staging")"
          ( cd "$RUNNER_TEMP/stage-upload" && shasum -a 256 stage.tar > stage.tar.sha256 )

      - name: Upload the staged tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-stage-${{ matrix.component }}
          path: ${{ runner.temp }}/stage-upload
          if-no-files-found: error
          retention-days: 1

  package-macos:
    name: Package ${{ matrix.component }} for aarch64-apple-darwin
    needs: [stage-macos]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Download the staged tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-stage-${{ matrix.component }}
          path: ${{ runner.temp }}/stage-download

      # The artifact is untrusted data: the directory it must hold is named from
      # the component and the tag, never from the artifact, and no artifact
      # value is ever interpolated into a script.
      - name: Check and extract the staged tree
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin"
          ( cd "$RUNNER_TEMP/stage-download" && shasum -a 256 -c stage.tar.sha256 )
          entries="$(tar -tf "$RUNNER_TEMP/stage-download/stage.tar")"
          if printf '%s\n' "$entries" | grep -v -e "^${name}/" -e "^${name}\$"; then
            echo "::error::the staged tarball holds entries outside ${name}"
            exit 1
          fi
          if printf '%s\n' "$entries" | grep -e '\.\.'; then
            echo "::error::the staged tarball holds a parent-directory component"
            exit 1
          fi
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/stage-download/stage.tar" -C dist
          test -d "dist/${name}"

      # Audits the tree again, ad-hoc signs it, verifies the signatures, and
      # archives it. It runs no program from the tree.
      - name: Ad-hoc sign, verify, and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          archive="$(packaging/macos/package --adhoc-release "${{ matrix.component }}" "${version}" \
            "dist/pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin")"
          mkdir -p "$RUNNER_TEMP/signed-upload"
          cp "$archive" "$archive.sha256" "$RUNNER_TEMP/signed-upload/"

      - name: Upload the signed archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-${{ matrix.component }}
          path: ${{ runner.temp }}/signed-upload
          if-no-files-found: error
          retention-days: 1

  verify-macos:
    name: Verify ${{ matrix.component }} for aarch64-apple-darwin
    needs: [package-macos]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        component: [cli, daemon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the signed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-signed-${{ matrix.component }}
          path: ${{ runner.temp }}/signed-download

      # Everything below runs from the extracted archive outside the
      # checkout: the published bytes, not the build tree.
      - name: Extract the archive and verify its signatures
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/signed-download/pohunek-${{ matrix.component }}-${version}-aarch64-apple-darwin.tar.gz"
          test -f "$archive"
          ( cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256" )
          extract_dir="$RUNNER_TEMP/extracted"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          root="$extract_dir/$(basename "$archive" .tar.gz)"
          if git -C "$root" rev-parse --git-dir >/dev/null 2>&1; then
            echo "extracted archive is inside a Git worktree: $root" >&2
            exit 1
          fi
          grep -q '^signing adhoc$' "$root/MANIFEST"
          packaging/macos/verify-signed --adhoc "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packaged daemon binaries
        if: matrix.component == 'daemon'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.extract.outputs.root }}"
          for binary in pohunek pohunekd pohunek-sessiond; do
            "$root/$binary" --version
          done

      - name: Install Python for Hermes release verification
        if: matrix.component == 'cli'
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv for Hermes release verification
        if: matrix.component == 'cli'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Rust toolchain
        if: matrix.component == 'cli'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        if: matrix.component == 'cli'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-verify

      - name: Provision locked Hermes runtime
        if: matrix.component == 'cli'
        id: hermes
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          hermes_bin="$(PATH="/bin:$PATH" scripts/provision-hermes-compat "$RUNNER_TEMP/hermes-compat")"
          printf 'bin=%s\n' "$hermes_bin" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI against pinned Hermes
        if: matrix.component == 'cli'
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          release_root="${{ steps.extract.outputs.root }}"
          release_pohunek="$(cd "$release_root" && pwd -P)/pohunek"
          packaged_smoke="$release_root/packaging/smoke-hermes-plugin-release"
          test -x "$release_pohunek"
          test -x "$packaged_smoke"
          cargo xtask hermes compatibility \
            --hermes-bin "${{ steps.hermes.outputs.bin }}" \
            --pohunek-bin "$release_pohunek"
          PATH="/bin:$PATH" "$packaged_smoke" "$release_pohunek" "${{ steps.hermes.outputs.bin }}"

  # Per-row compatibility attestations, provenance, the signed catalog and
  # bundle, and the archive smoke. The called workflow downloads the artifacts
  # of `build` and of the macOS jobs by name. The OIDC scopes are the ceiling
  # for its attest jobs; every other job there holds `contents: read`.
  evidence:
    name: Evidence, signed bundle and archive smoke
    needs: [build, verify-macos]
    uses: ./.github/workflows/release-evidence.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ needs.build.outputs.version }}
      commit: ${{ github.sha }}
      mode: release

  # The one writer. It needs every producer and the evidence workflow (whose
  # `verdict` job requires assemble, attest-bundle and smoke to have
  # succeeded). It runs no repository code and no downloaded data: only `gh`
  # and coreutils on the `release-bundle` artifact. A failed run deletes the
  # draft it created, so no partial release stays behind.
  publish:
    name: Publish the release
    needs: [gate, docs-gate, sdk-gate, upgrade-test, build, stage-macos, package-macos, verify-macos, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      # The inventory is the only list of files: the directory must hold
      # exactly the listed regular files plus the inventory itself, with the
      # listed digests, and every versioned name must carry this tag's version.
      - name: Check the bundle against its inventory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"
          cd "$RUNNER_TEMP/bundle"
          test -z "$(find . -mindepth 1 ! -type f -print)"
          test -z "$(find . -mindepth 2 -print)"
          test -z "$(grep -Ev '^[0-9a-f]{64}  [A-Za-z0-9][A-Za-z0-9._-]*$' release-inventory.sha256 || true)"
          sha256sum -c release-inventory.sha256
          { cut -c67- release-inventory.sha256; echo release-inventory.sha256; } | LC_ALL=C sort > "$RUNNER_TEMP/listed.txt"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/present.txt"
          diff "$RUNNER_TEMP/listed.txt" "$RUNNER_TEMP/present.txt"
          while IFS= read -r name; do
            case "$name" in
              runtime-catalog.json | release-inventory.sha256 | attestation-*.json) ;;
              *"-$version-"* | *"-$version."*) ;;
              *) echo "::error::$name does not belong to release $version"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/present.txt"

      # Every published file has provenance from this repository's evidence
      # workflow for this very tag and commit.
      - name: Verify the provenance of every file
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          for file in *; do
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-evidence.yml" \
              --signer-digest "$COMMIT" --source-ref "$GITHUB_REF" --source-digest "$COMMIT" \
              --deny-self-hosted-runners > /dev/null
          done

      # `releases` lists drafts too, unlike the tag endpoint; a leftover draft
      # of this tag blocks the run (delete it, then rerun).
      - name: Refuse a moved tag or an existing release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')"
          test -z "$existing"

      - name: Create the draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""

      - name: Upload exactly the inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          gh release upload "$TAG" ./*

      # The draft must hold exactly the bundle: same names, digests and sizes,
      # read back through the releases API.
      - name: Verify the draft against the inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          want="$(for file in *; do printf '%s sha256:%s %s\n' "$file" "$(sha256sum "$file" | cut -d' ' -f1)" "$(stat -c %s "$file")"; done | LC_ALL=C sort)"
          have="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and .draft) | .assets[] | select(.state == "uploaded") | "\(.name) \(.digest) \(.size)"' | LC_ALL=C sort)"
          test -n "$have"
          test "$want" = "$have"

      - name: Publish the draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh release edit "$TAG" --draft=false

      - name: Verify the published release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          want="$(for file in *; do printf '%s sha256:%s %s\n' "$file" "$(sha256sum "$file" | cut -d' ' -f1)" "$(stat -c %s "$file")"; done | LC_ALL=C sort)"
          have="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .assets[] | select(.state == "uploaded") | "\(.name) \(.digest) \(.size)"' | LC_ALL=C sort)"
          test -n "$have"
          test "$want" = "$have"

      # Only a draft this run created and left unpublished is removed; a
      # published release is never touched.
      - name: Remove an unpublished draft after a failure
        if: ${{ failure() && steps.draft.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for id in $(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and .draft) | .id'); do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
