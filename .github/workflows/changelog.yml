name: Changelog

# Validates the changelog fragments of every pull request and requires one
# unless the pull request carries `no-changelog`. The run is a `pull_request`
# run: no secrets and a read-only token. It checks out the pull request head
# only to read it and runs the fragment check; `pull_request_target` is
# deliberately not used. The label is read from the event in an expression and
# compared with a fixed name, never interpolated into a script.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions: {}

jobs:
  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      # Full history, so the merge base of the pull request is available to the
      # three-dot diff below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate every fragment
        shell: bash
        run: python3 scripts/changelog check

      - name: Require a fragment or the no-changelog label
        shell: bash
        run: |
          set -euo pipefail
          if [ "$NO_CHANGELOG" = true ]; then
            echo "no-changelog label: no fragment required"
            exit 0
          fi
          if git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" -- 'changelog.d/*.md' | grep -q .; then
            echo "changelog fragment added or changed"
            exit 0
          fi
          echo "::error::Add a changelog.d/<issue>-<slug>.md fragment for the user-visible change, or apply the no-changelog label when the change has no user-visible effect."
          exit 1
