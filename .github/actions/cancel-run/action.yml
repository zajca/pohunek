name: Cancel the run
description: >-
  Cancel the current workflow run after a required job failed, so the runners
  of the jobs that are still running are freed for other work. The failing job
  and the run end as cancelled (the failed step stays failed in the job log);
  the `::error` annotation and the job summary name the failed job (display
  name, job id, link) and the step that failed. The caller decides
  when this runs and must grant `actions: write` to its job. The call is
  allowed to fail: a token without that scope (a fork or Dependabot pull
  request) must not change the result of the run, which stays the real failure.

runs:
  using: composite
  steps:
    - name: Cancel the run
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.run_id }}
        REPOSITORY: ${{ github.repository }}
        FAILED_JOB: ${{ github.job }}
        JOB_ID: ${{ job.check_run_id }}
      run: ${GITHUB_ACTION_PATH}/cancel-run.sh
