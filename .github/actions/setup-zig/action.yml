name: Setup zig
description: >-
  Download a pinned zig release, verify its sha256 before extracting, and put
  its directory on PATH. zig is used only as a C compiler (`zig cc`) that ships
  the macOS libc headers, so the macOS build scripts of `scripts/darwin-check`
  compile on a Linux runner without an Apple SDK.

inputs:
  version:
    description: zig release version (e.g. 0.17.0).
    required: true
  sha256:
    description: Expected sha256 of zig-x86_64-linux-<version>.tar.xz.
    required: true

outputs:
  hit:
    description: >-
      `true` when the pinned zig came from the cache, `false` when it
      was downloaded. The offline proof requires `true`.
    value: ${{ steps.restore.outputs.hit }}

runs:
  using: composite
  steps:
    - name: Restore the pinned zig
      id: restore
      uses: ./.github/actions/pinned-cache
      with:
        item: zig
        version: ${{ inputs.version }}
        sha256: ${{ inputs.sha256 }}

    - name: Install zig
      if: steps.restore.outputs.hit != 'true'
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_SHA256: ${{ inputs.sha256 }}
        PINNED_PATH: ${{ steps.restore.outputs.path }}
        # `--retry-all-errors` retries every failure, including a connection
        # reset (curl exit 35 or 56) that plain `--retry` treats as permanent.
        # A permanent error such as 404 is retried too and fails after the last
        # attempt. The sha256 check below still guards the bytes.
        # Without --retry-delay curl backs off exponentially (1, 2, 4 ... s),
        # so 6 retries wait 63 s in all and ride out a short server outage;
        # a fixed delay would spend every retry in a few seconds.
        DOWNLOAD_RETRIES: "6"
        # Transfer limits, as in setup-mold: --retry only counts attempts that
        # return, so a server that accepts and then stalls would hang the job
        # without them. The asset is about 45 MB: 1 KiB/s sustained for 30 s
        # is a stall, and 120 s per attempt still allows a slow download.
        # Retries stop starting after 300 s. curl exit 28 (timeout) is
        # retried through --retry-all-errors.
        DOWNLOAD_CONNECT_TIMEOUT_SECONDS: "15"
        DOWNLOAD_STALL_BYTES_PER_SECOND: "1024"
        DOWNLOAD_STALL_SECONDS: "30"
        DOWNLOAD_MAX_TIME_SECONDS: "120"
        DOWNLOAD_RETRY_MAX_TIME_SECONDS: "300"
      run: |
        set -eu
        # GitHub does not enforce `required: true` on composite inputs.
        if [ -z "$ZIG_VERSION" ] || [ -z "$ZIG_SHA256" ]; then
          echo "::error::setup-zig: inputs 'version' and 'sha256' are required" >&2
          exit 1
        fi
        # The pinned archive is the x86_64 Linux build; fail rather than
        # download a binary for the wrong architecture.
        if [ "$(uname -m)" != x86_64 ]; then
          echo "::error::setup-zig: unsupported architecture $(uname -m)" >&2
          exit 1
        fi
        archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
        dest="${RUNNER_TEMP:?}/zig"
        mkdir -p "$dest"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --retry "$DOWNLOAD_RETRIES" --retry-all-errors \
          --retry-max-time "$DOWNLOAD_RETRY_MAX_TIME_SECONDS" \
          --connect-timeout "$DOWNLOAD_CONNECT_TIMEOUT_SECONDS" \
          --speed-limit "$DOWNLOAD_STALL_BYTES_PER_SECOND" \
          --speed-time "$DOWNLOAD_STALL_SECONDS" \
          --max-time "$DOWNLOAD_MAX_TIME_SECONDS" \
          --output "$dest/$archive" \
          "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
        # Fails closed: extraction only runs after the hash matches.
        (cd "$dest" && printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum -c -)
        tar -xJf "$dest/$archive" -C "$dest" --strip-components=1
        # Only the sha256-checked archive enters the stash the save step
        # writes; the hit step checks its sha256 again before extracting.
        rm -rf "${PINNED_PATH:?}"
        mkdir -p "$PINNED_PATH"
        mv "$dest/$archive" "$PINNED_PATH/"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/zig" version

    - name: Verify the pinned zig on a hit
      if: steps.restore.outputs.hit == 'true'
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_SHA256: ${{ inputs.sha256 }}
        PINNED_PATH: ${{ steps.restore.outputs.path }}
      run: |
        set -eu
        # GitHub does not enforce `required: true` on composite inputs.
        if [ -z "$ZIG_VERSION" ] || [ -z "$ZIG_SHA256" ]; then
          echo "::error::setup-zig: inputs 'version' and 'sha256' are required" >&2
          exit 1
        fi
        stage="${PINNED_PATH:?}"
        archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
        if [ ! -f "$stage/$archive" ]; then
          echo "::error::setup-zig: the cache hit holds no $archive" >&2
          exit 1
        fi
        # Fails closed like the miss path: extraction only runs after the
        # hash of the restored archive matches.
        (cd "$stage" && printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum -c -) || {
          echo "::error::setup-zig: sha256 verification of the restored $archive failed" >&2
          exit 1
        }
        dest="${RUNNER_TEMP:?}/zig"
        rm -rf "$dest"
        mkdir -p "$dest"
        tar -xJf "$stage/$archive" -C "$dest" --strip-components=1
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/zig" version

    - name: Save the pinned zig
      uses: ./.github/actions/pinned-cache
      with:
        phase: save
        key: ${{ steps.restore.outputs.key }}
        path: ${{ steps.restore.outputs.path }}
        hit: ${{ steps.restore.outputs.hit }}
