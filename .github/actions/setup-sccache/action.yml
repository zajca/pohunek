name: Setup sccache
description: >-
  Seed the runner tool cache with a pinned, sha256-verified sccache release,
  then run mozilla-actions/sccache-action against that copy so the action
  neither queries the GitHub API for a latest release nor downloads sccache
  itself. When the pinned release cannot be fetched or verified, the job
  continues without sccache and without RUSTC_WRAPPER: the compile cache only
  affects cost, never the produced binaries.

inputs:
  version:
    description: sccache release version without the leading `v` (e.g. 0.18.0).
    required: true
  sha256:
    description: Expected sha256 of sccache-v<version>-x86_64-unknown-linux-musl.tar.gz.
    required: true

runs:
  using: composite
  steps:
    - name: Seed sccache into the tool cache
      id: seed
      shell: bash
      env:
        SCCACHE_VERSION: ${{ inputs.version }}
        SCCACHE_SHA256: ${{ inputs.sha256 }}
        # `--retry-all-errors` retries every failure, including a connection
        # reset (curl exit 35 or 56) that plain `--retry` treats as permanent.
        # Retries are bounded: when the last attempt fails the job falls back
        # to building without sccache. The sha256 check below guards the bytes.
        DOWNLOAD_RETRIES: "5"
        DOWNLOAD_RETRY_DELAY_SECONDS: "2"
      run: |
        set -euo pipefail
        # GitHub does not enforce `required: true` on composite inputs.
        if [ -z "$SCCACHE_VERSION" ] || [ -z "$SCCACHE_SHA256" ]; then
          echo "::error::setup-sccache: inputs 'version' and 'sha256' are required" >&2
          exit 1
        fi
        # The version becomes part of a URL and of a tool-cache path, and the
        # digest is compared verbatim, so each must have its exact shape.
        if [[ ! "$SCCACHE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::setup-sccache: version '$SCCACHE_VERSION' is not X.Y.Z" >&2
          exit 1
        fi
        if [[ ! "$SCCACHE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::setup-sccache: sha256 is not 64 lowercase hex digits" >&2
          exit 1
        fi
        # The release only ships this asset for x86_64; the tool-cache
        # directory below is the x64 arch of the sccache action.
        if [ "$(uname -m)" != x86_64 ]; then
          echo "::error::setup-sccache: unsupported architecture $(uname -m)" >&2
          exit 1
        fi

        # Any failure below leaves the job without sccache. The step exits 0
        # so the calling job continues; the steps that depend on `ok` skip.
        fallback() {
          echo "::warning::setup-sccache: $1. This job builds without sccache: RUSTC_WRAPPER stays unset and the compile cache is skipped. The produced binaries are unaffected."
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        name="sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
        archive="$name.tar.gz"
        dest="${RUNNER_TEMP:?}/sccache-download"
        rm -rf "$dest"
        mkdir -p "$dest"
        if ! curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --retry "$DOWNLOAD_RETRIES" --retry-all-errors \
          --retry-delay "$DOWNLOAD_RETRY_DELAY_SECONDS" \
          --output "$dest/$archive" \
          "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/$archive"; then
          fallback "download of $archive failed"
        fi
        # Fails closed: nothing is extracted unless the hash matches.
        if ! (cd "$dest" && printf '%s  %s\n' "$SCCACHE_SHA256" "$archive" | sha256sum -c -); then
          fallback "sha256 of $archive does not match the pinned value"
        fi
        mkdir "$dest/extract"
        if ! tar -xzf "$dest/$archive" -C "$dest/extract"; then
          fallback "extraction of $archive failed"
        fi
        binary="$dest/extract/$name/sccache"
        if [ ! -f "$binary" ]; then
          fallback "$archive does not contain $name/sccache"
        fi

        # The layout is the one the sccache action's find() reads: a directory
        # <tool cache>/sccache/<version>/x64 with the binary inside, and a
        # sibling file x64.complete, which find() requires and which is
        # created last.
        tool_dir="${RUNNER_TOOL_CACHE:?}/sccache/$SCCACHE_VERSION/x64"
        rm -f "$tool_dir.complete"
        rm -rf "$tool_dir"
        mkdir -p "$tool_dir"
        cp "$binary" "$tool_dir/sccache"
        chmod 0755 "$tool_dir/sccache"
        : > "$tool_dir.complete"
        echo "ok=true" >> "$GITHUB_OUTPUT"
        echo "setup-sccache: seeded $tool_dir/sccache"

    - name: Enable sccache
      if: ${{ steps.seed.outputs.ok == 'true' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v${{ inputs.version }}

    # Runs only when the seeded copy was verified. The action sets SCCACHE_PATH
    # for later steps; the wrapper is exported only when it points at that copy.
    - name: Export sccache settings
      id: export
      if: ${{ steps.seed.outputs.ok == 'true' }}
      shell: bash
      env:
        SCCACHE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        expected="${RUNNER_TOOL_CACHE%/}/sccache/$SCCACHE_VERSION/x64/sccache"
        if [ "${SCCACHE_PATH:-}" != "$expected" ]; then
          echo "::error::setup-sccache: sccache-action resolved '${SCCACHE_PATH:-}' instead of the verified '$expected'; refusing to wrap rustc with it" >&2
          exit 1
        fi
        # The value of RUSTC_WRAPPER must stay exactly `sccache`: Swatinem/rust-cache
        # hashes the RUST* environment into its cache key.
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
