name: Hermes test interpreter
description: >-
  Install a relocatable CPython 3.12 with PyYAML into a private directory,
  check it against the production runtime policy, and export it as
  POHUNEK_PYTHON_BIN for the Hermes integration tests. Needs a checkout.

runs:
  using: composite
  steps:
    # The Hermes integration tests in pohunek-cli stand in for the pinned
    # runtime with a canonical Python >= 3.10 that imports `yaml` and passes
    # the production runtime policy (crates/cli/src/hermes_integration/
    # test_python.rs): owned by root or the runner user, no group/other write
    # bit on the file or any ancestor. The hosted interpreters (setup-python
    # framework builds, Homebrew) live in shared, group-writable trees and
    # are not relocatable, so the step installs a relocatable standalone
    # CPython with uv into a private directory this job owns and applies the
    # same checks before exporting the path. PyYAML goes into that
    # interpreter itself because a venv interpreter canonicalizes to the base
    # binary and would lose its site-packages.
    - name: Install uv
      uses: ./.github/actions/setup-uv
      with:
        enable-cache: true

    - name: Require the Hermes test interpreter
      shell: /bin/bash {0}
      run: |
        set -euo pipefail
        uid="$(id -u)"
        if stat -f '%u %Lp' / >/dev/null 2>&1; then
          stat_fields() { stat -f '%u %Lp' "$1"; }
        else
          stat_fields() { stat -c '%u %a' "$1"; }
        fi

        # Mirrors validate_runtime/validate_safe_ancestors: owner is root or
        # this user, and no group/other write bit unless a root-owned sticky
        # directory. Prints every path so a rejection is self-diagnosing.
        policy_violations=0
        check_path() {
          local path="$1" owner mode
          read -r owner mode < <(stat_fields "$path")
          printf '  %s uid=%s mode=%s\n' "$path" "$owner" "$mode"
          if [[ "$owner" != "$uid" && "$owner" != 0 ]]; then
            echo "  REJECT: owner uid $owner is neither $uid nor root: $path" >&2
            policy_violations=1
          fi
          if (( (8#$mode & 8#022) != 0 )); then
            if [[ -d "$path" && "$owner" == 0 && -k "$path" ]]; then
              :
            else
              echo "  REJECT: group/other write bit (mode $mode): $path" >&2
              policy_violations=1
            fi
          fi
        }

        private_root="$RUNNER_TEMP/hermes-test-python"
        rm -rf "$private_root"
        install -d -m 700 "$private_root"
        private_root="$(cd "$private_root" && pwd -P)"
        export UV_PYTHON_INSTALL_DIR="$private_root/install"
        export UV_PYTHON_BIN_DIR="$private_root/bin-links"
        install -d -m 700 "$UV_PYTHON_INSTALL_DIR" "$UV_PYTHON_BIN_DIR"
        uv python install 3.12 --no-config
        found="$(uv python find 3.12 --no-config --no-project --managed-python)"
        python_bin="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$found")"
        [[ "$python_bin" == "$private_root"/install/* ]] \
          || { echo "resolved interpreter escapes the private install: $found -> $python_bin" >&2; exit 1; }
        uv pip install --no-config --link-mode copy --python "$python_bin" --break-system-packages pyyaml==6.0.2
        # Symlinks keep their targets' modes; only real entries are changed.
        find "$private_root" -not -type l -exec chmod go-w {} +

        echo "Hermes test interpreter candidate: $python_bin" >&2
        resolved="$("$python_bin" -I -c 'import os, sys; print(os.path.realpath(sys.executable))')"
        [[ "$resolved" == "$python_bin" ]] \
          || { echo "interpreter is not canonical: $resolved != $python_bin" >&2; exit 1; }
        prefix="$("$python_bin" -I -c 'import os, sys; print(os.path.realpath(sys.prefix))')"
        [[ "$prefix" == "$private_root"/install/* ]] \
          || { echo "interpreter prefix is outside the private install: $prefix" >&2; exit 1; }
        path="$python_bin"
        while :; do
          check_path "$path"
          [[ "$path" == / ]] && break
          path="$(dirname "$path")"
        done
        (( policy_violations == 0 )) \
          || { echo "Hermes test interpreter violates the runtime policy: $python_bin" >&2; exit 1; }
        "$python_bin" -I -c 'import sys, yaml; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' \
          || { echo "Hermes test interpreter lacks Python >= 3.10 with PyYAML: $python_bin" >&2; exit 1; }
        printf 'POHUNEK_PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
