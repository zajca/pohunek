name: Setup mold
description: >-
  Download a pinned mold release, verify its sha256 before extracting, and put
  its bin directory on PATH. /usr/bin/ld is left untouched: only jobs that pass
  `-C link-arg=-fuse-ld=mold` link with mold (gcc resolves `ld.mold` via PATH).

inputs:
  version:
    description: mold release version without the leading `v` (e.g. 2.42.1).
    required: true
  sha256:
    description: Expected sha256 of mold-<version>-x86_64-linux.tar.gz.
    required: true

runs:
  using: composite
  steps:
    - name: Install mold linker
      shell: bash
      env:
        MOLD_VERSION: ${{ inputs.version }}
        MOLD_SHA256: ${{ inputs.sha256 }}
        # `--retry-all-errors` retries every failure, including a connection
        # reset (curl exit 35 or 56) that plain `--retry` treats as permanent.
        # A permanent error such as 404 is retried too and fails after the last
        # attempt. The sha256 check below still guards the bytes.
        DOWNLOAD_RETRIES: "5"
        DOWNLOAD_RETRY_DELAY_SECONDS: "2"
        # Transfer limits. --retry only counts attempts that return, so a server
        # that accepts and then stalls would hang the job without these. The
        # asset is 6,446,875 bytes (v2.42.1): 1 KiB/s sustained for 30 s is a
        # stall, and 120 s per attempt is about 53 KiB/s, well below a healthy
        # transfer. Retries stop starting after 300 s, so the worst case is about
        # 300 s + 120 s. mold is required, so the job then fails with an error
        # instead of retrying forever. curl exit 28 (timeout) is retried through
        # --retry-all-errors.
        DOWNLOAD_CONNECT_TIMEOUT_SECONDS: "15"
        DOWNLOAD_STALL_BYTES_PER_SECOND: "1024"
        DOWNLOAD_STALL_SECONDS: "30"
        DOWNLOAD_MAX_TIME_SECONDS: "120"
        DOWNLOAD_RETRY_MAX_TIME_SECONDS: "300"
      run: |
        set -eu
        # GitHub does not enforce `required: true` on composite inputs.
        if [ -z "$MOLD_VERSION" ] || [ -z "$MOLD_SHA256" ]; then
          echo "::error::setup-mold: inputs 'version' and 'sha256' are required" >&2
          exit 1
        fi
        # The release only ships this asset for x86_64; fail rather than
        # download a binary for the wrong architecture.
        if [ "$(uname -m)" != x86_64 ]; then
          echo "::error::setup-mold: unsupported architecture $(uname -m)" >&2
          exit 1
        fi
        archive="mold-${MOLD_VERSION}-x86_64-linux.tar.gz"
        dest="${RUNNER_TEMP:?}/mold"
        mkdir -p "$dest"
        # `|| rc=$?` keeps the exit status: inside `if !` the status is lost.
        rc=0
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --retry "$DOWNLOAD_RETRIES" --retry-all-errors \
          --retry-delay "$DOWNLOAD_RETRY_DELAY_SECONDS" \
          --retry-max-time "$DOWNLOAD_RETRY_MAX_TIME_SECONDS" \
          --connect-timeout "$DOWNLOAD_CONNECT_TIMEOUT_SECONDS" \
          --speed-limit "$DOWNLOAD_STALL_BYTES_PER_SECOND" \
          --speed-time "$DOWNLOAD_STALL_SECONDS" \
          --max-time "$DOWNLOAD_MAX_TIME_SECONDS" \
          --output "$dest/$archive" \
          "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/${archive}" || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::error::setup-mold: download of $archive failed (curl exit $rc)" >&2
          exit 1
        fi
        # Fails closed: extraction only runs after the hash matches.
        (cd "$dest" && printf '%s  %s\n' "$MOLD_SHA256" "$archive" | sha256sum -c -)
        tar -xzf "$dest/$archive" -C "$dest" --strip-components=1
        rm -f "$dest/$archive"
        echo "$dest/bin" >> "$GITHUB_PATH"
        "$dest/bin/mold" --version
