#:schema https://dystroy.org/bacon/.bacon.schema.json
#
# Watcher configuration for the narrow local loops documented in AGENTS.md
# (issue #127). Bacon is an optional developer tool: no CI gate and no
# `cargo xtask` target depends on this file, and every job below only re-runs a
# command that is already documented and usable on its own.
#
#   cargo install --locked bacon                  # scripts/dev-bootstrap --strict checks it
#   bacon                                         # fast nextest loop
#   bacon check                                   # compile errors only, the fastest signal
#   bacon clippy-fast                             # the CI lint gate
#   bacon affected                                # fast loop for changed crates only
#   bacon nextest-fast -- -p pohunek-daemon       # narrow to one crate
#   bacon nextest-fast -- some_test_name           # narrow to one test
#
# Inside bacon, `e` switches to `check`, `c` to `clippy-fast`, `n` or `t` to
# `nextest-fast`, and `a` to `affected` (see [keybindings] below).
#
# Bacon re-runs the active job when watched sources change, so the fast loops
# stay inside the two-minute feedback target instead of re-running the full
# workspace suite.

default_job = "nextest-fast"

# `cargo check` over every target and feature: the same surface clippy-fast
# lints, without the lint pass or the test run, so a type error shows first.
[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--all-features"]
need_stdout = false

# `fast` is the cost boundary from .config/nextest.toml: the `ci` profile plus
# the filter that keeps PTY, PostgreSQL, and Hermes fixtures out of the loop.
# `--hide-progress-bar` and `--failure-output final` keep the captured output
# stable for bacon's analyzer and for copying into a report.
[jobs.nextest-fast]
command = [
    "cargo", "nextest", "run",
    "--profile", "fast",
    "--all-features",
    "--hide-progress-bar",
    "--failure-output", "final",
]
need_stdout = true
analyzer = "nextest"

# `cargo xtask affected`: the `nextest-fast` loop narrowed to the packages the
# branch, staged, unstaged, and untracked changes touch plus their dependents.
# It re-diffs on every run and escalates to the whole workspace for unmapped or
# workspace-wide paths; the trailing arguments go to nextest.
[jobs.affected]
command = [
    "cargo", "xtask", "affected", "--",
    "--hide-progress-bar",
    "--failure-output", "final",
]
need_stdout = true
analyzer = "nextest"

# The CI lint gate itself: workspace, all targets, all features. `-D warnings`
# matches the CI RUSTFLAGS so a locally green run cannot fail in CI.
[jobs.clippy-fast]
command = [
    "cargo", "clippy", "--workspace", "--all-targets", "--all-features",
    "--", "-D", "warnings",
]
need_stdout = false

# Explicit job switches. They override bacon's built-in `a` (`check-all`),
# `c` (`clippy`), `n` (`nextest`) and `t` (`test`) jobs, which run narrower or
# unfiltered commands: plain `cargo test` and `nextest` bypass the `fast`
# profile's cost filter and pull in the PTY, PostgreSQL, and Hermes fixtures.
# `e` is unbound by default; `k`, `j`, and `g` stay free for bacon's optional
# vim-style scrolling keys.
[keybindings]
e = "job:check"
c = "job:clippy-fast"
n = "job:nextest-fast"
t = "job:nextest-fast"
a = "job:affected"
