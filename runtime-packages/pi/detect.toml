# Pi activity manifest (verified with 1.4.0), matched against a real terminal session.
#
# Frame structure, anchored at the bottom of the visible screen (derived from
# the captured screens in compat/pi/screens/, which cover terminal widths 20 to
# 200 and Pi's source geometry):
#
#   transcript ...      anything, never inspected
#   UPPER BORDER        busy: "── <spinner> <message> <rule>"; idle: a plain rule
#   body lines          the draft: blank or any text, zero or more
#   LOWER BORDER        a plain rule
#   footer              one to four non-empty lines up to the screen end
#
# Busy border: Pi writes "── ", a braille spinner and its message (Working,
# Compacting context..., Auto-compacting..., Context overflow detected,
# Auto-compacting..., Retrying (n/m) in Ns...) truncated to the width, one space
# and a closing rule of width - status - 4 columns. That rule is as short as one
# column (24 columns with Retrying, 36 with Compacting) and the message is cut
# mid-word, so a busy border is recognised by its "── <spinner>" start alone, at
# every width. With a hidden-line marker the label sits between two rules
# ("↑ N more"); at narrow widths only the spinner remains.
#
# Plain border: a rule of 20 or more "─", or "↑ N more" / "↓ N more" between
# runs of four or more (what Pi draws from 20 columns up). Narrower terminals
# are not recognised, which only ever withholds idle.
#
# Footer lines and body lines are, by the same classes, never borders. So the
# lower border is the last border on the screen and the upper border the nearest
# one above it: the frame is unique, and the working rule (busy upper border)
# and the idle rule (plain upper border) can never both match, whatever the
# transcript holds. Text that merely starts with "─", or looks like a status
# without the "── <spinner>" start, is body or footer text; a draft or footer
# line that starts "── <spinner>" or is itself a complete plain border cannot be
# told from the frame in plain text. Transcript lines are never consulted, so a
# column-zero rule above the editor cannot stand in for the upper border of a
# busy frame.
#
# Dialogs and selectors replace the editor between two plain borders (Pi then
# draws no busy border, even while a turn waits on the dialog), so their frame
# has the idle editor's shape and only its body tells them apart:
#
# blocked: the body holds the key hint or title of a prompt that waits for an
#          answer, whoever opened it: an extension select, confirm, input or
#          editor dialog (which also covers a permission prompt raised
#          mid-turn), Pi's own confirms drawn the same way (project trust at
#          startup, missing session cwd, "Summarize branch?" in /tree, "Import
#          session"), the /trust selector, and every login step (method,
#          provider, API key, browser or pasted code). Hint words wrap onto
#          padded continuation lines at narrow widths. The startup prompts draw
#          no footer, so zero to four footer lines are accepted, and a prompt
#          taller than the terminal pushes its upper border off the screen, so
#          the frame may start at the first screen line.
# working: the upper border is a busy border.
# idle:    the upper border is a plain border, and the body does not hold the
#          two rows a selector list draws: a cursor row ("→ ", " → ", "› ") and
#          a row indented by exactly two spaces (another item, the "(n/m)"
#          counter or the selected item's details). That keeps the model,
#          session, tree, fork and settings selectors (which wait for the owner
#          but ask nothing) from reading idle; they match no rule.
#
# The regexes are generated, and the complement property and the dialog and
# selector lines are checked, by scripts/pi-detect-regex. A screen that is not
# the editor frame matches no rule and keeps the byte-activity fallback. A draft
# that holds both selector rows withholds idle (Pi then stays at the
# byte-activity fallback until the draft no longer holds both), and one that
# reproduces a dialog's key hint reads as blocked; a quote ("> ...") or a lone
# cursor-like line is draft text.
#
# Not covered: a replacement editor that does not embed the status in its border
# or an extension that swaps the braille spinner; a dialog an extension draws
# with ctx.ui.custom(); and Pi's plain-text "Fork this session into current
# directory? [y/N]" question before the interface starts, which is not drawn in
# a frame (pohunek relaunches a session in its own working directory, where Pi
# does not ask it).

# Pi 1.1.0 and later report their state as OSC 7501 program-status records once
# the terminal answers Pi's probe, which the session worker does for this
# manifest (`answer_probe`). The record is the root record of `app = "pi"`;
# earlier releases emit none and are classified from the screen alone. Pi's own
# confirms and the branch-summary border are not reported as blocked by the
# record: the dialog rule below keeps the confirms blocked, and the
# branch-summary border reads idle, as Pi itself declares it. A dialog drawn
# with ctx.ui.custom() has no screen rule and reads as the record says.
[program_status]
app = "pi"
answer_probe = true

[process]
# Pi retitles its process to `pi` shortly after start (kernel name and argv),
# and runs as `node <install>/coding-agent/dist/bundle/cli.js` before that.
comm = ["^pi$"]
cmdline = [
  '^pi(?: .*)?$',
  '^(?:[^ ]*/)?node [^ ]*coding-agent/dist/bundle/cli\.js(?: .*)?$',
]

[[rules]]
id = "dialog_rule"
state = "blocked"
priority = 800
region = "whole_recent"
visible_blocker = true
regex = ['(?m)(?:\A|^(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})\n)(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?: ↑↓(?: +|\n +)navigate(?: +|\n +)\S+(?: +|\n +)(?:select|save)(?: +|\n +)\S+(?: +|\n +)cancel| \S+(?: +|\n +)submit(?: +|\n +)\S+(?: +|\n +)cancel| \S+(?: +|\n +)submit(?: +|\n +)\S+(?: +|\n +)newline(?: +|\n +)\S+(?: +|\n +)cancel(?: +|\n +)\S+(?: +|\n +)external(?: +|\n +)editor| \(\S+(?: +|\n +)to(?: +|\n +)(?:cancel\)|cancel,(?: +|\n +)\S+(?: +|\n +)to(?: +|\n +)submit\))| Select provider(?: to (?:configure|logout):|[^\n]*\.\.\.))\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})(?:\n(?:[^─\n][^\n]*|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)){0,4}\z']

[[rules]]
id = "working_rule"
state = "working"
priority = 700
region = "whole_recent"
regex = ['(?m)^── [⠀-⣿][^\n]*\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})(?:\n(?:[^─\n][^\n]*|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)){1,4}\z']

[[rules]]
id = "idle_editor_rule"
state = "idle"
priority = 300
region = "whole_recent"
regex = ['(?m)^(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})(?:\n(?:[^─\n][^\n]*|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)){1,4}\z']
not = { regex = ['(?m)^(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?:(?: ?→ |› )[^\n]*\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*  [^ \n][^\n]*|  [^ \n][^\n]*\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?: ?→ |› )[^\n]*)\n(?:(?:(?:[^─\n][^\n]*)?|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)\n)*(?:─{20,}|─{4,} [↑↓] [^\n]*─{4,})(?:\n(?:[^─\n][^\n]*|─(?:[^─\n][^\n]*)?|──(?:[^─ \n][^\n]*| (?:[^⠀-⣿\n][^\n]*)?)?|─{3,3}(?:[^─\n][^\n]*)?|─{4,19}|─{4,}[^─ \n][^\n]*|─{4,} (?:[^↑↓\n][^\n]*|[↑↓](?:[^ \n][^\n]*| (?:[^\n]*[^─\n])?─{0,3})?)?)){1,4}\z'] }
