# Runtime descriptor of the Pi coding agent package.
#
# Verified against Pi 1.4.0 (compat/pi/compatibility-lock.json). The supported
# release range below is `[min, below)`; the CI check keeps it equal to the
# lock's range.

schema = 1
id = "pohunek.runtime.pi"
version = "1.0.5"
runtime_api = 1
requires = ["input-refuse-while-blocked-v1"]

[runtime]
id = "pi"
name = "Pi"
program = "pi"
args = []
detect_manifest = "detect.toml"
prompt_arg = true
# `pi --version` prints exactly the release on stdout; extension noise goes to
# stderr, which the probe discards.
version_probe = { parser = "semver-v1", args = ["--version"], min = "1.0.0", below = "2.0.0" }

# Pi enables bracketed paste in its terminal UI; the submit key is a separate
# Enter written after the paste.
[input]
bracketed_paste = true
submit_delay_ms = 150
text_policy = "unrestricted"
# Pi draws extension confirms, permission prompts and login steps in place of
# its editor, so plain text sent while the session reads blocked could answer a
# dialog the operator never saw. The dialog is answered in an attached terminal.
refuse_while_blocked = true
# Pi enables bracketed paste as soon as it starts, before it draws any screen,
# so the enable signal is not readiness: only the idle editor frame (detect rule
# `idle_editor_rule`) shows that its editor reads input.
ready = "screen_idle"

[resume]
supported = true
reference_kind = "id"
args = ["--session", "{reference}"]

[fork]
supported = true
args = ["--fork", "{reference}"]

# Pi creates the session with the id it is given (`--session-id`), so the
# daemon assigns the reference at launch and needs no integration. A fork gets
# a reference of its own the same way: `pi --fork <source> --session-id <fork>`
# writes the forked conversation at once as `<timestamp>_<fork>.jsonl`, and
# refuses an id that already names a session.
[native_reference]
strategy = "assigned"
launch_args = ["--session-id", "{reference}"]
assign_fork = true

# Pi writes `<agent dir>/sessions/--<encoded cwd>--/<timestamp>_<id>.jsonl`
# once the first assistant message exists. `--session` for an id with no such
# file fails to start, so recovery checks for the file first.
#
# Pi picks its session directory as `--session-dir`, else
# `PI_CODING_AGENT_SESSION_DIR`, else the `sessionDir` setting of the agent
# directory's `settings.json` or the project's `.pi/settings.json`, and keeps
# the files directly in it. The variable is read from the launch environment,
# so the check follows it (it must be absolute). A launch passing the flag is
# refused; so is one whose settings name a directory while the variable is
# unset, because Pi follows the variable over the settings.
[native_reference.existence]
check = "file"
root_env = "PI_CODING_AGENT_DIR"
root_home = ".pi/agent"
dir = "sessions"
file_name = "_{reference}.jsonl"
name_match = "ends_with"
max_depth = 1
store_env = "PI_CODING_AGENT_SESSION_DIR"
store_max_depth = 0
relocating_args = ["--session-dir"]
relocating_settings = [
  { base = "root", path = "settings.json", key = "sessionDir" },
  { base = "cwd", path = ".pi/settings.json", key = "sessionDir" },
]
