# Hermes Agent 0.20.0 activity manifest for both local terminal interfaces.

[process]
comm = ["^hermes$"]
cmdline = [
  '^(?:[^ ]*/)?hermes(?: .*)?$',
  '^(?:[^ ]*/)?(?:python|python3(?:\.\d+)?) -m hermes_cli(?:\.main)?(?: .*)?$',
  '^(?:[^ ]*/)?(?:python|python3(?:\.\d+)?) (?:[^ ]*/)?hermes_cli/main\.py(?: .*)?$',
]

# Startup failures leave the process at a visible terminal error that requires
# owner intervention. Keep these signatures specific to Hermes startup paths.
[[rules]]
id = "fatal_startup"
state = "blocked"
priority = 1000
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["Failed to initialize agent:"] },
  { contains = ["required API key(s) missing:"] },
]

# The prompt_toolkit approval panel remains visible until the owner selects a
# choice. Requiring both the title and a concrete choice avoids matching prose.
[[rules]]
id = "dangerous_command_approval"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(16)"
visible_blocker = true
contains = ["Dangerous Command", "Allow once", "Deny"]

# The alternate-screen Ink TUI renders a different heading but shares the
# concrete choices and remains visible until the owner selects one.
[[rules]]
id = "tui_approval"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(16)"
visible_blocker = true
contains = ["approval required", "Allow once", "Deny"]

# During a model turn the classic prompt changes from the idle arrow to the
# Hermes staff symbol, and an empty composer shows the interrupt placeholder
# after it (the compact layout drops the arrow, and a terminal of 28 to 54
# columns wraps the placeholder onto a second row, which the second pattern
# lists split point by split point). The prompt must be the last
# non-empty line apart from the rule chrome drawn below it: old transcript
# chrome that holds a staff prompt neither keeps the session working after the
# prompt returns to idle nor reads as a working frame while an idle redraw has
# erased and not yet reprinted the lines below it.
[[rules]]
id = "active_turn_prompt"
state = "working"
priority = 700
region = "bottom_non_empty_lines(8)"
any = [
  { regex = ['(?:\A|\n)[ \t]*⚕[ \t]+(?:(?:❯|>|\$|#|›|»|→)[ \t]*(?:msg=interrupt[^\n]*)?|msg=interrupt[^\n]*)(?:\n[ \t]*─+[ \t]*)*\z'] },
  { regex = ['(?:\A|\n)[ \t]*⚕[ \t]+(?:m[ \t]*\n[ \t]*sg=interrupt · /queue · /bg · /steer · Ctrl\+C cancel|ms[ \t]*\n[ \t]*g=interrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg[ \t]*\n[ \t]*=interrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=[ \t]*\n[ \t]*interrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=i[ \t]*\n[ \t]*nterrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=in[ \t]*\n[ \t]*terrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=int[ \t]*\n[ \t]*errupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=inte[ \t]*\n[ \t]*rrupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=inter[ \t]*\n[ \t]*rupt · /queue · /bg · /steer · Ctrl\+C cancel|msg=interr[ \t]*\n[ \t]*upt · /queue · /bg · /steer · Ctrl\+C cancel|msg=interru[ \t]*\n[ \t]*pt · /queue · /bg · /steer · Ctrl\+C cancel|msg=interrup[ \t]*\n[ \t]*t · /queue · /bg · /steer · Ctrl\+C cancel|msg=interrupt[ \t]*\n[ \t]*· /queue · /bg · /steer · Ctrl\+C cancel|msg=interrupt ·[ \t]*\n[ \t]*/queue · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /[ \t]*\n[ \t]*queue · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /q[ \t]*\n[ \t]*ueue · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /qu[ \t]*\n[ \t]*eue · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /que[ \t]*\n[ \t]*ue · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /queu[ \t]*\n[ \t]*e · /bg · /steer · Ctrl\+C cancel|msg=interrupt · /queue[ \t]*\n[ \t]*· /bg · /steer · Ctrl\+C cancel|msg=interrupt · /queue ·[ \t]*\n[ \t]*/bg · /steer · Ctrl\+C cancel|msg=interrupt · /queue · /[ \t]*\n[ \t]*bg · /steer · Ctrl\+C cancel|msg=interrupt · /queue · /b[ \t]*\n[ \t]*g · /steer · Ctrl\+C cancel|msg=interrupt · /queue · /bg[ \t]*\n[ \t]*· /steer · Ctrl\+C cancel|msg=interrupt · /queue · /bg ·[ \t]*\n[ \t]*/steer · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /[ \t]*\n[ \t]*steer · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /s[ \t]*\n[ \t]*teer · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /st[ \t]*\n[ \t]*eer · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /ste[ \t]*\n[ \t]*er · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /stee[ \t]*\n[ \t]*r · Ctrl\+C cancel|msg=interrupt · /queue · /bg · /steer[ \t]*\n[ \t]*· Ctrl\+C cancel|msg=interrupt · /queue · /bg · /steer ·[ \t]*\n[ \t]*Ctrl\+C cancel|msg=interrupt · /queue · /bg · /steer · C[ \t]*\n[ \t]*trl\+C cancel|msg=interrupt · /queue · /bg · /steer · Ct[ \t]*\n[ \t]*rl\+C cancel|msg=interrupt · /queue · /bg · /steer · Ctr[ \t]*\n[ \t]*l\+C cancel|msg=interrupt · /queue · /bg · /steer · Ctrl[ \t]*\n[ \t]*\+C cancel|msg=interrupt · /queue · /bg · /steer · Ctrl\+[ \t]*\n[ \t]*C cancel|msg=interrupt · /queue · /bg · /steer · Ctrl\+C[ \t]*\n[ \t]*cancel|msg=interrupt · /queue · /bg · /steer · Ctrl\+C c[ \t]*\n[ \t]*ancel|msg=interrupt · /queue · /bg · /steer · Ctrl\+C ca[ \t]*\n[ \t]*ncel|msg=interrupt · /queue · /bg · /steer · Ctrl\+C can[ \t]*\n[ \t]*cel|msg=interrupt · /queue · /bg · /steer · Ctrl\+C canc[ \t]*\n[ \t]*el|msg=interrupt · /queue · /bg · /steer · Ctrl\+C cance[ \t]*\n[ \t]*l)[ \t]*(?:\n[ \t]*─+[ \t]*)*\z'] },
]

# Reasoning and tool progress are painted immediately above the prompt while a
# turn is active. These bounded signatures cover narrow terminals where the
# prompt line itself is temporarily displaced.
[[rules]]
id = "active_turn_progress"
state = "working"
priority = 650
region = "bottom_non_empty_lines(8)"
any = [
  { line_regex = ['^\s*\[thinking\]\s+\S'] },
  { contains = ["◆ aggregating"] },
]

# The alternate-screen TUI replaces an empty composer hint while a turn runs.
[[rules]]
id = "tui_active_turn"
state = "working"
priority = 650
region = "bottom_non_empty_lines(8)"
contains = ["Ctrl+C to interrupt…"]

# The classic idle prompt is an arrow, optionally prefixed by the active Hermes
# profile name. It must lose to approval and working signatures above.
[[rules]]
id = "idle_prompt"
state = "idle"
priority = 300
region = "bottom_non_empty_lines(4)"
line_regex = ['^\s*(?:[A-Za-z0-9._-]+\s+)?(?:❯|>|\$|#|›|»|→)\s*$']

# The alternate-screen TUI pins its stable readiness state in the bottom rule.
[[rules]]
id = "tui_idle_status"
state = "idle"
priority = 300
region = "bottom_non_empty_lines(4)"
line_regex = ['^\s*─\s+ready(?:\s|│|$)']
