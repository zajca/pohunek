# Hermes Agent 0.20.0 package descriptor, preserving the core runtime contract.

schema = 1
id = "pohunek.runtime.hermes"
version = "1.0.4"
runtime_api = 1

[runtime]
id = "hermes"
name = "Hermes Agent"
program = "hermes"
args = ["chat"]
detect_manifest = "detect.toml"
version_probe = { parser = "semver-line-v1", args = ["--version"], min = "0.20.0", below = "1.0.0", line = "Hermes Agent v{version} {annotation}" }

[input]
bracketed_paste = true
submit_delay_ms = 150
text_policy = "hermes_safe_text"
# Hermes flushes the terminal's queued input while it starts, after a terminal
# query and before its prompt reads input, so input written earlier is lost:
# only the rendered idle prompt (detect rules `idle_prompt`, `tui_idle_status`)
# shows that it reads input.
ready = "screen_idle"
# A first start after install compiles every Python module before the prompt
# renders, which takes longer than a host's default startup grace; a host with a
# longer `input.initial_startup_grace_ms` waits that long instead.
startup_grace_ms = 30000

[resume]
supported = true
reference_kind = "id"
args = ["--resume", "{reference}"]

[fork]
supported = false

[native_reference]
strategy = "hook"

[integration]
handler = "hermes-hook-v1"
hook_schema = "identity-v1"
