# Claude Code activity manifest.
#
# Ported from herdr's Claude manifest into the daemon's M5 schema. Unsupported
# herdr fields (`visible_working`, `visible_idle`, `skip_state_update`) and
# `unknown` menu/transcript rules are intentionally omitted.

# The distribution binary is `claude`; the npm package installs the same
# executable as `bin/claude.exe`. The native installer runs the release image
# `<install root>/claude/versions/<release>`, matched by its command line (the
# kernel name is the release or `claude`, depending on how it was started). The command line is argv joined with spaces, so each pattern
# names the program at its start. Through
# `node` or `bun` the script follows the flag options and is named `claude`
# (also `.js`, `.mjs`, `.cjs`) or lies inside the `@anthropic-ai/claude-code`
# package; another script whose name merely contains the word `claude` is not
# Claude.
[process]
comm = ['^claude(\.exe)?$']
cmdline = [
  '^(\S*/)?claude(\.exe)?($| )',
  '^(\S*/)?claude/versions/[0-9]+\.[0-9]+\.[0-9]+($| )',
  '^(\S*/)?(node|bun)( -\S+)* (\S*/)?claude(\.[cm]?js)?($| )',
  '^(\S*/)?(node|bun)( -\S+)* \S*/@anthropic-ai/claude-code/\S',
]

# Claude Code reports its root state as OSC 7501 records once the session
# worker answers its `ESC ] 7501 ; ? ST` probe. The record outranks stale
# screen evidence; a visible dialog still wins (see the program-status layer in
# docs/architecture.md). Background agents report as `id=` records, which are
# ignored.
[program_status]
app = "claude-code"
answer_probe = true

# Claude Code 2.1.289 leads its title with `◐`/`◑`, alternating every 960 ms
# while a turn runs, and with `✳` while it waits. 2.1.309 sets the plain title
# `Claude Code` once the probe is answered, so this rule and `osc_title_idle`
# serve a Claude that sets state titles. The braille range is the working title
# of the herdr manifest this one is ported from.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
regex = ['^[\x{2800}-\x{28FF}\x{25D0}\x{25D1}] ']

# Live status spinner rendered above the prompt box while a turn runs, e.g.
# "✻ Noodling… (12s · ↓ 1.2k tokens)", "✻ Herding… (3s · thinking with high
# effort)" or a bare "* Jiving…" at the start of a turn. The line is one verb
# with an optional timer, or a longer message with an elapsed-time timer, so a
# transcript bullet such as "* Then it waits… (see below)" is not a spinner.
# The prompt box (`❯`) stays visible during work in current Claude Code TUIs, so without this rule every screen render matches `live_prompt_box`
# and the published activity flaps to idle between OSC title updates. Must
# outrank `live_prompt_box` (950) and stay below `live_blocked_form` (980).
# Dialog markers are excluded so a visible approval prompt keeps winning as
# blocked even if a stale spinner line is still on screen.
[[rules]]
id = "live_status_spinner"
state = "working"
priority = 960
region = "whole_recent"
line_regex = ['^[·✢✳✶✻✽*] (?:[\p{L}\x27’-]+…|\S[^…]*… \([0-9]+[smh]\b.*)$']
not = { any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
] }

# The footer below a running turn's prompt box reads `esc to interrupt`; a
# waiting prompt's footer reads `? for shortcuts`. A streaming reply hides the
# status line, so this footer is the screen's working evidence then. At 30
# columns and fewer the footer is cut before the hint and only the title
# speaks for the turn. Same priority and dialog exclusions as
# `live_status_spinner`.
[[rules]]
id = "live_turn_footer"
state = "working"
priority = 960
region = "after_last_horizontal_rule"
contains = ["esc to interrupt"]
not = { any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
] }

# Selection form footer, e.g. `Enter to select · ↑/↓ to navigate · Esc to
# cancel`. Narrow terminals wrap it between any two words, so words are
# separated by any whitespace, line breaks included.
[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = [
  '(?i)enter\s+to\s+select',
  '(?i)esc\s+to\s+cancel',
  '(?i)(arrow\s+keys|arrows|↑/↓|↑↓)\s+to\s+navigate',
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

# First-run and folder trust dialogs wait for a choice before Claude opens its
# prompt. Each rule requires the dialog's heading and its options; words are
# separated by any whitespace because narrow terminals wrap them. Claude draws
# these dialogs below every horizontal rule on screen (or with none visible),
# while a transcript that quotes them sits above the prompt box's rules.
[[rules]]
id = "theme_picker"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = [
  '(?i)choose\s+the\s+text\s+style',
  '(?i)\bdark\s+mode\b',
  '(?i)\blight\s+mode\b',
]

[[rules]]
id = "login_method_list"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = [
  '(?i)select\s+login\s+method',
  '(?i)claude\s+account\s+with\s+subscription',
  '(?i)anthropic\s+console\s+account',
]

[[rules]]
id = "folder_trust_dialog"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = [
  '(?i)yes,\s+i\s+trust\s+this\s+folder',
  '(?i)no,\s+exit',
  '(?i)enter\s+to\s+confirm',
]

[[rules]]
id = "api_key_approval_dialog"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = [
  '(?i)detected\s+a\s+custom\s+api\s+key',
  '(?i)use\s+this\s+api\s+key',
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
line_regex = ['^\s*❯']
not = { any = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
] }

# A completed turn leaves a status line immediately above the restored prompt
# box. This precise region confirms idle without scanning transcript history.
# Claude 2.1.x appends the local clock time the turn ended, e.g.
# `✻ Brewed for 7s · done 3:34 PM`; its format follows the host locale.
[[rules]]
id = "completed_turn_status"
state = "idle"
priority = 955
region = "last_non_empty_above_prompt_box"
line_regex = ['^[·✢✳✶✻✽*] \S.* for [0-9]+(?:\.[0-9]+)?s(?: · done [^·]+)?$']

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*yes\b'] },
    { line_regex = ['(?i)^\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
  ] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = { any = [
  { regex = ['(?m)^\s*❯\s*$'] },
] }

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
