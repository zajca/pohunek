# Runtime descriptor of the Claude Code package.
#
# Verified against Claude Code 2.1.289 (compat/claude/compatibility-lock.json).
# The supported release range below is `[min, below)`; the CI check keeps it
# equal to the lock's range.

schema = 1
id = "pohunek.runtime.claude"
version = "1.0.0"
runtime_api = 1

[runtime]
id = "claude"
name = "Claude Code"
program = "claude"
args = []
detect_manifest = "detect.toml"
prompt_arg = true
# `claude --version` prints `<release> (Claude Code)` on stdout.
version_probe = { parser = "semver-line-v1", args = ["--version"], min = "2.1.289", below = "2.2.0", line = "{version} (Claude Code)" }

# Claude's Ink TUI takes the pasted text and the submit key as separate
# writes; a submit delay the daemon is configured with for this runtime
# replaces `submit_delay_ms`.
[input]
bracketed_paste = false
submit_delay_ms = 150
submit_delay_configurable = true
text_policy = "unrestricted"

[resume]
supported = true
reference_kind = "id"
args = ["--resume", "{reference}"]

[fork]
supported = true
args = ["--resume", "{reference}", "--fork-session"]

# Claude chooses the conversation id itself; the SessionStart hook of the
# integration reports it. Recovery verifies the transcript file the report
# names exists before it launches: one project directory below `projects`.
[native_reference]
strategy = "hook"

[native_reference.existence]
check = "file"
root_env = "CLAUDE_CONFIG_DIR"
root_home = ".claude"
dir = "projects"
file_name = "{reference}.jsonl"
name_match = "exact"
max_depth = 1

[integration]
handler = "claude-hook-v1"
hook_schema = "identity-subagent-v1"

# Where Claude keeps its settings and hook registration: the variable it reads
# to relocate its home, else this directory below the user's home.
[config_home]
env = "CLAUDE_CONFIG_DIR"
default = ".claude"
