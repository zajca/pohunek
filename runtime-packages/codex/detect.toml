# Codex 0.164.0 activity manifest.
#
# Codex reports its state through the terminal title, so the idle, working and
# blocked rules read the title; the screen rules cover prompts that block the
# turn. The rules are verified against screens captured from a real Codex
# (compat/codex/screens/, terminal widths 20 to 200); the unverified and
# non-matching cases are listed in docs/knowledge/guides/codex-package.md.
#
# - osc_title_blocked: the title carries "Action Required" while a tool approval
#   or a question waits for the user.
# - osc_title_working: the title starts with a braille spinner followed by a
#   thread or project name while a turn runs. The title-generation placeholder
#   of an idle unnamed thread (`<spinner> | <project>`) is not a turn.
# - osc_title_idle: any other non-empty title means idle. Idle is read from the
#   absence of the spinner and of "Action Required", not from a title of its own.
# - folder_trust_prompt: the folder trust dialog Codex 0.160 shows for a
#   working directory with a project-local .codex/config.toml.
# - startup_update_prompt: the update popup Codex 0.160 draws over the screen
#   at startup when a newer release is available; its capture lives in
#   compat/codex/screens/update-popup/.
# - startup_login_prompt, startup_api_key_prompt and
#   startup_incompatible_settings_prompt: complete visible startup dialogs,
#   captured at 80/160 columns in compat/codex/screens/startup-dialogs/.
# - live_strong_blocker and weak_blocker: confirmation prompts on screen.
# - background_terminals_idle: Codex reports `working` through OSC 7501 while a
#   background terminal runs, with or without a turn. The footer `N background
#   terminal(s) running` without the turn's working row is not a turn, so this
#   rule reads idle over the record. Its priority is below `weak_blocker`, so a
#   release that writes no records (0.160.0 to 0.162.x) keeps its blockers.
#
# Codex 0.163.0 and later report their state through OSC 7501 (root records
# `state=<state>:app=codex`); older releases are read from the title and the
# screen alone. Codex starts a turn's MCP servers before the turn: the title
# spinner and the `Starting MCP servers` row read as working until startup
# ends, which does not release a prompt held by `manifest_idle`.

[program_status]
app = "codex"

[process]
comm = ["^codex$"]
cmdline = ['(^|/)codex($| )']

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
regex = ['^[\x{2800}-\x{28FF}] [^|\s]']

# The complete folder dialog can occupy 28 nonempty lines at 20 columns.
# Require its heading at the start of the bounded region, its question and
# both complete choices; whitespace can include captured terminal wrapping.
[[rules]]
id = "folder_trust_prompt"
state = "blocked"
priority = 1000
region = "top_non_empty_lines(32)"
visible_blocker = true
all = [
  { regex = ['(?i)\A\s*folder access\s*(?:\n|\z)'] },
  { regex = ['(?im)^\s*trust\s+this\s+folder\?'] },
  { regex = ['(?im)^\s*(?:›|❯)?\s*1\.\s*trust\s+and\s+continue\s*$'] },
  { regex = ['(?im)^\s*(?:›|❯)?\s*2\.\s*back\s+to\s+agent\s+command\s+center\s*$'] },
]

# These first-run surfaces set no title. Full headings and choices/hints
# distinguish the captured 80/160-column dialogs from transcript mentions.
[[rules]]
id = "startup_login_prompt"
state = "blocked"
priority = 1000
region = "top_non_empty_lines(16)"
visible_blocker = true
all = [
  { regex = ["(?i)\\A\\s*welcome to codex, openai's command-line coding agent\\s*(?:\\n|\\z)"] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*1\.\s*sign in with chatgpt\s*$'] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*2\.\s*sign in with device code\s*$'] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*3\.\s*provide your own api key\s*$'] },
  { line_regex = ['(?i)^\s*press enter to continue\s*$'] },
]

[[rules]]
id = "startup_api_key_prompt"
state = "blocked"
priority = 1000
region = "top_non_empty_lines(16)"
visible_blocker = true
all = [
  { regex = ["(?i)\\A\\s*welcome to codex, openai's command-line coding agent\\s*(?:\\n|\\z)"] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*use your own openai api key for usage-based billing\s*$'] },
  { line_regex = ['(?i)^\s*paste or type your api key below\. it will be stored locally in auth\.json\.\s*$'] },
  { line_regex = ['(?i)^\s*╭api key─+╮\s*$'] },
  { line_regex = ['(?i)^\s*press enter to save\s*$'] },
  { line_regex = ['(?i)^\s*press esc to go back\s*$'] },
]

[[rules]]
id = "startup_incompatible_settings_prompt"
state = "blocked"
priority = 1000
region = "top_non_empty_lines(16)"
visible_blocker = true
all = [
  { regex = ['(?i)\A\s*background server has incompatible feature settings\s*(?:\n|\z)'] },
  { line_regex = ['(?i)^\s*restart will use these shared feature settings:\s*$'] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*1\.\s*run without daemon this time\s*$'] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*2\.\s*restart with these settings\s*$'] },
  { line_regex = ['(?i)^\s*(?:>|›|❯)?\s*3\.\s*cancel\s*$'] },
]

# The startup update popup covers the whole screen while Codex checks for a
# newer release at startup (measured at 80, 100 and 160 columns; captures in
# compat/codex/screens/update-popup/). The popup sets no terminal title, and a
# title set before it — or after it — stays idle-looking, so this screen rule
# must outrank the title's idle evidence: the prompt a `manifest_idle` runtime
# writes is only released when the winning evidence is idle, and this blocker
# wins while the popup holds. Requiring the heading and all three choices
# keeps transcript prose that merely discusses an update from reading as the
# popup; the `(runs npm install ...)` suffix of the first choice may wrap at
# narrow widths, so only its head is matched.
[[rules]]
id = "startup_update_prompt"
state = "blocked"
priority = 1000
region = "top_non_empty_lines(16)"
visible_blocker = true
all = [
  { line_regex = ['(?i)^\s*update available\b'] },
  { line_regex = ['(?i)^\s*(?:›|❯)?\s*1\.\s*update now\b'] },
  { line_regex = ['(?i)^\s*(?:›|❯)?\s*2\.\s*skip\s*$'] },
  { line_regex = ['(?i)^\s*(?:›|❯)?\s*3\.\s*skip until next version\s*$'] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

# The footer of a background terminal is a line of its own below the transcript;
# the working row of a running turn carries the same words after its interrupt
# hint, so the row's elapsed-time group tells a turn from a background-only
# state. The footer is truncated, not wrapped, at narrow widths: `1 background
# termi` is the shortest captured form.
[[rules]]
id = "background_terminals_idle"
state = "idle"
priority = 650
region = "bottom_non_empty_lines(8)"
overrides_program_status = true
line_regex = ['^\s*\d+ background term']
not = { regex = ['\((?:\d+h \d{2}m \d{2}s|\d+m \d{2}s|\d+s) • (?:[^()]*to interr|esc)'] }

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
regex = ['\S']
not = { any = [
  { regex = ['^[\x{2800}-\x{28FF}]'] },
  { contains = ["Action Required"] },
] }
