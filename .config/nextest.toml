[profile.default]
# Nextest replaces the libtest RUST_TEST_THREADS knob with process-level
# parallelism. Keep the default profile conservative; the ci/local profiles
# below scale with available cores.
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Fast job (fmt/clippy/unit) uses full cores. The integration job overrides
# this on the command line (NEXTEST_TEST_THREADS=4) to preserve the original
# RUST_TEST_THREADS=4 bound for PTY/Postgres fixture tests.
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
retries = 2

[profile.ci.junit]
path = "junit.xml"

[profile.local]
# Local interactive loop: full core count, tighter slow-test signal.
test-threads = "num-cpus"
slow-timeout = { period = "30s" }
