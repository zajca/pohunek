# `flaky-result` (profile.default below) was introduced in this version; older
# nextest would reject the key, so this also covers profile inheritance (0.9.115).
nextest-version = { required = "0.9.131" }

[profile.default]
# Process-level parallelism; keep full-suite and heavy local runs bounded.
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 3 }
# Flaky-test policy, inherited by every profile: a test that fails and then
# passes on a retry is reported as FLAKY and still fails the run (and stays a
# <failure> in JUnit). Retries only tell "fails every time" apart from "fails
# sometimes"; they never turn a failure green. A FLAKY result means a bug
# issue with the root cause. A per-test `flaky-result = "pass"` override needs
# a linked issue and a reason next to it (see
# .agents/instructions/verification.md, "Flaky tests").
flaky-result = "fail"

# A worker confirms a forced output close by sweeping the whole same-user
# process table, and on Linux it cannot exclude a process whose environment is
# hidden (non-dumpable) and that started after the worker. The tests below either
# start such a long-lived process or need that confirmation to succeed, so they
# never run beside each other. This group keeps them apart within one run; each
# of them also holds `pohunek_test_support::host_lock::UNREADABLE_HOLDERS`, which
# keeps them apart across separate runs of the same user on one host. A new test
# of either kind joins this group and takes that lock.
[test-groups]
unreadable-holders = { max-threads = 1 }
# Tests that drive the real launchd `gui/<uid>` domain (bootstrap, bootout,
# kickstart) share one domain per login session, so they run one at a time.
# Used by profile.macos only; see its overrides below.
launchd-gui = { max-threads = 1 }
# The PTY scenarios of xtask's `hermes::tests` take turns on the module's
# in-process `PTY_SCENARIOS` mutex, which a process per test cannot share.
# Used by profile.macos only; see its overrides below.
hermes-pty = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
(package(=pohunek-daemon) and binary(=forced_close_stop))
or (package(=pohunek-session-worker) and test(=server::tests::escaped_pty_holder_ends_with_the_exit_and_the_exact_final_output_offset))
or (package(=pohunek-cli) and binary(=claude_package) and test(=a_session_removal_ignores_an_unreadable_process_of_the_test_host))
or (package(=pohunek-cli) and binary(=claude_package) and test(=the_child_guard_terminates_a_non_dumpable_helper_when_the_test_unwinds))
'''
test-group = 'unreadable-holders'

[profile.default.archive]
# Daemon tests spawn the real durable worker from the profile
# directory of their own test binaries (`target/debug/pohunek-sessiond`), and
# nothing in a nextest build guarantees that binary is produced. An archive without it is a build error, never a
# run where those tests find no worker.
include = [
  { path = "debug/pohunek-sessiond", relative-to = "target", depth = 0, on-missing = "error" },
]

[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
# No retries: `ci` and the fast shards that run under it are deterministic
# (no PTYs, real sockets, or databases), so a single failure is the signal.

[profile.ci.junit]
path = "junit.xml"

[profile.local]
# Unfiltered full suite; unlike fast, this needs worker and database fixtures.
test-threads = "num-cpus"
slow-timeout = { period = "30s" }

# Cost boundary shared by local aliases and scripts/test-partitions. Whole
# fixture-owning modules stay heavy, including future tests added within them.
# Ordinary file, mock-socket, and short CLI integration tests remain fast.
[profile.fast]
inherits = "ci"
# No retries (inherited from ci): fast tests own no timing-sensitive fixture,
# so any intermittent failure here is a bug to fix, not to retry.
default-filter = '''
not (
  (package(=pohunek-daemon) and
    (kind(test) or test(/^(api::handler::tests::|session::|runtime::client::|governance::owner_path_tests::|capabilities::|external::)/)))
  or (package(=pohunek-session-worker) and (kind(test) or test(/^(pty|server)::/)))
  or (package(=pohunek-relay) and
    (kind(test) or test(/^(admission::|auth::service::|auth::parent_integrity_tests::|authorization::admin_tests::|lifecycle::|runtime::|server::credential_router_tests::|operator::)/)))
  or (package(=pohunek-cli) and
    (test(/^hermes_integration::/) or binary(/^hermes_/) or binary(=session_process_api) or binary(=plugin_catalog_install) or binary(=doctor_worker_compat) or binary(=session_background) or binary(=session_background_work)))
  or (package(=pohunek-client) and binary(=netbird_cancellation))
  or (package(=pohunek-platform) and
    test(/^(shell_env::test_support::tests::|filesystem::tests::a_dropped_lock_is_free_while_|test_spawn::)/))
  or (package(=pohunek-test-support) and
    test(=fs::tests::a_fresh_executable_runs_while_sibling_threads_keep_spawning))
  or (package(=xtask) and (test(/^hermes(::|_mock::)/) or kind(test)))
)
'''

[profile.heavy]
inherits = "ci"
test-threads = 4
# PTY, real-socket, and worker-process tests are timing-sensitive. Retries
# classify a failure as FLAKY or persistent for diagnosis; flaky-result =
# "fail" (profile.default) keeps a FLAKY test failing the run. The fixed delay
# lets a transient resource (port, PTY, child process teardown) settle.
retries = { backoff = "fixed", count = 2, delay = "1s" }
# The heavy filter is the exact complement of profile.fast, supplied by
# scripts/test-partitions. Keep `ci` and `local` unfiltered full-suite profiles.

[profile.relay-db]
inherits = "ci"
# Relay PostgreSQL tests each open dedicated schema-scoped pools; unbounded
# num-cpus concurrency exhausts the fixture server's connection limit.
test-threads = 4
# Same diagnostic-only retry policy as profile.heavy: a FLAKY PostgreSQL test
# still fails the run through flaky-result = "fail" (profile.default).
retries = { backoff = "fixed", count = 2, delay = "1s" }

[profile.relay-db.junit]
path = "junit.xml"

# Runtime package jobs of ci.yml (`pi-package`, `codex-package`,
# `claude-package`, `hermes-package`): one `<runtime>_package` test binary with
# its ignored real-upstream tests, which drive a real runtime through PTYs, a
# real daemon and a session worker.
[profile.package]
inherits = "default"
# One test at a time: the test daemons observe the host's process table, so a
# concurrent test's real runtime and workers would be in each other's view.
test-threads = 1
# A failure still runs the remaining tests, so the report times every test.
fail-fast = false
# No retries: a real-upstream failure is a behavior change of the locked
# release or a bug, never something to retry away.
retries = 0
# A hung test is killed after 3 minutes and reported as a TIMEOUT in the JUnit
# report. The termination stays above the `HANG_GUARD` of
# crates/test-support/src/wait.rs, so a hung readiness wait fails with a
# message naming what it awaited before nextest kills the test. Measured on the
# locked releases: the slowest real-upstream test takes 21 s on a warm local
# host (claude_package), and the whole CI test step, compile included, took
# 96-98 s in the claude-package job (ci.yml runs of 2026-10-12). If all 10
# real-Claude tests hung, they would take 30 minutes plus nextest's kill grace
# period, leaving the rest of the claude-package job's 40-minute timeout (which
# cancels a job before nextest writes its report) to setup, about 2 minutes
# with a warm build cache; the other package jobs keep 30 minutes for fewer
# real-upstream tests.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.package.junit]
path = "junit.xml"

# The macOS lane: one `cargo nextest archive --profile macos` and one run from
# that archive per job (scripts/test-partitions run-macos and check-macos).
# Settings below live here, not under profile.default, so Linux runs are
# unchanged.
[profile.macos]
inherits = "ci"
junit.path = "junit.xml"
# Many lane tests wait on timeouts rather than use CPU, so 5 slots on the
# 3-vCPU hosted runner fill those waits. Measured on macos-15, 5 threads match
# 6 in wall time (~450 s).
test-threads = 5
# A FLAKY result is classified and still fails the run (flaky-result =
# "fail", inherited from profile.default). The retries only tell a failure
# that happens every time from one that happens sometimes, for diagnosis.
retries = { backoff = "fixed", count = 2, delay = "1s" }

# The deadline tests of this binary (worker connect 2 s, worker initialize
# 8 s, stale-job initialize 5 s) expect the host to answer within their
# bound, so no other test may share the CPU while one runs.
[[profile.macos.overrides]]
filter = 'package(=pohunek-daemon) and binary(=supervised_lifecycle)'
threads-required = "num-test-threads"

# The session worker's resource test prints its measurements on success.
# They are shown in the log without --nocapture and kept in the JUnit report,
# which stores no success output unless asked to.
[[profile.macos.overrides]]
filter = 'package(=pohunek-session-worker) and binary(=resources)'
success-output = "immediate"
junit.store-success-output = true

# A host probe test waits on child processes such as `launchctl print
# gui/<uid>`. A wedged one is killed after 15 minutes, so it fails with a
# TIMEOUT instead of holding the runner until the job timeout.
[[profile.macos.overrides]]
filter = 'package(=pohunek-hostcheck)'
slow-timeout = { period = "60s", terminate-after = 15 }

# Tests that bootstrap, bootout or kickstart jobs in the shared `gui/<uid>`
# domain. workflow_store boots out labels on macOS in one of its tests.
[[profile.macos.overrides]]
filter = '''
(package(=pohunek-platform) and binary(=launchd))
or (package(=pohunek-daemon) and binary(=supervised_lifecycle))
or (package(=pohunek-cli) and (
  binary(=service_launchd) or binary(=service_upgrade) or binary(=setup_host_native)
  or binary(=workflow_launchd) or binary(=workflow_store)))
'''
test-group = 'launchd-gui'

# Every test of the module joins the group, since any of them may take the
# module's private mutex; its non-PTY tests run in milliseconds.
[[profile.macos.overrides]]
filter = 'package(=xtask) and test(/^hermes::tests::/)'
test-group = 'hermes-pty'
