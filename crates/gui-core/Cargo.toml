[package]
name = "pohunek-gui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure state and SDK bridge logic for the pohunek native GUI."

[dependencies]
base64 = { workspace = true }
futures = { workspace = true }
pohunek-assistant = { workspace = true }
pohunek-client = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-prompt = { workspace = true }
pohunek-protocol = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pohunek-daemon = { workspace = true }
pohunek-test-support = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# Same major version as the one keyring links: `credential_store` downcasts
# keyring's boxed `security_framework::base::Error` to read the OSStatus code.
security-framework = "3"
