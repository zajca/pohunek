[package]
name = "pohunek-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test-only helpers: fixture roots that satisfy the trusted filesystem and Unix socket limits, a hermetic per-test environment, runtime resolution of test binaries, manifests and the session worker, and readiness waits bounded by one hang-guard ceiling."
publish = false

[dependencies]
tempfile.workspace = true
# `workers` signals leaked worker processes through pidfds (`process`).
rustix = { workspace = true, features = ["process"] }
# The async waits use `tokio::time` and `TestEnv::tokio_command` returns a
# `tokio::process::Command`; the workspace spec already enables every
# feature the other crates use, so this adds no build weight to a workspace build.
tokio.workspace = true

[dev-dependencies]
# `test-util` provides the paused clock the async wait tests run under.
tokio = { workspace = true, features = ["test-util"] }
# Parses `.config/nextest.toml` to check the hang guard against `terminate-after`.
toml = { workspace = true }

[lints]
workspace = true
