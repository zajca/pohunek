[package]
name = "pohunek-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek terminal screen model: vt100-backed grid scraping and an attach compositor."

[features]
# The default screen model of this slice is vt100; P3 of issue #2538 flips
# this to ["libghostty"]. vt100 is always compiled: the compositor and the
# daemon's screen tracker still use it. The fallback build is
# `--no-default-features`: no Zig, no C library.
default = []
# Runs libghostty-vt as the `TerminalTracker` backend through
# pohunek-terminal-ghostty-sys, the crate that owns the unsafe FFI.
libghostty = ["dep:pohunek-terminal-ghostty-sys", "pohunek-terminal-ghostty-sys/libghostty"]

[dependencies]
base64 = { workspace = true }
pohunek-terminal-ghostty-sys = { workspace = true, optional = true }
serde = { workspace = true }
unicode-width = { workspace = true }
vt100 = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
pohunek-test-support = { workspace = true }

[lints]
workspace = true
