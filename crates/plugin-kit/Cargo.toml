[package]
name = "pohunek-plugin-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owner-side plugin kit: lint, build, verify, detect-check, smoke and prove for plugin repositories."

[[bin]]
name = "pohunek-plugin-kit"
path = "src/main.rs"

[lib]
name = "plugin_kit"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
nix = { workspace = true }
pohunek-daemon = { path = "../daemon" }
pohunek-package = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-protocol = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pohunek-test-support = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
