[package]
name = "pohunek-plugin-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owner-side plugin kit: lint, build, verify, detect-check, smoke and prove for plugin repositories."

[[bin]]
name = "pohunek-plugin-kit"
path = "src/main.rs"
required-features = ["daemon"]

[lib]
name = "plugin_kit"
path = "src/lib.rs"

[features]
# The daemon-backed loaders `lint` and `detect-check` run through: only this
# feature pulls `pohunek-daemon`, so the `xtask` library build stays
# daemon-free. The kit binary enables it by default; `xtask` disables
# default features on its kit dependency.
# `default-features = false` so the kit's `daemon` feature forwards the
# daemon's default screen model itself and `cargo build -p pohunek-plugin-kit
# --no-default-features` never links the library (issue #2538 P3b).
# `libghostty` is its own switch (not hard-wired into `daemon`): the default
# product links the library, `--no-default-features --features daemon` is the
# vt100 kit, and dropping `"libghostty"` from `default` rolls the kit back
# (the sixth line of the rollback, issue #2538 P3b round 3).
default = ["daemon", "libghostty"]
daemon = ["dep:pohunek-daemon"]
libghostty = ["pohunek-daemon?/libghostty"]

[dependencies]
clap = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
nix = { workspace = true, features = ["process", "signal"] }
pohunek-daemon = { path = "../daemon", optional = true, default-features = false }
pohunek-package = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-protocol = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pohunek-test-support = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
