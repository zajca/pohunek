[package]
name = "pohunek-package"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Canonical runtime package archive format, safe extraction, per-file verification and the content-addressed registry store for pohunek."

[lib]
name = "package"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { workspace = true }
pohunek-protocol = { workspace = true }
ruzstd = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Extraction and the registry use descriptor-relative filesystem primitives that
# exist on Unix only.
[target.'cfg(unix)'.dependencies]
pohunek-platform = { workspace = true }

[dev-dependencies]
ruzstd = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
pohunek-test-support = { workspace = true }
rustix = { workspace = true, features = ["process"] }
tempfile = { workspace = true }

[lints]
workspace = true
