[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Workspace automation for pohunek."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { workspace = true }
knowledge = { workspace = true }
cli = { workspace = true }
pohunek-package = { workspace = true }
pohunek-platform = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-relay-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
httparse = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
clap = { workspace = true }
pulldown-cmark = { workspace = true }
nix = { workspace = true, features = ["process", "signal"] }
portable-pty = { workspace = true }
tempfile = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
toml = { workspace = true }
vt100 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
pohunek-test-support = { workspace = true }

[lints]
workspace = true
