# Built-in runtime descriptor for Claude Code, in the runtime.toml shape.
#
# `detect_manifest` names an activity manifest embedded in the daemon.
# Claude's Ink TUI needs the submit written separately, and a submit delay
# the daemon is configured with for this runtime replaces `submit_delay_ms`.

schema = 1
id = "pohunek.runtime.claude"
version = "1.0.0"
runtime_api = 1

[runtime]
id = "claude"
name = "Claude Code"
program = "claude"
args = []
detect_manifest = "claude"
prompt_arg = true

[input]
bracketed_paste = false
submit_delay_ms = 150
submit_delay_configurable = true
text_policy = "unrestricted"

[resume]
supported = true
reference_kind = "id"
args = ["--resume", "{reference}"]

[fork]
supported = true
args = ["--resume", "{reference}", "--fork-session"]

[native_reference]
strategy = "hook"

# A Claude conversation is named by its session id and stored as one transcript
# file one project directory below `projects` in the config home.
[native_reference.existence]
check = "file"
root_env = "CLAUDE_CONFIG_DIR"
root_home = ".claude"
dir = "projects"
file_name = "{reference}.jsonl"
name_match = "exact"
max_depth = 1

[integration]
handler = "claude-hook-v1"
hook_schema = "identity-subagent-v1"

# Where Claude keeps its settings and hook registration: the variable it reads
# to relocate its home, else this directory below the user's home.
[config_home]
env = "CLAUDE_CONFIG_DIR"
default = ".claude"
