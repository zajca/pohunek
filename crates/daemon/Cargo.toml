[package]
name = "pohunek-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek host daemon: owns PTYs and serves the control protocol."

[[bin]]
name = "pohunekd"
path = "src/main.rs"

[dependencies]
pohunek-knowledge = { workspace = true, features = ["protocol"] }
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-terminal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
portable-pty = { workspace = true }

[lints]
workspace = true
