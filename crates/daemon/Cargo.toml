[package]
name = "pohunek-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek host daemon: owns PTYs and serves the control protocol."

[[bin]]
name = "pohunekd"
path = "src/main.rs"

[dependencies]
pohunek-knowledge = { workspace = true, features = ["protocol"] }
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
pohunek-terminal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
# `time` adds DelayQueue for the attention debounce coordinator; `codec` comes
# from the workspace default and drives the control-socket line framing.
tokio-util = { workspace = true, features = ["time"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
portable-pty = { workspace = true }

[dev-dependencies]
# `test-util` enables tokio's paused clock (`start_paused`) so the attention
# debounce coordinator tests advance time deterministically instead of sleeping.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
