[package]
name = "pohunek-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek host daemon: owns PTYs and serves the control protocol."

[[bin]]
name = "pohunekd"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
pohunek-knowledge = { workspace = true, features = ["protocol"] }
pohunek-hostcheck = { workspace = true }
pohunek-logging = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
pohunek-platform = { workspace = true }
overlay = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-service-config = { workspace = true }
pohunek-terminal = { workspace = true }
pohunek-client = { workspace = true }
pohunek-worker-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
# `time` adds DelayQueue for the notification debounce coordinator, `rt` adds the
# TaskTracker that drains in-flight session creates at shutdown; `codec` comes
# from the workspace default and drives the control-socket line framing.
tokio-util = { workspace = true, features = ["rt", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
time = { workspace = true }
ulid = { workspace = true }
zeroize = { workspace = true }

# FSEvents backend for live transcript watching on macOS. Default features are
# disabled so only the FSEvents backend is compiled in (no kqueue/mio fallback).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
pohunek-session-worker = { workspace = true }
# `test-util` enables tokio's paused clock (`start_paused`) so the attention
# debounce coordinator tests advance time deterministically instead of sleeping.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
pohunek-test-support = { workspace = true }
wait-timeout = "0.2"

[lints]
workspace = true
