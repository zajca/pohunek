[package]
name = "pohunek-session-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Durable per-session PTY worker for pohunek."

[lib]
name = "pohunek_session_worker"
path = "src/lib.rs"

[[bin]]
name = "pohunek-sessiond"
path = "src/main.rs"

[dependencies]
pohunek-logging = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-terminal = { workspace = true }
pohunek-worker-protocol = { path = "../worker-protocol" }
libc = { workspace = true }
nix = { version = "0.29", features = ["process", "signal", "socket", "user"] }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
