[package]
name = "pohunek-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek CLI: controls the host daemon over the local control protocol."

[[bin]]
name = "pohunek"
path = "src/main.rs"

[features]
default = ["embed-agent-skill"]
# xtask builds this crate without the feature so `cargo xtask agent-skill
# generate` stays runnable even while the generated artifact itself is
# missing or damaged; every binary build embeds the checked-in artifact.
embed-agent-skill = []

[dependencies]
pohunek-relay-client.workspace = true
pohunek-relay-protocol.workspace = true
reqwest.workspace = true
uuid.workspace = true
zeroize.workspace = true
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-platform = { workspace = true }
pohunek-service-config = { workspace = true }
pohunek-session-worker = { workspace = true }
pohunek-worker-protocol = { workspace = true }
pohunek-client = { workspace = true }
pohunek-prompt = { workspace = true }
pohunek-terminal = { workspace = true }
pohunek-gui-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
pohunek-test-support.workspace = true
overlay = { workspace = true }
pohunek-logging = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
