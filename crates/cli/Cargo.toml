[package]
name = "pohunek-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek CLI: controls the host daemon over the local control protocol."

[[bin]]
name = "pohunek"
path = "src/main.rs"

[dependencies]
pohunek-protocol = { path = "../protocol" }
pohunek-netbird = { path = "../netbird" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Exercise the host-aware target parser without a running daemon.
