[package]
name = "zagentmesh-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "zagentmesh CLI: controls the host daemon over the local control protocol."

[[bin]]
name = "zagentmesh"
path = "src/main.rs"

[dependencies]
zagentmesh-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# Exercise the host-aware target parser without a running daemon.
