[package]
name = "pohunek-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek CLI: controls the host daemon over the local control protocol."

[[bin]]
name = "pohunek"
path = "src/main.rs"

[dependencies]
pohunek-knowledge = { workspace = true, features = ["protocol"] }
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Exercise the host-aware target parser without a running daemon.

[lints]
workspace = true
