[package]
name = "pohunek-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek CLI: controls the host daemon over the local control protocol."
# The integration tests are listed below, so no file under tests/ becomes a
# test binary of its own by accident.
autotests = false

[[bin]]
name = "pohunek"
path = "src/main.rs"

[features]
default = ["embed-agent-skill"]
# xtask builds this crate without the feature so `cargo xtask agent-skill
# generate` stays runnable even while the generated artifact itself is
# missing or damaged; every binary build embeds the checked-in artifact.
embed-agent-skill = []
# Test-only seams of the `pohunek service` engine (M-TEST-UTIL); never enabled
# by a release build.
test-util = []

[dependencies]
pohunek-relay-client.workspace = true
pohunek-relay-protocol.workspace = true
reqwest.workspace = true
uuid.workspace = true
zeroize.workspace = true
semver = { workspace = true }
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-package = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-platform = { workspace = true }
pohunek-service-config = { workspace = true }
pohunek-session-worker = { workspace = true }
pohunek-worker-protocol = { workspace = true }
pohunek-client = { workspace = true }
pohunek-prompt = { workspace = true }
pohunek-terminal = { workspace = true }
pohunek-assistant = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "term"] }
tracing = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
# Run identifiers of workflow plugin runs (`pohunek workflow run`).
ulid = { workspace = true }
# The bounded per-plugin run log of workflow plugin runs.
pohunek-logging = { workspace = true }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "release_consumer"
path = "tests/release_consumer.rs"

[[test]]
name = "release_upgrade"
path = "tests/release_upgrade.rs"

[dev-dependencies]
# Enables `test-util` for this package's own integration tests.
pohunek-cli = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# `attach_stream_input.rs` shrinks the CLI's stdout pipe and counts its queued bytes.
rustix = { workspace = true, features = ["pipe"] }
portable-pty = { workspace = true }
overlay = { workspace = true }
pohunek-test-support = { workspace = true, features = ["catalog"] }
# `plugin_daemon.rs` serves the real package lifecycle from an in-process daemon.
pohunek-daemon = { path = "../daemon" }
# `host_pin_assistant.rs` answers `assistant.materialize` with the bundle identity
# the assistant verifies.
pohunek-knowledge = { workspace = true }
# `plugin_catalog_install.rs` signs catalogs with a key generated in the test.
ed25519-dalek = { workspace = true }
# `release_upgrade.rs` reads the previous release's archive, whose frame the
# current encoder does not reproduce, without the strict canonical reader.
ruzstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
