[package]
name = "pohunek-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "pohunek CLI: controls the host daemon over the local control protocol."

[[bin]]
name = "pohunek"
path = "src/main.rs"

[dependencies]
pohunek-hostcheck = { workspace = true }
pohunek-protocol = { workspace = true }
pohunek-netbird = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-client = { workspace = true }
pohunek-prompt = { workspace = true }
pohunek-terminal = { workspace = true }
pohunek-gui-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
