[package]
name = "pohunek-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared control-protocol envelopes and version negotiation for pohunek."

[lib]
name = "protocol"
path = "src/lib.rs"

[features]
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "format"] }

[lints]
workspace = true
