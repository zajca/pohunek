[package]
name = "pohunek-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Iced control-plane GUI for pohunek."

[[bin]]
name = "pohunek-gui"
path = "src/main.rs"

[dependencies]
futures = { workspace = true }
iced = { workspace = true, default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    # The Linux theme subscription reaches zbus, which is configured for Tokio
    # elsewhere in this workspace. Its executor must provide a Tokio reactor.
    "tokio",
    "linux-theme-detection",
    "wayland",
] }
pohunek-gui-core = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
