[package]
name = "pohunek-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Iced control-plane GUI for pohunek."

[[bin]]
name = "pohunek-gui"
path = "src/main.rs"

[dependencies]
futures = { workspace = true }
iced = { workspace = true, default-features = false, features = [
    "advanced",
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
] }
pohunek-gui-core = { workspace = true }
pohunek-paths = { workspace = true }
pohunek-protocol = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, default-features = false, features = [
    "linux-theme-detection",
    "wayland",
] }
