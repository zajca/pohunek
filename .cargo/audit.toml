[advisories]
ignore = [
    # rsa 0.9.10 is reachable only through the reviewed openidconnect 4.0.1
    # dependency. The relay performs public-key signature verification, never
    # private RSA signing/decryption affected by this timing side channel.
    # .clippy.toml bans private RSA APIs; xtask's dependency_policy test pins the
    # reviewed upstream checksums and rejects any new rsa dependency parent.
    # Reassess/remove this exception when upstream provides a fixed version.
    "RUSTSEC-2023-0071",
    # quick-xml is only pulled through the wayland-scanner proc-macro, which parses
    # trusted Wayland protocol XML at build time. Remove these ignores once
    # wayland-scanner accepts quick-xml >= 0.41.0.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
