[alias]
xtask = "run -p xtask --"
# Fast local loops (P0 test-performance): nextest profiles live in
# `.config/nextest.toml`. `t` is the sub-minute unit loop, `ti` covers the
# daemon/client surface, `tw` is the full pre-push mirror of CI.
t = "nextest run --profile local --workspace --all-features --lib"
ti = "nextest run --profile local -p pohunek-daemon -p pohunek-client -p pohunek-session-worker --all-features"
tw = "nextest run --profile local --workspace --all-features"
