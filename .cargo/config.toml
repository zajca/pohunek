[alias]
xtask = "run -p xtask --"
# Cost-aware fast loop, including fast integration tests. Omit --workspace so
# callers can narrow it with -p. Full/heavy runs need the documented fixtures.
t = "nextest run --profile fast --all-features"
ti = "nextest run --profile fast -p pohunek-daemon -p pohunek-client -p pohunek-session-worker --all-features"
# The local gate thread count (see the gates skill for the current number).
tw = "nextest run --profile local --all-features"
# `cargo t` narrowed to the packages the current change affects plus their
# dependents; unmapped or workspace-wide changes still run everything.
ta = "xtask affected"
