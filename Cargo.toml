# pohunek Cargo workspace.
#
# Single-user, CLI-first tool: durable per-session workers own PTYs running
# coding agents; a daemon controls them and serves a local newline-delimited
# JSON API to clients.
#
# Layout and crate choices are summarized in AGENTS.md and the architecture
# documents under docs/.
[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/knowledge",
    "crates/hostcheck",
    "crates/logging",
    "crates/paths",
    "crates/xtask",
    "crates/netbird",
    "crates/prompt",
    "crates/terminal",
    "crates/worker-protocol",
    "crates/session-worker",
    "crates/client",
    "crates/gui-core",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
]

# Shared dependency versions. Individual crates opt in via `workspace = true`.
# Crates shared across implemented milestones and current state-engine work are
# declared here as individual crates opt in.
[workspace.dependencies]
cli = { package = "pohunek-cli", path = "crates/cli" }
knowledge = { package = "pohunek-knowledge", path = "crates/knowledge" }
pohunek-cli = { path = "crates/cli" }
pohunek-client = { path = "crates/client" }
pohunek-daemon = { path = "crates/daemon" }
pohunek-gui-core = { path = "crates/gui-core" }
pohunek-hostcheck = { path = "crates/hostcheck" }
pohunek-knowledge = { path = "crates/knowledge" }
pohunek-logging = { path = "crates/logging" }
pohunek-netbird = { path = "crates/netbird" }
pohunek-paths = { path = "crates/paths" }
pohunek-prompt = { path = "crates/prompt" }
pohunek-protocol = { path = "crates/protocol" }
pohunek-terminal = { path = "crates/terminal" }
pohunek-worker-protocol = { path = "crates/worker-protocol" }
pohunek-session-worker = { path = "crates/session-worker" }
iced = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
include_dir = "0.7"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
# Advisory file locking (flock) and socket-mode chmod for the single-instance
# lock and 0600 socket. Minimal, standard FFI surface; needed for milestone 2.
libc = "0.2"
nix = { version = "0.29", features = ["fs", "user"] }
# RFC3339 timestamps for session metadata (milestone 3). Formatting only.
time = { version = "0.3", features = ["formatting"] }
vt100 = "0.16.2"
portable-pty = "0.9"
zbus = { version = "5.16", default-features = false, features = ["tokio"] }
pulldown-cmark = "0.12"
# Session identifiers need durable, globally collision-resistant generation.
ulid = "1"

# Single source of truth for the released version. Every crate opts in via
# `version.workspace = true`, so `scripts/release` only bumps it here.
[workspace.package]
version = "0.28.6"
edition = "2021"
license = "MIT"
rust-version = "1.96"

# Workspace-wide lint policy (M-STATIC-VERIFICATION). Every crate opts in via
# `[lints] workspace = true`, so the set lives here once instead of being
# duplicated as `#![warn(...)]` headers across crates. Per-crate `unsafe_code`
# posture stays as an inner attribute, since libs forbid it while the daemon/cli
# deny-with-localized-opt-in.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# Not part of the upstream set, but the project relied on it via per-crate
# headers before centralizing here.
unreachable_pub = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction-group lints that drive up consistency and brevity.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
# Replacement for the removed `string_to_string` lint from older guideline sets.
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Avoids false positives with the structured-logging message templates.
literal_string_with_formatting_args = "allow"

# Custom opt-outs (case-by-case, per M-STATIC-VERIFICATION). These are binary
# crates and unpublished internal libs, so the public-API doc lints below would
# be pure noise rather than catching real contract gaps.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Keep release builds debuggable enough for a daemon while small.
[profile.release]
opt-level = 2
