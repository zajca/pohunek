# pohunek Cargo workspace.
#
# Single-user, CLI-first tool: a daemon owns PTYs running coding agents; a CLI
# controls it over a local Unix socket using newline-delimited JSON.
#
# Layout and crate choices follow docs/plan-phase-1.md ("Tech Stack and Crates",
# "Cargo Workspace Layout"). Build-Order milestones 1-3 are implemented in this
# revision (socket + health, then PTY ownership and the session registry); later
# modules are stubs.
[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/netbird",
    "crates/daemon",
    "crates/cli",
]

# Shared dependency versions. Individual crates opt in via `workspace = true`.
# Crates shared across implemented milestones and current state-engine work are
# declared here as individual crates opt in.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
# Advisory file locking (flock) and socket-mode chmod for the single-instance
# lock and 0600 socket. Minimal, standard FFI surface; needed for milestone 2.
libc = "0.2"
# RFC3339 timestamps for session metadata (milestone 3). Formatting only.
time = { version = "0.3", features = ["formatting"] }
vt100 = "0.16.2"

# Single source of truth for the released version. Every crate opts in via
# `version.workspace = true`, so `scripts/release` only bumps it here.
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"

# Keep release builds debuggable enough for a daemon while small.
[profile.release]
opt-level = 2
