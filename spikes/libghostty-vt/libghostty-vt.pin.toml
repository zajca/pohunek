# Pins of the libghostty-vt build. `scripts/build-libghostty-vt` and `build.rs`
# read this file; nothing else downloads or compiles libghostty.

[library]
version = "1.0.2"
# Commit of the `vt-1.0.2` tag.
commit = "573c4a21e02311ae87844af26b6a7a179f82858e"

[source]
url = "https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2.tar.gz"
sha256 = "1dcafa8a3357f3a6bbf4f2696e61de611400c5469518716793dfffd35f008b3e"

[deps]
url = "https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2-deps.tar.gz"
sha256 = "c56156dbea82fdf71f13bf0d704cdf4393b6a04208d7f9691e0d7f60c7f9ca4d"

[zig]
# Must equal ZIG_VERSION in .github/workflows/ci.yml; a step of .github/workflows/libghostty-spike.yml checks it.
version = "0.17.0"
# Public key that signs the tarballs (PACKAGING-LIBGHOSTTY.md of the release).
minisign_public_key = "RWQlAjJC23149WL2sEpT/l0QKy7hMIFhYdQOFy0Z7z7PbneUgvlsnYcV"

[build]
optimize = "ReleaseFast"
cpu = "baseline"
strip = "true"
download_timeout_seconds = 300
# The two tarballs are about 10 MB together.
max_download_bytes = 67108864
# Kitty graphics are compiled out: the headless model renders no images and a
# program in the PTY can then never make the worker open a file.
vt_features = "-kitty-graphics"

# Rust target triple to Zig target.
[targets]
x86_64-unknown-linux-gnu = "x86_64-linux-gnu.2.39"
x86_64-unknown-linux-musl = "x86_64-linux-musl"
aarch64-apple-darwin = "aarch64-macos.14.0"
