# Source: sources/wide-chars.sh (4x10).

[[assertion]]
id = "wide-first-cell"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "East_Asian_Width W occupies two columns: U+4E2D starts at column 2 with width 2."
check = "cell"
row = 0
col = 2
text = "中"
width = 2

[[assertion]]
id = "wide-spacer-tail"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "The second column of a wide character is the trailing half of its cell."
check = "spacer_tail"
row = 0
col = 3
value = true

[[assertion]]
id = "second-wide-cell"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "The next wide character starts after the first one's two columns."
check = "cell"
row = 0
col = 4
text = "文"
width = 2

[[assertion]]
id = "narrow-after-wide"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "Narrow characters after two wide characters start at column 6."
check = "cell"
row = 0
col = 6
text = "c"
width = 1

[[assertion]]
id = "wide-at-last-column-wraps"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "A wide character cannot be split across rows, so one that does not fit in the last column moves to the next row and the row it left is soft-wrapped."
check = "row_wrapped"
row = 1
value = true

[[assertion]]
id = "wide-at-last-column-moved"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "The wide character that did not fit starts the next row with width 2."
check = "cell"
row = 2
col = 0
text = "中"
width = 2

[[assertion]]
id = "wide-at-last-column-left-blank"
basis = "spec"
source = "https://www.unicode.org/reports/tr11/"
rule = "The last column of the row the wide character left holds no character."
check = "cell"
row = 1
col = 9
text = ""

[[assertion]]
id = "final-cursor"
basis = "spec"
source = "https://ecma-international.org/publications-and-standards/standards/ecma-48"
rule = "A line feed with carriage return after the last printed line leaves the cursor at column 0 of the next row."
check = "cursor"
row = 3
col = 0
