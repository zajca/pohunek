# Standalone workspace: the root workspace never sees this crate, so no
# `--all-features` gate of the root builds it and the root lockfile is untouched.
[workspace]

[package]
name = "pohunek-libghostty-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Measurement spike: PTY trace format, recorder and screen-model comparison. Never shipped."
publish = false

[dependencies]
base64 = "0.22"
pohunek-terminal = { path = "../../crates/terminal" }
# The FFI crate that owns the unsafe libghostty-vt bindings (issue #2538 P2);
# the spike drives it through pohunek-terminal's `with_model` seam.
pohunek-terminal-ghostty-sys = { path = "../../crates/terminal-ghostty-sys", optional = true }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
vt100 = "=0.16.2"

# Links the prebuilt libghostty-vt static library named by LIBGHOSTTY_VT_DIR
# (see scripts/build-libghostty-vt). Off by default: no Zig, no C library.
[features]
libghostty = ["pohunek-terminal/libghostty", "pohunek-terminal-ghostty-sys/libghostty"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Optimized dev builds keep the replay of every fixture through every model fast.
[profile.dev]
opt-level = 2

# The workspace release profile (Cargo.toml of the repository root), so the
# size and speed numbers describe what the shipped binaries get.
[profile.release]
opt-level = 2
